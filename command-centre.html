<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Centre — Organ Works</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { touch-action: manipulation; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; }
    .focus-mode .dim-when-booking { opacity: 0.3; pointer-events: none; filter: grayscale(50%); }
    .booking-highlight { animation: pulse-green 1.5s ease-in-out infinite; }
    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    }
    .touch-target { min-height: 48px; min-width: 48px; }
    .loading-spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media print { .no-print { display: none !important; } body { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
    .scroll-panel { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    .scroll-panel::-webkit-scrollbar { width: 6px; }
    .scroll-panel::-webkit-scrollbar-track { background: transparent; }
    .scroll-panel::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

const getApiUrl = () => localStorage.getItem('organWorks_apiUrl') || '';
const setApiUrl = (url) => localStorage.setItem('organWorks_apiUrl', url);

const apiCall = async (action, params = {}) => {
  const API_URL = getApiUrl();
  if (!API_URL) throw new Error('API URL not configured');
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  Object.keys(params).forEach(key => {
    if (typeof params[key] === 'object') {
      url.searchParams.set(key, JSON.stringify(params[key]));
    } else {
      url.searchParams.set(key, params[key]);
    }
  });
  const response = await fetch(url.toString());
  const data = await response.json();
  if (data && data.error) throw new Error(data.error);
  return data;
};

const CommandCentre = () => {
  const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const DEFAULT_PRICES = { tuning_full: 550, tuning_half: 300, fault: 300, big: 550 };

  // State
  const [isConfigured, setIsConfigured] = useState(!!getApiUrl());
  const [configUrl, setConfigUrl] = useState('');
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  
  const [customers, setCustomers] = useState([]);
  const [contacts, setContacts] = useState([]);
  const [projects, setProjects] = useState([]);
  const [bookings, setBookings] = useState([]);
  const [daysOff, setDaysOff] = useState([]);
  const [tickets, setTickets] = useState([]);
  const [jobs, setJobs] = useState([]);
  const [timeEntries, setTimeEntries] = useState([]);
  const [materials, setMaterials] = useState([]);

  const [currentDate, setCurrentDate] = useState(new Date());
  const [selectedCustomerToBook, setSelectedCustomerToBook] = useState(null);
  const [selectedTicketToBook, setSelectedTicketToBook] = useState(null);
  const [selectedDay, setSelectedDay] = useState(null);
  const [view, setView] = useState('planner');
  const [selectedCustomer, setSelectedCustomer] = useState(null);
  const [bookingType, setBookingType] = useState('OTS');
  const [customQuote, setCustomQuote] = useState('');
  const [jobNotes, setJobNotes] = useState('');
  const [showAddTicket, setShowAddTicket] = useState(false);
  const [newTicketCustomer, setNewTicketCustomer] = useState('');
  const [newTicketDescription, setNewTicketDescription] = useState('');
  const [customerSearch, setCustomerSearch] = useState('');
  const [plannerSearch, setPlannerSearch] = useState('');
  const [showPlannerSearchResults, setShowPlannerSearchResults] = useState(false);
  const [showProjectSummary, setShowProjectSummary] = useState(null);
  
  // Invoice calculator
  const [showInvoiceCalc, setShowInvoiceCalc] = useState(null);
  const [selectedBand, setSelectedBand] = useState(null);
  const [selectedDistance, setSelectedDistance] = useState(null);
  const [customAmount, setCustomAmount] = useState('');
  const [pricing, setPricing] = useState({ timeBands: [], distanceBands: [] });
  const [invoiceMaterials, setInvoiceMaterials] = useState([]);
  const [newMaterialDesc, setNewMaterialDesc] = useState('');
  const [newMaterialCost, setNewMaterialCost] = useState('');
  const [materialsList, setMaterialsList] = useState([]);
  const [materialSearch, setMaterialSearch] = useState('');
  const [materialQty, setMaterialQty] = useState(1);
  const [newMaterialQty, setNewMaterialQty] = useState(1);
  const [selectedMaterial, setSelectedMaterial] = useState(null);

  // Project allocation
  const [allocatingProject, setAllocatingProject] = useState(null);
  const [showNewProject, setShowNewProject] = useState(false);
  const [newProjectName, setNewProjectName] = useState('');
  const [newProjectCustomer, setNewProjectCustomer] = useState(null);
  const [projectCustomerSearch, setProjectCustomerSearch] = useState('');
  const [newProjectEstDays, setNewProjectEstDays] = useState('');

  const currentYear = currentDate.getFullYear();
  const plannerMonths = monthNames.map((name, idx) => ({ name, year: currentYear, month: idx, days: new Date(currentYear, idx + 1, 0).getDate() }));

  // Data loading
  const loadData = useCallback(async () => {
    if (!getApiUrl()) return;
    setLoading(true);
    try {
      const data = await apiCall('getAllData');
      const parsedCustomers = (data.customers || []).map(c => ({
        ...c,
        tuningMonths: typeof c.tuningMonths === 'string' ? (c.tuningMonths ? JSON.parse(c.tuningMonths) : []) : (c.tuningMonths || []),
        customRate: c.customRate ? parseFloat(c.customRate) : null
      }));
      setCustomers(parsedCustomers);
      setContacts(data.contacts || []);
      setProjects(data.projects || []);
      const normalizedBookings = (data.bookings || []).map(b => ({ ...b, date: b.date ? b.date.split('T')[0] : b.date }));
      setBookings(normalizedBookings);
      setDaysOff((data.daysOff || []).map(d => d.date));
      setTickets(data.tickets || []);
      setPricing(data.pricing || { timeBands: [], distanceBands: [] });
      setMaterialsList(data.materialsList || []);
      setJobs(data.jobs || []);
      setTimeEntries(data.timeEntries || []);
      setMaterials(data.materials || []);
    } catch (err) {
      console.error('Failed to load data:', err);
      alert('Failed to load data: ' + err.message);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { if (isConfigured) loadData(); }, [isConfigured, loadData]);

  // Helper functions
  const getDateString = (year, month, day) => `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  const getDayOfWeek = (year, month, day) => new Date(year, month, day).getDay();
  const isWorkDay = (year, month, day) => { const dow = getDayOfWeek(year, month, day); return dow >= 1 && dow <= 5; };
  const getBookingsForDay = (date) => bookings.filter(b => b.date === date);
  const getCustomerById = (id) => customers.find(c => c.id === id);
  const isDayOff = (date) => daysOff.includes(date);
  const formatDate = (dateStr) => { if (!dateStr) return ''; const d = new Date(dateStr); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
  const formatCurrency = (amount) => '£' + (parseFloat(amount) || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const getJobTypeLabel = (type) => {
    if (type === 'OTS') return 'On-site (with helper)';
    if (type === 'TSC') return 'Solo Site Work';
    if (type === 'WS') return 'Workshop';
    if (type === 'project') return 'Project Day';
    if (type === 'tuning_full') return 'Tuning (Full Day)';
    if (type === 'tuning_half') return 'Tuning (Half Day)';
    if (type === 'fault') return 'Fault Visit';
    if (type === 'big') return 'Big Job';
    return type || 'Visit';
  };

  const getJobTypeColor = (type) => {
    if (type === 'OTS') return 'blue';
    if (type === 'TSC') return 'green';
    if (type === 'WS') return 'purple';
    if (type === 'project') return 'pink';
    if (type?.startsWith('tuning')) return 'blue';
    if (type === 'fault') return 'orange';
    if (type === 'big') return 'red';
    return 'gray';
  };

  const isCustomerBookedInMonth = (customerId, monthIndex, year) => {
    const monthStart = getDateString(year, monthIndex, 1);
    const monthEnd = getDateString(year, monthIndex, new Date(year, monthIndex + 1, 0).getDate());
    return bookings.some(b => b.customerId === customerId && b.date >= monthStart && b.date <= monthEnd);
  };

  const getCustomerHistory = (customerId) => bookings.filter(b => b.customerId === customerId).sort((a, b) => new Date(b.date) - new Date(a.date));
  const getLastTuningPrice = (customerId) => { const history = getCustomerHistory(customerId); const lastTuning = history.find(b => b.type?.startsWith('tuning') && b.status === 'paid'); return lastTuning ? parseFloat(lastTuning.price) : null; };

  const getJobsDue = () => {
    const now = new Date();
    const thisMonth = now.getMonth();
    const thisYear = now.getFullYear();
    const nextMonth = (thisMonth + 1) % 12;
    const nextYear = thisMonth === 11 ? thisYear + 1 : thisYear;
    const due = [];
    customers.forEach(customer => {
      if (!customer.tuningMonths || customer.tuningMonths.length === 0) return;
      if (customer.tuningMonths.includes(thisMonth) && !isCustomerBookedInMonth(customer.id, thisMonth, thisYear)) {
        due.push({ customer, month: thisMonth, year: thisYear, monthName: monthNames[thisMonth], urgent: true });
      }
      if (customer.tuningMonths.includes(nextMonth) && !isCustomerBookedInMonth(customer.id, nextMonth, nextYear)) {
        due.push({ customer, month: nextMonth, year: nextYear, monthName: monthNames[nextMonth], urgent: false });
      }
    });
    return due;
  };
  const jobsDue = getJobsDue();

  const getActiveProjects = () => {
    return projects.filter(p => p.status === 'active').map(p => {
      const allocatedDays = bookings.filter(b => b.type === 'project' && b.projectId === p.id).map(b => b.date);
      const projectJobs = jobs.filter(j => j.projectId === p.id);
      const jobIds = projectJobs.map(j => j.id);
      const projectTimeEntries = timeEntries.filter(te => jobIds.includes(te.jobId));
      const totalHours = projectTimeEntries.reduce((sum, te) => sum + (parseFloat(te.duration) || 0), 0);
      const projectMaterials = materials.filter(m => jobIds.includes(m.jobId));
      const materialsCost = projectMaterials.reduce((sum, m) => sum + (parseFloat(m.cost) || 0), 0);
      return { ...p, customerName: customers.find(c => c.id === p.customerId)?.name || 'Unknown', days: allocatedDays, jobs: projectJobs, totalHours, materialsCost, timeEntries: projectTimeEntries, materials: projectMaterials };
    });
  };
  const activeProjects = getActiveProjects();

  // ============================================================
  // REPORTS DATA CALCULATIONS
  // ============================================================
  
  const reportsData = useMemo(() => {
    const now = new Date();
    const thisYear = now.getFullYear();
    const thisMonth = now.getMonth();
    
    // Monthly breakdown
    const monthlyData = {};
    for (let m = 0; m < 12; m++) {
      monthlyData[m] = { invoiced: 0, paid: 0, outstanding: 0, count: 0 };
    }
    
    bookings.forEach(b => {
      if (!b.date) return;
      const d = new Date(b.date);
      if (d.getFullYear() !== thisYear) return;
      const month = d.getMonth();
      const price = parseFloat(b.price) || 0;
      monthlyData[month].count++;
      if (b.status === 'paid') {
        monthlyData[month].paid += price;
        monthlyData[month].invoiced += price;
      } else if (b.status === 'invoiced') {
        monthlyData[month].invoiced += price;
        monthlyData[month].outstanding += price;
      }
    });
    
    // Outstanding invoices (aged)
    const outstandingInvoices = bookings
      .filter(b => b.status === 'invoiced')
      .map(b => {
        const customer = getCustomerById(b.customerId);
        const invoiceDate = new Date(b.invoiceDate || b.date);
        const age = Math.floor((now - invoiceDate) / (1000 * 60 * 60 * 24));
        return { ...b, customerName: customer?.name || 'Unknown', age, invoiceDate };
      })
      .sort((a, b) => b.age - a.age);
    
    // Needs invoicing
    const needsInvoicing = bookings
      .filter(b => b.status === 'completed')
      .map(b => ({ ...b, customerName: getCustomerById(b.customerId)?.name || 'Unknown' }))
      .sort((a, b) => new Date(a.date) - new Date(b.date));
    
    // Awaiting payment
    const awaitingPayment = bookings
      .filter(b => b.status === 'invoiced')
      .map(b => ({ ...b, customerName: getCustomerById(b.customerId)?.name || 'Unknown' }));
    
    // Year to date
    const ytdBookings = bookings.filter(b => b.date && new Date(b.date).getFullYear() === thisYear);
    const ytdByType = {};
    ytdBookings.forEach(b => {
      const type = b.type || 'other';
      if (!ytdByType[type]) ytdByType[type] = { count: 0, revenue: 0 };
      ytdByType[type].count++;
      if (b.status === 'paid' || b.status === 'invoiced') {
        ytdByType[type].revenue += parseFloat(b.price) || 0;
      }
    });
    const ytdTotal = Object.values(ytdByType).reduce((sum, t) => sum + t.revenue, 0);
    const ytdPaid = bookings.filter(b => b.date && new Date(b.date).getFullYear() === thisYear && b.status === 'paid').reduce((sum, b) => sum + (parseFloat(b.price) || 0), 0);
    
    // Hours by month (from time entries and bookings)
    const hoursByMonth = {};
    for (let m = 0; m < 12; m++) hoursByMonth[m] = 0;
    bookings.forEach(b => {
      if (!b.date) return;
      const d = new Date(b.date);
      if (d.getFullYear() !== thisYear) return;
      const hours = parseFloat(b.actualHours) || 0;
      hoursByMonth[d.getMonth()] += hours;
    });
    timeEntries.forEach(te => {
      if (!te.startTime) return;
      const d = new Date(te.startTime);
      if (d.getFullYear() !== thisYear) return;
      hoursByMonth[d.getMonth()] += parseFloat(te.duration) || 0;
    });
    const totalHoursYTD = Object.values(hoursByMonth).reduce((a, b) => a + b, 0);
    
    // Utilisation
    const workDaysInYear = () => {
      let count = 0;
      for (let m = 0; m < 12; m++) {
        const daysInMonth = new Date(thisYear, m + 1, 0).getDate();
        for (let d = 1; d <= daysInMonth; d++) {
          const dow = new Date(thisYear, m, d).getDay();
          if (dow >= 1 && dow <= 3) count++; // Mon-Wed
        }
      }
      return count;
    };
    const totalWorkDays = workDaysInYear();
    const daysOffCount = daysOff.filter(d => d && new Date(d).getFullYear() === thisYear).length;
    const availableDays = totalWorkDays - daysOffCount;
    const bookedDays = new Set(bookings.filter(b => b.date && new Date(b.date).getFullYear() === thisYear).map(b => b.date)).size;
    const utilisation = availableDays > 0 ? Math.round((bookedDays / availableDays) * 100) : 0;
    
    // Customer revenue ranking
    const customerRevenue = {};
    bookings.forEach(b => {
      if (!b.customerId) return;
      if (!customerRevenue[b.customerId]) customerRevenue[b.customerId] = { total: 0, count: 0, name: getCustomerById(b.customerId)?.name || 'Unknown' };
      customerRevenue[b.customerId].count++;
      if (b.status === 'paid') customerRevenue[b.customerId].total += parseFloat(b.price) || 0;
    });
    const topCustomers = Object.entries(customerRevenue)
      .map(([id, data]) => ({ id, ...data }))
      .sort((a, b) => b.total - a.total)
      .slice(0, 20);
    
    // Tuning schedule overview
    const tuningSchedule = monthNames.map((name, idx) => {
      const customersThisMonth = customers.filter(c => c.tuningMonths && c.tuningMonths.includes(idx));
      const booked = customersThisMonth.filter(c => isCustomerBookedInMonth(c.id, idx, thisYear)).length;
      return { month: name, total: customersThisMonth.length, booked, remaining: customersThisMonth.length - booked };
    });
    
    // Overdue tunings
    const overdueTunings = [];
    customers.forEach(c => {
      if (!c.tuningMonths || c.tuningMonths.length === 0) return;
      c.tuningMonths.forEach(m => {
        if (m < thisMonth && !isCustomerBookedInMonth(c.id, m, thisYear)) {
          overdueTunings.push({ customer: c, dueMonth: monthNames[m], monthsOverdue: thisMonth - m });
        }
      });
    });
    overdueTunings.sort((a, b) => b.monthsOverdue - a.monthsOverdue);
    
    // Project profitability
    const projectProfitability = activeProjects.map(p => {
      const labourCost = p.totalHours * 45; // Workshop rate
      const totalCost = labourCost + p.materialsCost;
      const estimatedValue = (p.estimatedDays || 0) * 360; // Full day workshop rate
      const variance = estimatedValue - totalCost;
      return { ...p, labourCost, totalCost, estimatedValue, variance };
    });
    
    return {
      monthlyData,
      outstandingInvoices,
      needsInvoicing,
      awaitingPayment,
      ytdByType,
      ytdTotal,
      ytdPaid,
      hoursByMonth,
      totalHoursYTD,
      utilisation,
      bookedDays,
      availableDays,
      topCustomers,
      tuningSchedule,
      overdueTunings,
      projectProfitability
    };
  }, [bookings, customers, daysOff, timeEntries, jobs, materials, projects, activeProjects]);

  // ============================================================
  // BOOKING FUNCTIONS
  // ============================================================
  
  const addBooking = async (date, customerId, type, price, notes, ticket = null) => {
    setSaving(true);
    try {
      const result = await apiCall('addBooking', { data: { date, customerId, type, serviceType: type, price: price || 0, status: 'scheduled', notes: notes || '' } });
      setBookings([...bookings, { id: result.id, date, customerId, type, serviceType: type, price: price || 0, status: 'scheduled', notes: notes || '' }]);
      if (ticket) {
        await apiCall('updateTicket', { data: { id: ticket.id, status: 'scheduled', bookingId: result.id } });
        setTickets(tickets.filter(t => t.id !== ticket.id));
        setSelectedTicketToBook(null);
      }
      setSelectedCustomerToBook(null);
      setCustomQuote('');
      setJobNotes('');
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to save booking: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const removeBooking = async (date, bookingId) => {
    if (!confirm('Remove this booking?')) return;
    setSaving(true);
    try {
      await apiCall('deleteBooking', { bookingId });
      setBookings(bookings.filter(b => b.id !== bookingId));
      const ticketData = await apiCall('getTickets');
      setTickets(ticketData || []);
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to remove booking: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const updateBookingStatus = async (bookingId, status) => {
    setSaving(true);
    try {
      const updates = { id: bookingId, status };
      if (status === 'invoiced') updates.invoiceDate = new Date().toISOString().split('T')[0];
      if (status === 'paid') updates.paidDate = new Date().toISOString().split('T')[0];
      await apiCall('updateBooking', { data: updates });
      setBookings(bookings.map(b => b.id === bookingId ? { ...b, ...updates } : b));
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to update: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const toggleDayOff = async (date) => {
    setSaving(true);
    try {
      if (isDayOff(date)) {
        await apiCall('removeDayOff', { date });
        setDaysOff(daysOff.filter(d => d !== date));
      } else {
        await apiCall('addDayOff', { data: { date, reason: '' } });
        setDaysOff([...daysOff, date]);
      }
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to update day off: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const createProject = async () => {
    if (!newProjectName || !newProjectCustomer) return;
    setSaving(true);
    try {
      const result = await apiCall('addProject', { data: { customerId: newProjectCustomer.id, name: newProjectName, estimatedDays: newProjectEstDays ? parseInt(newProjectEstDays) : '', status: 'active' } });
      const newProject = { id: result.id, name: newProjectName, customerId: newProjectCustomer.id, customerName: newProjectCustomer.name, estimatedDays: newProjectEstDays ? parseInt(newProjectEstDays) : null, status: 'active', days: [] };
      setProjects([...projects, newProject]);
      setAllocatingProject(newProject);
      setShowNewProject(false);
      setNewProjectName('');
      setNewProjectCustomer(null);
      setProjectCustomerSearch('');
      setNewProjectEstDays('');
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to create project: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const deleteProject = async (projectId) => {
    if (!confirm('Delete this project? All allocated days will also be removed.')) return;
    setSaving(true);
    try {
      const projectBookings = bookings.filter(b => b.projectId === projectId);
      for (const booking of projectBookings) {
        await apiCall('deleteBooking', { bookingId: booking.id });
      }
      await apiCall('deleteProject', { projectId });
      setProjects(projects.filter(p => p.id !== projectId));
      setBookings(bookings.filter(b => b.projectId !== projectId));
      setShowProjectSummary(null);
      setAllocatingProject(null);
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to delete project: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const toggleProjectDay = async (dateStr) => {
    if (!allocatingProject) return;
    const existingBooking = bookings.find(b => b.type === 'project' && b.projectId === allocatingProject.id && b.date === dateStr);
    setSaving(true);
    try {
      if (existingBooking) {
        await apiCall('deleteBooking', { bookingId: existingBooking.id });
        setBookings(bookings.filter(b => b.id !== existingBooking.id));
      } else {
        const result = await apiCall('addBooking', { data: { date: dateStr, customerId: allocatingProject.customerId, type: 'project', serviceType: 'project', projectId: allocatingProject.id, projectName: allocatingProject.name, price: 0, status: 'scheduled', notes: allocatingProject.estimatedDays ? `Est: ${allocatingProject.estimatedDays} days` : allocatingProject.name } });
        setBookings([...bookings, { id: result.id, date: dateStr, customerId: allocatingProject.customerId, type: 'project', serviceType: 'project', projectId: allocatingProject.id, projectName: allocatingProject.name, estimatedDays: allocatingProject.estimatedDays, price: 0, status: 'scheduled', notes: allocatingProject.estimatedDays ? `Est: ${allocatingProject.estimatedDays} days` : allocatingProject.name }]);
      }
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to update project day: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const handleDayClick = (dateStr, year, month, day) => {
    if (!isWorkDay(year, month, day)) return;
    if (isDayOff(dateStr)) return;
    if (allocatingProject) { toggleProjectDay(dateStr); return; }

      setNewTicketCustomer('');

    const serviceType = showInvoiceCalc.serviceType || showInvoiceCalc.type || 'TSC';
    const band = pricing.timeBands.find(b => b.hours === selectedBand);
    const bandPrice = band ? (band[serviceType] || band.TSC || 0) : 0;
    const serviceCharge = customAmount ? parseFloat(customAmount) : bandPrice;
    const autoDistancePremium = pricing.distanceBands.find(d => (showInvoiceCalc.distance || 0) >= d.minMiles && (showInvoiceCalc.distance || 0) <= d.maxMiles)?.premium || 0;
    const distancePremium = selectedDistance !== null ? selectedDistance : autoDistancePremium;
    const materialsTotal = invoiceMaterials.reduce((sum, m) => sum + (m.cost * (m.quantity || 1)), 0);
    const total = serviceCharge + distancePremium + materialsTotal;
    
    return (
      <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 max-h-[90vh] overflow-y-auto">
          <div className="flex justify-between items-start mb-4">
            <div>
              <h2 className="text-2xl font-bold">💰 Invoice Calculator</h2>
              <p className="text-gray-600">{getCustomerById(showInvoiceCalc.customerId)?.name}</p>
            </div>
            <button onClick={() => setShowInvoiceCalc(null)} className="text-2xl text-gray-400 hover:text-gray-600">×</button>
          </div>
          
          <div className="bg-gray-100 rounded-lg p-4 mb-4">
            <div className="text-sm text-gray-600">Time on site</div>
            <div className="text-2xl font-bold">{showInvoiceCalc.actualHours ? `${Math.floor(showInvoiceCalc.actualHours)}h ${Math.round((showInvoiceCalc.actualHours % 1) * 60)}m` : 'Not recorded'}</div>
          </div>
          
          <div className="mb-4">
            <div className="text-sm text-gray-600 mb-2">Select time band:</div>
            <div className="grid grid-cols-5 gap-2">
              {pricing.timeBands.map(band => (
                <button key={band.hours} onClick={() => { setSelectedBand(band.hours); setCustomAmount(''); }} className={`p-3 rounded-lg text-center border-2 ${selectedBand === band.hours && !customAmount ? 'bg-blue-500 text-white border-blue-500' : 'bg-white border-gray-200'}`}>
                  <div className="font-bold">{band.hours}h</div>
                  <div className="text-sm">£{band[serviceType] || band.TSC || 0}</div>
                </button>
              ))}
            </div>
          </div>
          
          <div className="border-t-2 pt-4 mb-4">
            <div className="flex justify-between text-lg"><span>Service ({selectedBand}h)</span><span>£{serviceCharge}</span></div>
            <div className="flex justify-between text-lg"><span>Distance</span><span>+£{distancePremium}</span></div>
            <div className="flex justify-between text-2xl font-bold mt-2 pt-2 border-t"><span>Total</span><span className="text-green-600">{formatCurrency(total)}</span></div>
          </div>
          
          <div className="flex gap-3">
            <button onClick={() => setShowInvoiceCalc(null)} className="flex-1 py-3 bg-gray-200 rounded-lg font-medium">Cancel</button>
            <button onClick={async () => {
              setSaving(true);
              try {
                await apiCall('updateBooking', { data: { id: showInvoiceCalc.id, price: total, status: 'invoiced', invoiceDate: new Date().toISOString().split('T')[0] } });
                setBookings(bookings.map(b => b.id === showInvoiceCalc.id ? { ...b, price: total, status: 'invoiced', invoiceDate: new Date().toISOString().split('T')[0] } : b));
                setShowInvoiceCalc(null);
                setLastSaved(new Date());
              } catch (err) { alert('Failed: ' + err.message); }
              finally { setSaving(false); }
            }} className="flex-1 py-3 bg-green-500 text-white rounded-lg font-bold text-lg">✓ Confirm {formatCurrency(total)}</button>
          </div>
        </div>
      </div>
    );
  };

  // ============================================================
  // MAIN RENDER
  // ============================================================
  
  return (
    <div className="min-h-screen bg-gray-100 p-3 flex flex-col">
      {/* Header */}
      <div className="bg-white rounded-lg shadow-lg p-4 mb-3 no-print">
        <div className="flex flex-wrap items-center justify-between gap-4">
          <h1 className="text-3xl font-bold">🎹 COMMAND CENTRE</h1>
          
          {view === 'planner' && (
            <div className="relative">
              <input type="text" placeholder="🔍 Search customer..." value={plannerSearch} onChange={(e) => { setPlannerSearch(e.target.value); setShowPlannerSearchResults(e.target.value.length > 0); }} onFocus={() => setShowPlannerSearchResults(plannerSearch.length > 0)} className="w-64 px-4 py-2 border-2 rounded-lg" />
              {showPlannerSearchResults && plannerSearch && (
                <div className="absolute top-full left-0 right-0 bg-white border-2 rounded-b-lg shadow-lg max-h-64 overflow-y-auto z-50">
                  {customers.filter(c => c.name.toLowerCase().includes(plannerSearch.toLowerCase())).slice(0, 10).map(c => (
                    <div key={c.id} onClick={() => { setSelectedCustomerToBook(c); setBookingType('OTS'); setPlannerSearch(''); setShowPlannerSearchResults(false); }} className="p-3 hover:bg-blue-50 cursor-pointer border-b">
                      <div className="font-medium">{c.name}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
          
          <div className="flex gap-2">
            <button onClick={() => { setView('planner'); setSelectedDay(null); setSelectedCustomer(null); }} className={`px-5 py-3 rounded-lg text-lg font-bold touch-target ${view === 'planner' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>📅 Planner</button>
            <button onClick={() => { setView('reports'); }} className={`px-5 py-3 rounded-lg text-lg font-bold touch-target ${view === 'reports' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>📊 Reports</button>
            <button onClick={() => { setView('customers'); setSelectedCustomer(null); }} className={`px-5 py-3 rounded-lg text-lg font-bold touch-target ${view.includes('customer') ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>👥 Customers</button>
          </div>

          {view === 'planner' && (
            <div className="flex gap-2">
              <button onClick={() => setCurrentDate(new Date(currentYear - 1, 0, 1))} className="px-4 py-3 rounded-lg text-lg font-medium bg-gray-200 touch-target">← {currentYear - 1}</button>
              <button onClick={() => setCurrentDate(new Date())} className="px-4 py-3 rounded-lg text-lg font-medium bg-gray-800 text-white touch-target">{currentYear}</button>
              <button onClick={() => setCurrentDate(new Date(currentYear + 1, 0, 1))} className="px-4 py-3 rounded-lg text-lg font-medium bg-gray-200 touch-target">{currentYear + 1} →</button>
            </div>
          )}

          <button onClick={loadData} className="px-4 py-3 rounded-lg bg-gray-600 text-white text-lg touch-target" title="Refresh">🔄</button>
        </div>
      </div>

      {/* Main Content */}
      {view === 'planner' && (
        <div className="flex gap-3 flex-1">
          <JobsDuePanel />
          <div className="flex-1"><YearView /></div>
          {selectedDay && <DayPanel date={selectedDay} onClose={() => setSelectedDay(null)} />}
        </div>
      )}

      {view === 'reports' && <ReportsView />}
      {view === 'customers' && <CustomerListView />}
      {view === 'customerDetail' && selectedCustomer && <CustomerDetailView />}
      
      <InvoiceCalculatorModal />
      {showProjectSummary && <ProjectSummaryModal project={showProjectSummary} onClose={() => setShowProjectSummary(null)} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<CommandCentre />);
  </script>
</body>
</html>
