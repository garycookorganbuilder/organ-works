<!DOCTYPE html>
<!-- Site Tracker · 13 Oct 2026 (b) · open tickets shown at the visit; changes kept on the phone until confirmed; access key -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>On Site</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
    }
    
    .header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 2px solid #333;
      margin-bottom: 20px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 28px;
    }
    
    .date {
      color: #888;
      font-size: 18px;
      margin-top: 8px;
    }
    
    .loading {
      text-align: center;
      padding: 60px 20px;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #333;
      border-top-color: #4ade80;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .no-jobs {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }
    
    .no-jobs .icon {
      font-size: 60px;
      margin-bottom: 20px;
    }
    
    .job-card {
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border-left: 6px solid #3b82f6;
    }
    
    .job-card.fault {
      border-left-color: #f97316;
    }
    
    .job-card.solo {
      border-left-color: #10b981;
    }
    
    .job-card.workshop {
      border-left-color: #8b5cf6;
    }
    
    .job-card.active {
      border-left-color: #4ade80;
      background: #1a3a2e;
    }
    
    .job-card.completed {
      border-left-color: #666;
      opacity: 0.6;
    }
    
    .customer-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    
    .job-type {
      color: #888;
      font-size: 16px;
      margin-bottom: 4px;
    }
    
    .job-notes {
      color: #aaa;
      font-size: 14px;
      font-style: italic;
      margin-top: 8px;
    }
    
    .distance {
      color: #60a5fa;
      font-size: 14px;
      margin-top: 4px;
    }
    
    .time-info {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      font-size: 16px;
    }
    
    .time-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }
    
    .time-label {
      color: #888;
    }
    
    .time-value {
      font-weight: bold;
      color: #4ade80;
    }
    
    .elapsed {
      font-size: 32px;
      text-align: center;
      color: #4ade80;
      padding: 16px 0;
      font-family: monospace;
    }
    
    .btn {
      width: 100%;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 16px;
      min-height: 70px;
    }
    
    .btn-start {
      background: #4ade80;
      color: #000;
    }
    
    .btn-stop {
      background: #ef4444;
      color: #fff;
    }
    
    .btn-done {
      background: #666;
      color: #fff;
    }
    
    .btn:disabled {
      opacity: 0.5;
    }
    
    .materials-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #333;
    }
    
    .materials-title {
      font-size: 14px;
      color: #888;
      margin-bottom: 8px;
    }
    
    .material-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    
    .material-item .desc {
      color: #ccc;
    }
    
    .material-item .cost {
      color: #4ade80;
      font-weight: bold;
    }
    
    .material-item .remove-btn {
      color: #ef4444;
      background: none;
      border: none;
      font-size: 18px;
      padding: 0 0 0 12px;
      cursor: pointer;
    }
    
    .add-material {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    
    .add-material input {
      padding: 10px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }
    
    .add-material input.desc-input {
      flex: 1;
    }
    
    .add-material input.cost-input {
      width: 80px;
    }
    
    .add-material button {
      padding: 10px 16px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;

    }
    
    .materials-total {
      margin-top: 8px;
      text-align: right;
      color: #4ade80;
      font-weight: bold;
    }
    
    .material-search-wrapper {
      position: relative;
      margin: 10px 0;
    }
    
    .search-row {
      display: flex;
    }
    
    .material-search {
      width: 100%;
      padding: 12px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
    }
    
    .qty-input {
      width: 60px;
      padding: 12px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
    }
    
    .qty-add-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    
    .qty-label {
      color: #888;
      font-size: 14px;
    }
    
    .add-btn {
      flex: 1;
      padding: 14px 16px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;

    }
    
    .add-btn:disabled {
      background: #333;

    }
    
    .material-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1e293b;
      border: 2px solid #3b82f6;
      border-top: none;

      overflow-y: auto;

    }
    
    .material-dropdown.show {
      display: block;
    }
    
    .material-option {
      padding: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #333;
    }
    
    .material-option:hover {
      background: #3b82f6;
    }
    
    .material-option .name {
      color: #fff;
    }
    
    .material-option .price {
      color: #4ade80;
      font-weight: bold;
    }
    
    .add-material-manual {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .manual-label {
      color: #666;
      font-size: 12px;
      width: 100%;
      margin-bottom: 4px;
    }
    
    .add-material-manual input {
      padding: 10px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }
    
    .add-material-manual input.desc-input {
      flex: 1;
    }
    
    .add-material-manual input.cost-input {
      width: 80px;
    }
    
    .add-material-manual input.qty-input-manual {
      width: 50px;
      text-align: center;
    }
    
    .add-material-manual button {
      padding: 10px 16px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    
    .config-panel {
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      margin-top: 40px;
    }
    
    .config-panel h3 {
      margin-top: 0;
      color: #888;
      font-size: 14px;
      text-transform: uppercase;
    }
    
    .config-panel input {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      margin-bottom: 12px;
    }
    
    .config-panel button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    
    .while-there {
      background: rgba(245, 158, 11, 0.12);
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 12px;
      margin: 12px 0;
    }
    
    .while-there-title {
      font-size: 14px;
      font-weight: bold;
      color: #fbbf24;
      margin-bottom: 6px;
    }
    
    .while-there-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 15px;
      font-weight: normal;
    }
    
    .while-there-item button {
      flex-shrink: 0;
      min-height: 44px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: bold;
      background: #0f172a;
      color: #fff;
      border: 2px solid #f59e0b;
      border-radius: 10px;
    }
    
    .pending-banner {
      background: #f59e0b;
      color: #1a1a1a;
      font-weight: bold;
      font-size: 15px;
      line-height: 1.35;
      padding: 14px 16px;
      border-radius: 12px;
      margin: 0 56px 16px 0;
      cursor: pointer;
    }
    
    .pending-banner.offline {
      background: #475569;
      color: #fff;
    }
    
    .refresh-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      background: #333;
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }
    
    /* Ticket Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal {
      background: #16213e;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal h2 {
      margin: 0 0 20px 0;
      font-size: 20px;
    }
    
    .modal-field {
      margin-bottom: 16px;
    }
    
    .modal-field label {
      display: block;
      color: #888;
      font-size: 14px;
      margin-bottom: 6px;
    }
    
    .modal-field input,
    .modal-field select,
    .modal-field textarea {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #0f0f23;
      color: white;
    }
    
    .modal-field textarea {
      min-height: 80px;
      resize: vertical;
    }
    
    .modal-btns {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    
    .modal-btns button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    
    .modal-btns .save-btn {
      background: #22c55e;
      color: white;
    }
    
    .modal-btns .cancel-btn {
      background: #333;
      color: #888;
    }
    
    .btn-ticket {
      background: #f59e0b !important;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <button class="refresh-btn" onclick="loadTodaysBookings()">🔄</button>
  <div class="pending-banner" id="pendingBanner" style="display: none;" onclick="loadTodaysBookings()"></div>
  
  <div class="header">
    <h1>📍 On Site</h1>
    <div class="date" id="todayDate"></div>
  </div>
  
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>Loading today's jobs...</div>
    </div>
  </div>
  
  <!-- Ticket Modal -->
  <div class="modal-overlay" id="ticketModal">
    <div class="modal">
      <h2>📋 Add Ticket</h2>
      <div class="modal-field">
        <label>Customer</label>
        <input type="text" id="ticketCustomerName" readonly>
        <input type="hidden" id="ticketCustomerId">
      </div>
      <div class="modal-field">
        <label>Type</label>
        <select id="ticketType">
          <option value="fault">⚠️ Fault</option>
          <option value="quote">💰 Quote Required</option>
          <option value="reminder">🔔 Reminder</option>
          <option value="part-return">🔧 Part to Return</option>
          <option value="follow-up">📞 Follow Up</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Description</label>
        <textarea id="ticketDescription" placeholder="What needs to be done?"></textarea>
      </div>
      <div class="modal-field">
        <label>When to surface:</label>
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
          <button type="button" id="btnNextVisit" onclick="setDueType('next-visit')" style="flex: 1; padding: 10px; border: 2px solid #333; border-radius: 8px; background: #22c55e; color: white; font-weight: bold;">📅 Next Visit</button>
          <button type="button" id="btnMonth" onclick="setDueType('month')" style="flex: 1; padding: 10px; border: 2px solid #333; border-radius: 8px; background: #333; color: #888;">🗓️ Specific Month</button>
        </div>
        <input type="month" id="ticketDueDate" style="display: none;">
      </div>
      <input type="hidden" id="ticketDueType" value="next-visit">
      <div class="modal-btns">
        <button class="cancel-btn" onclick="closeTicketModal()">Cancel</button>
        <button class="save-btn" onclick="saveTicket()">Save</button>
      </div>
    </div>
  </div>
  
  <div class="config-panel" id="configPanel" style="display: none;">
    <h3 id="configTitle">Setup</h3>
    <input type="text" id="apiUrl" placeholder="Google Apps Script URL">
    <input type="text" id="apiKey" placeholder="Access key (only if you have set one)" autocapitalize="off" autocomplete="off" spellcheck="false">
    <button onclick="saveConfig()">Connect</button>
  </div>

  <script>
    // Config
    const getApiUrl = () => localStorage.getItem('organWorks_apiUrl') || '';
    const setApiUrl = (url) => localStorage.setItem('organWorks_apiUrl', url);
    const getApiKey = () => localStorage.getItem('organWorks_apiKey') || '';
    const setApiKey = (key) => localStorage.setItem('organWorks_apiKey', key);
    
    // Things kept on this phone
    const TIMERS_KEY = 'organWorks_activeTimers';   // clocks that are running
    const PENDING_KEY = 'organWorks_pendingSaves';  // changes not yet confirmed by the sheet
    const CACHE_KEY = 'organWorks_cachedDay';       // today's list, for when there is no signal
    
    // State
    let bookings = [];
    let customers = [];
    let tickets = []; // open tickets, shown on the customer's visit
    let activeTimers = {}; // bookingId -> startTime
    let bookingMaterials = {}; // bookingId -> [{description, cost}]
    let materialsList = []; // quick-pick list from sheet
    let elapsedIntervals = {};
    let usingCache = false; // true when showing the saved list because the sheet could not be reached
    let flushing = false;
    
    function readStore(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }
    
    function writeStore(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.error('Could not save on this phone:', e);
      }
    }
    
    function todayString() {
      const today = new Date();
      return today.getFullYear() + '-' + 
        String(today.getMonth() + 1).padStart(2, '0') + '-' + 
        String(today.getDate()).padStart(2, '0');
    }
    
    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    
    const TICKET_ICONS = { tuning: '🎹', fault: '⚠️', quote: '💰', reminder: '🔔', 'part-return': '🔧', 'follow-up': '📞' };
    
    function isValidTime(value) {
      return !!value && value !== '' && !isNaN(new Date(value).getTime());
    }
    
    const loadPending = () => readStore(PENDING_KEY, []);
    
    function savePending(list) {
      writeStore(PENDING_KEY, list);
      updateBanner();
    }
    
    function saveTimers() {
      writeStore(TIMERS_KEY, activeTimers);
    }
    
    function saveCache() {
      writeStore(CACHE_KEY, { date: todayString(), bookings: bookings, customers: customers, materialsList: materialsList, tickets: tickets });
    }
    
    // Init
    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      document.getElementById('todayDate').textContent = today.toLocaleDateString('en-GB', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      });
      
      // Clocks that were running when the page was last open
      activeTimers = readStore(TIMERS_KEY, {});
      
      if (!getApiUrl()) {
        document.getElementById('configPanel').style.display = 'block';
        document.getElementById('content').innerHTML = '<div class="no-jobs"><div class="icon">⚙️</div><div>Enter your API URL below to connect</div></div>';
      } else {
        loadTodaysBookings();
      }
      
      // Try again whenever signal comes back, the page is reopened, or every 30 seconds
      window.addEventListener('online', () => flushPending());
      document.addEventListener('visibilitychange', () => { if (!document.hidden) flushPending(); });
      setInterval(() => { if (loadPending().length > 0) flushPending(); }, 30000);
    });
    
    function saveConfig() {
      const url = document.getElementById('apiUrl').value.trim() || getApiUrl();
      const key = document.getElementById('apiKey').value.trim();
      if (url) {
        setApiUrl(url);
        if (key) setApiKey(key);
        document.getElementById('configPanel').style.display = 'none';
        loadTodaysBookings();
      }
    }
    
    function showKeyPrompt() {
      document.getElementById('configTitle').textContent = 'Access key needed';
      document.getElementById('apiUrl').value = getApiUrl();
      document.getElementById('configPanel').style.display = 'block';
    }
    
    async function apiCall(action, params = {}) {
      const API_URL = getApiUrl();
      if (!API_URL) throw new Error('API URL not configured');
      
      const url = new URL(API_URL);
      url.searchParams.set('action', action);
      const key = getApiKey();
      if (key) url.searchParams.set('key', key);
      
      Object.keys(params).forEach(key => {
        if (typeof params[key] === 'object') {
          url.searchParams.set(key, JSON.stringify(params[key]));
        } else {
          url.searchParams.set(key, params[key]);
        }
      });
      
      const response = await fetch(url.toString());
      const data = await response.json();
      
      if (data && data.error) {
        // The sheet answered and said no. (No signal never gets this far.)
        const needKey = data.error === 'ACCESS_KEY_REQUIRED';
        const err = new Error(needKey ? 'Access key needed' : data.error);
        err.server = true;
        err.needKey = needKey;
        throw err;
      }
      
      return data;
    }
    
    // ------------------------------------------------------------
    // Saving changes safely
    // Every change is written to this phone first, then sent to the
    // sheet. It is only removed from the phone once the sheet has
    // confirmed it, so a visit's hours cannot be lost to bad signal.
    // ------------------------------------------------------------
    
    async function send(action, params) {
      const list = loadPending();
      list.push({ action: action, params: params, at: new Date().toISOString() });
      savePending(list);
      await flushPending();
      if (loadPending().length > 0) await flushPending();
      return loadPending().length === 0;
    }
    
    async function flushPending() {
      if (flushing) return;
      flushing = true;
      try {
        while (true) {
          const list = loadPending();
          if (list.length === 0) break;
          const item = list[0];
          try {
            await apiCall(item.action, item.params);
          } catch (err) {
            if (err.needKey) { showKeyPrompt(); break; }
            if (!err.server) break; // no signal - leave it on the phone and try again later
            // The sheet refused this one change. Tell Gary, then carry on with the rest.
            console.error('Change refused by the sheet:', item, err);
            alert('One change could not be saved: ' + err.message);
          }
          const remaining = loadPending();
          remaining.shift();
          savePending(remaining);
        }
      } finally {
        flushing = false;
        updateBanner();
      }
    }
    
    function updateBanner() {
      const banner = document.getElementById('pendingBanner');
      if (!banner) return;
      const count = loadPending().length;
      if (count > 0) {
        banner.className = 'pending-banner';
        banner.textContent = '⏳ ' + count + (count === 1 ? ' change is' : ' changes are') + ' saved on this phone and will send when there is signal. Tap to try now.';
        banner.style.display = 'block';
      } else if (usingCache) {
        banner.className = 'pending-banner offline';
        banner.textContent = '📴 No signal. Showing the list saved earlier today. Tap to try again.';
        banner.style.display = 'block';
      } else {
        banner.style.display = 'none';
      }
    }
    
    // Changes still waiting on the phone are newer than what the sheet says
    function applyPending(list) {
      loadPending().forEach(item => {
        if (item.action === 'updateTicket' && item.params && item.params.data && item.params.data.status === 'closed') {
          tickets = tickets.filter(t => t.id !== item.params.data.id);
          return;
        }
        if (item.action !== 'updateBooking' || !item.params || !item.params.data) return;
        const booking = list.find(b => b.id === item.params.data.id);
        if (booking) Object.assign(booking, item.params.data);
      });
    }
    
    // Keep this phone's running clocks in step with the sheet
    function syncTimers() {
      bookings.forEach(b => {
        const started = isValidTime(b.actualStartTime);
        const ended = isValidTime(b.actualEndTime);
        if (ended && activeTimers[b.id]) {
          delete activeTimers[b.id]; // finished already
        } else if (!ended && started && b.status === 'in_progress' && !activeTimers[b.id]) {
          activeTimers[b.id] = new Date(b.actualStartTime).toISOString(); // started earlier, this phone had forgotten
        }
      });
      saveTimers();
    }
    
    async function loadTodaysBookings() {
      document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading...</div></div>';
      
      // Send anything still waiting before reading the sheet
      await flushPending();
      
      const todayStr = todayString();
      
      try {
        const data = await apiCall('getAllData');
        customers = data.customers || [];
        materialsList = data.materialsList || [];
        tickets = (data.tickets || []).filter(t => t.status === 'new');
        
        // Filter bookings for today
        bookings = (data.bookings || []).filter(b => {
          const bookingDate = b.date ? b.date.split('T')[0] : '';
          return bookingDate === todayStr;
        });
        
        applyPending(bookings);
        usingCache = false;
        saveCache();
        
      } catch (err) {
        if (err.needKey) showKeyPrompt();
        
        // Could not reach the sheet: fall back to the list saved earlier today
        const cache = readStore(CACHE_KEY, null);
        if (cache && cache.date === todayStr) {
          bookings = cache.bookings || [];
          customers = cache.customers || [];
          materialsList = cache.materialsList || [];
          tickets = cache.tickets || [];
          usingCache = true;
        } else {
          document.getElementById('content').innerHTML = `
            <div class="no-jobs">
              <div class="icon">❌</div>
              <div>Could not load today's jobs: ${err.message}</div>
            </div>
          `;
          document.getElementById('apiUrl').value = getApiUrl();
          document.getElementById('configPanel').style.display = 'block';
          updateBanner();
          return;
        }
      }
      
      syncTimers();
      
      // Load existing materials for each booking
      bookingMaterials = {};
      bookings.forEach(b => {
        if (b.materials) {
          try {
            bookingMaterials[b.id] = JSON.parse(b.materials);
          } catch (e) {
            bookingMaterials[b.id] = [];
          }
        } else {
          bookingMaterials[b.id] = [];
        }
      });
      
      renderBookings();
      updateBanner();
    }
    
    function getCustomerById(id) {
      return customers.find(c => c.id === id) || { name: 'Unknown' };
    }
    
    function getJobTypeLabel(type) {
      // New service types
      if (type === 'OTS') return 'On-site (with helper)';
      if (type === 'TSC') return 'Solo Site Work';
      if (type === 'WS') return 'Workshop';
      // Legacy types
      if (type === 'tuning_full') return 'Tuning (Full Day)';
      if (type === 'tuning_half') return 'Tuning (Half Day)';
      if (type === 'fault') return 'Fault Visit';
      if (type === 'big') return 'Big Job';
      return type || 'Visit';
    }
    
    function formatTime(date) {
      return date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }
    
    function formatElapsed(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }
    
    function renderBookings() {
      if (bookings.length === 0) {
        document.getElementById('content').innerHTML = `
          <div class="no-jobs">
            <div class="icon">📅</div>
            <div>No jobs booked today</div>
          </div>
        `;
        return;
      }
      
      let html = '';
      
      bookings.forEach(booking => {
        const customer = getCustomerById(booking.customerId);
        const isActive = activeTimers[booking.id];
        // Check for valid date, not just truthy (empty string is falsy but comes from sheet as truthy)
        const isCompleted = isValidTime(booking.actualEndTime);
        
        let cardClass = 'job-card';
        if (booking.type === 'TSC') cardClass += ' solo';
        if (booking.type === 'WS') cardClass += ' workshop';
        if (booking.type === 'fault') cardClass += ' fault'; // legacy
        if (isActive) cardClass += ' active';
        if (isCompleted) cardClass += ' completed';
        
        html += `<div class="${cardClass}" id="card-${booking.id}">`;
        html += `<div class="customer-name">${customer.name}</div>`;
        html += `<div class="job-type">${getJobTypeLabel(booking.type)}</div>`;
        
        if (customer.distance) {
          html += `<div class="distance">📍 ${customer.distance} miles from workshop</div>`;
        }
        
        if (booking.notes) {
          html += `<div class="job-notes">"${escapeHtml(booking.notes)}"</div>`;
        }
        
        // Open tickets for this customer: things to do or check while here
        const openTickets = tickets.filter(t => t.customerId === booking.customerId);
        if (openTickets.length > 0) {
          html += `<div class="while-there"><div class="while-there-title">📋 While you're here</div>`;
          openTickets.forEach(t => {
            html += `<div class="while-there-item">
              <span>${TICKET_ICONS[t.type] || '📋'} ${escapeHtml(t.description)}</span>
              <button onclick="closeTicket('${escapeHtml(t.id)}')">✓ Done</button>
            </div>`;
          });
          html += `</div>`;
        }
        
        // Time info
        if (isActive || isCompleted) {
          html += '<div class="time-info">';
          
          if (isActive) {
            const startTime = new Date(activeTimers[booking.id]);
            html += `<div class="time-row"><span class="time-label">Started</span><span class="time-value">${formatTime(startTime)}</span></div>`;
            html += `<div class="elapsed" id="elapsed-${booking.id}">0:00:00</div>`;
          }
          
          if (isCompleted) {
            const start = new Date(booking.actualStartTime);
            const end = new Date(booking.actualEndTime);
            const duration = (end - start) / (1000 * 60 * 60);
            html += `<div class="time-row"><span class="time-label">Started</span><span class="time-value">${formatTime(start)}</span></div>`;
            html += `<div class="time-row"><span class="time-label">Finished</span><span class="time-value">${formatTime(end)}</span></div>`;
            html += `<div class="time-row"><span class="time-label">Duration</span><span class="time-value">${duration.toFixed(2)} hrs</span></div>`;
          }
          
          html += '</div>';
        }
        
        // Buttons
        if (!isActive && !isCompleted) {
          html += `<button class="btn btn-start" onclick="startJob('${booking.id}')">▶️ ARRIVED</button>`;
        } else if (isActive) {
          html += `<button class="btn btn-stop" onclick="stopJob('${booking.id}')">⏹️ FINISHED</button>`;
          html += `<button class="btn btn-ticket" onclick="openTicketModal('${booking.customerId}', '${customer.name.replace(/'/g, "\\'")}')">📋 Add Ticket</button>`;
        } else {
          html += `<button class="btn btn-done" disabled>✓ Complete</button>`;
          html += `<button class="btn btn-ticket" onclick="openTicketModal('${booking.customerId}', '${customer.name.replace(/'/g, "\\'")}')">📋 Add Ticket</button>`;
        }
        
        // Materials section (show when active or completed)
        if (isActive || isCompleted) {
          const materials = bookingMaterials[booking.id] || [];
          const materialsTotal = materials.reduce((sum, m) => sum + (parseFloat(m.cost) * (m.quantity || 1)), 0);
          
          html += `<div class="materials-section">`;
          html += `<div class="materials-title">🔧 Materials / Parts</div>`;
          
          // List existing materials
          materials.forEach((mat, idx) => {
            const qty = mat.quantity || 1;
            const lineTotal = (parseFloat(mat.cost) * qty).toFixed(2);
            html += `<div class="material-item">
              <span class="desc">${mat.description} ${qty > 1 ? `×${qty}` : ''}</span>
              <span class="cost">£${lineTotal}</span>
              <button class="remove-btn" onclick="removeMaterial('${booking.id}', ${idx})">✕</button>
            </div>`;
          });
          
          // Searchable dropdown with quantity
          html += `<div class="material-search-wrapper">
            <div class="search-row">
              <input type="text" class="material-search" id="mat-search-${booking.id}" 
                     placeholder="Search materials..." 
                     oninput="filterMaterials('${booking.id}')"
                     onfocus="showMaterialDropdown('${booking.id}')"
                     autocomplete="off">
            </div>
            <div class="material-dropdown" id="mat-dropdown-${booking.id}"></div>
            <div class="qty-add-row">
              <span class="qty-label">Qty:</span>
              <input type="number" class="qty-input" id="mat-qty-${booking.id}" value="1" min="1">
              <button class="add-btn" id="mat-add-btn-${booking.id}" onclick="addSelectedMaterial('${booking.id}')" disabled>Add Material</button>
            </div>
            <input type="hidden" id="mat-selected-name-${booking.id}">
            <input type="hidden" id="mat-selected-price-${booking.id}">
          </div>`;
          
          // Manual add (for items not in list)
          html += `<div class="add-material-manual">
            <span class="manual-label">Not listed?</span>
            <input type="text" class="desc-input" id="mat-desc-${booking.id}" placeholder="Description">
            <input type="number" class="cost-input" id="mat-cost-${booking.id}" placeholder="£">
            <input type="number" class="qty-input-manual" id="mat-qty-manual-${booking.id}" value="1" min="1" placeholder="Qty">
            <button onclick="addMaterial('${booking.id}')">+</button>
          </div>`;
          
          if (materialsTotal > 0) {
            html += `<div class="materials-total">Total: £${materialsTotal.toFixed(2)}</div>`;
          }
          
          html += `</div>`;
        }
        
        html += '</div>';
      });
      
      document.getElementById('content').innerHTML = html;
      
      // Start elapsed time counters for active jobs
      Object.keys(activeTimers).forEach(bookingId => {
        startElapsedCounter(bookingId);
      });
    }
    
    function startElapsedCounter(bookingId) {
      if (elapsedIntervals[bookingId]) {
        clearInterval(elapsedIntervals[bookingId]);
      }
      
      const startTime = new Date(activeTimers[bookingId]);
      const el = document.getElementById(`elapsed-${bookingId}`);
      
      if (el) {
        elapsedIntervals[bookingId] = setInterval(() => {
          const now = new Date();
          const elapsed = now - startTime;
          el.textContent = formatElapsed(elapsed);
        }, 1000);
      }
    }
    
    async function startJob(bookingId) {
      const now = new Date();
      activeTimers[bookingId] = now.toISOString();
      saveTimers();
      
      const booking = bookings.find(b => b.id === bookingId);
      if (booking) {
        booking.actualStartTime = now.toISOString();
        booking.status = 'in_progress';
      }
      saveCache();
      renderBookings();
      
      await send('updateBooking', {
        data: {
          id: bookingId,
          actualStartTime: now.toISOString(),
          status: 'in_progress'
        }
      });
    }
    
    async function stopJob(bookingId) {
      if (!activeTimers[bookingId]) return;
      
      const now = new Date();
      const startTime = new Date(activeTimers[bookingId]);
      const durationHours = Math.round(((now - startTime) / (1000 * 60 * 60)) * 100) / 100;
      
      const change = {
        id: bookingId,
        actualStartTime: startTime.toISOString(),
        actualEndTime: now.toISOString(),
        actualHours: durationHours,
        status: 'completed'
      };
      
      // 1. Write the finished visit to this phone's waiting list (happens straight away)
      const sending = send('updateBooking', { data: change });
      
      // 2. Show it as finished here
      const booking = bookings.find(b => b.id === bookingId);
      if (booking) Object.assign(booking, change);
      saveCache();
      
      // 3. Only now is it safe to clear the clock
      delete activeTimers[bookingId];
      saveTimers();
      
      if (elapsedIntervals[bookingId]) {
        clearInterval(elapsedIntervals[bookingId]);
        delete elapsedIntervals[bookingId];
      }
      
      renderBookings();
      await sending;
    }
    
    async function addMaterial(bookingId) {
      const descInput = document.getElementById(`mat-desc-${bookingId}`);
      const costInput = document.getElementById(`mat-cost-${bookingId}`);
      const qtyInput = document.getElementById(`mat-qty-manual-${bookingId}`);
      
      const description = descInput.value.trim();
      const cost = parseFloat(costInput.value);
      const quantity = parseInt(qtyInput?.value) || 1;
      
      if (!description || isNaN(cost) || cost <= 0) {
        alert('Please enter description and cost');
        return;
      }
      
      // Add to local state
      if (!bookingMaterials[bookingId]) {
        bookingMaterials[bookingId] = [];
      }
      bookingMaterials[bookingId].push({ description, cost, quantity });
      
      // Clear inputs
      descInput.value = '';
      costInput.value = '';
      if (qtyInput) qtyInput.value = '1';
      
      // Save to database
      await saveMaterials(bookingId);
      
      renderBookings();
    }
    
    async function quickAddMaterial(bookingId, description, cost) {
      // Add to local state
      if (!bookingMaterials[bookingId]) {
        bookingMaterials[bookingId] = [];
      }
      bookingMaterials[bookingId].push({ description, cost });
      
      // Save to database
      await saveMaterials(bookingId);
      
      renderBookings();
    }
    
    function showMaterialDropdown(bookingId) {
      filterMaterials(bookingId);
      const dropdown = document.getElementById(`mat-dropdown-${bookingId}`);
      if (dropdown) dropdown.classList.add('show');
    }
    
    function hideMaterialDropdown(bookingId) {
      const dropdown = document.getElementById(`mat-dropdown-${bookingId}`);
      if (dropdown) dropdown.classList.remove('show');
    }
    
    function filterMaterials(bookingId) {
      const searchInput = document.getElementById(`mat-search-${bookingId}`);
      const dropdown = document.getElementById(`mat-dropdown-${bookingId}`);
      if (!searchInput || !dropdown) return;
      
      const query = searchInput.value.toLowerCase();
      const filtered = materialsList.filter(m => 
        m.name.toLowerCase().includes(query)
      );
      
      if (filtered.length === 0) {
        dropdown.innerHTML = '<div class="material-option"><span class="name">No matches</span></div>';
      } else {
        dropdown.innerHTML = filtered.map(mat => `
          <div class="material-option" onclick="selectMaterial('${bookingId}', '${mat.name.replace(/'/g, "\\'")}', ${mat.price})">
            <span class="name">${mat.name}</span>
            <span class="price">£${parseFloat(mat.price).toFixed(2)}</span>
          </div>
        `).join('');
      }
      
      dropdown.classList.add('show');
    }
    
    async function selectMaterial(bookingId, name, price) {
      // Store selected item
      const searchInput = document.getElementById(`mat-search-${bookingId}`);
      const nameInput = document.getElementById(`mat-selected-name-${bookingId}`);
      const priceInput = document.getElementById(`mat-selected-price-${bookingId}`);
      const addBtn = document.getElementById(`mat-add-btn-${bookingId}`);
      
      if (searchInput) searchInput.value = name;
      if (nameInput) nameInput.value = name;
      if (priceInput) priceInput.value = price;
      if (addBtn) addBtn.disabled = false;
      
      hideMaterialDropdown(bookingId);
    }
    
    async function addSelectedMaterial(bookingId) {
      const nameInput = document.getElementById(`mat-selected-name-${bookingId}`);
      const priceInput = document.getElementById(`mat-selected-price-${bookingId}`);
      const qtyInput = document.getElementById(`mat-qty-${bookingId}`);
      const searchInput = document.getElementById(`mat-search-${bookingId}`);
      const addBtn = document.getElementById(`mat-add-btn-${bookingId}`);
      
      const name = nameInput?.value;
      const price = parseFloat(priceInput?.value);
      const quantity = parseInt(qtyInput?.value) || 1;
      
      if (!name || isNaN(price)) return;
      
      // Add material
      if (!bookingMaterials[bookingId]) {
        bookingMaterials[bookingId] = [];
      }
      bookingMaterials[bookingId].push({ description: name, cost: price, quantity: quantity });
      
      // Clear and reset
      if (searchInput) searchInput.value = '';
      if (nameInput) nameInput.value = '';
      if (priceInput) priceInput.value = '';
      if (qtyInput) qtyInput.value = '1';
      if (addBtn) addBtn.disabled = true;
      
      // Save to database
      await saveMaterials(bookingId);
      
      renderBookings();
    }
    
    // Close dropdowns when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.material-search-wrapper')) {
        document.querySelectorAll('.material-dropdown').forEach(d => d.classList.remove('show'));
      }
    });
    
    async function removeMaterial(bookingId, index) {
      if (!bookingMaterials[bookingId]) return;
      
      bookingMaterials[bookingId].splice(index, 1);
      
      await saveMaterials(bookingId);
      
      renderBookings();
    }
    
    async function saveMaterials(bookingId) {
      const materialsJson = JSON.stringify(bookingMaterials[bookingId] || []);
      const booking = bookings.find(b => b.id === bookingId);
      if (booking) booking.materials = materialsJson;
      saveCache();
      
      await send('updateBooking', {
        data: {
          id: bookingId,
          materials: materialsJson
        }
      });
    }
    
    // Mark a ticket as done. It leaves the list but stays in the sheet (status "closed").
    async function closeTicket(ticketId) {
      tickets = tickets.filter(t => t.id !== ticketId);
      saveCache();
      renderBookings();
      await send('updateTicket', { data: { id: ticketId, status: 'closed' } });
    }
    
    // Ticket Modal Functions
    function openTicketModal(customerId, customerName) {
      document.getElementById('ticketCustomerId').value = customerId;
      document.getElementById('ticketCustomerName').value = customerName;
      document.getElementById('ticketType').value = 'fault';
      document.getElementById('ticketDescription').value = '';
      document.getElementById('ticketDueDate').value = '';
      document.getElementById('ticketDueType').value = 'next-visit';
      setDueType('next-visit');
      document.getElementById('ticketModal').classList.add('active');
    }
    
    function setDueType(type) {
      document.getElementById('ticketDueType').value = type;
      const btnNext = document.getElementById('btnNextVisit');
      const btnMonth = document.getElementById('btnMonth');
      const dateInput = document.getElementById('ticketDueDate');
      
      if (type === 'next-visit') {
        btnNext.style.background = '#22c55e';
        btnNext.style.color = 'white';
        btnMonth.style.background = '#333';
        btnMonth.style.color = '#888';
        dateInput.style.display = 'none';
      } else {
        btnNext.style.background = '#333';
        btnNext.style.color = '#888';
        btnMonth.style.background = '#22c55e';
        btnMonth.style.color = 'white';
        dateInput.style.display = 'block';
      }
    }
    
    function closeTicketModal() {
      document.getElementById('ticketModal').classList.remove('active');
    }
    
    async function saveTicket() {
      const customerId = document.getElementById('ticketCustomerId').value;
      const type = document.getElementById('ticketType').value;
      const description = document.getElementById('ticketDescription').value;
      const dueType = document.getElementById('ticketDueType').value;
      const dueMonth = document.getElementById('ticketDueDate').value;
      
      if (!description.trim()) {
        alert('Please enter a description');
        return;
      }
      
      const sent = await send('addTicket', {
        data: {
          customerId: customerId,
          type: type,
          description: description,
          dueDate: dueType === 'next-visit' ? '' : (dueMonth ? dueMonth + '-01' : ''),
          dueType: dueType,
          status: 'new'
        }
      });
      
      closeTicketModal();
      alert(sent ? '✅ Ticket saved!' : '📋 Ticket kept on this phone. It will send when there is signal.');
    }
  </script>
</body>
