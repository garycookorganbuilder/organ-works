  // ============================================================

  const updateCustomer = async (customer) => {
    const originalCustomer = customers.find(c => c.id === customer.id);
    
    // OPTIMISTIC
    setCustomers(prev => prev.map(c => c.id === customer.id ? customer : c));
    
    startBgSave();
    try {
      await apiCall('updateCustomer', { data: JSON.stringify({ 
        id: customer.id,
        name: customer.name,
        notes: customer.notes,
        customRate: customer.customRate,
        tuningMonths: customer.tuningMonths || [],
        tuningNotes: customer.tuningNotes,
        tuningGroup: customer.tuningGroup || '',
        distance: customer.distance
      }) });
      endBgSave(true);
    } catch (err) {
      if (originalCustomer) {
        setCustomers(prev => prev.map(c => c.id === customer.id ? originalCustomer : c));
      }
      endBgSave(false, err.message);
    }
  };

  const addCustomer = async () => {
    if (!newCustomerName) return;
    
    const tempId = generateTempId();
    const newCust = { 
      id: tempId, 
      name: newCustomerName, 
      notes: newCustomerAddress,
      customRate: newCustomerRate ? parseFloat(newCustomerRate) : null,
      tuningMonths: []
    };
    
    // OPTIMISTIC
    setCustomers(prev => [...prev, newCust]);
    setShowAddCustomer(false);
    setNewCustomerName('');
    setNewCustomerAddress('');
    setNewCustomerRate('');
    setSelectedCustomer(newCust);
    setEditingCustomer({...newCust});
    setTuningGroupSearch('');
    setView('customerDetail');
    
    startBgSave();
    try {
      const result = await apiCall('addCustomer', { 
        data: JSON.stringify({
          name: newCust.name,
          notes: newCust.notes,
          customRate: newCust.customRate,
          tuningMonths: []
        })
      });
      setCustomers(prev => prev.map(c => c.id === tempId ? { ...c, id: result.id } : c));
      setSelectedCustomer(prev => prev?.id === tempId ? { ...prev, id: result.id } : prev);
      setEditingCustomer(prev => prev?.id === tempId ? { ...prev, id: result.id } : prev);
      endBgSave(true);
    } catch (err) {
      setCustomers(prev => prev.filter(c => c.id !== tempId));
      setView('customers');
      setEditingCustomer(null);
      setSelectedCustomer(null);
      endBgSave(false, err.message);
    }
  };

  const deleteCustomer = async (customerId) => {
    const customer = customers.find(c => c.id === customerId);
    const customerContacts = contacts.filter(c => c.customerId === customerId);
    const contactCount = customerContacts.length;
    
    const bookingCount = bookings.filter(b => b.customerId === customerId).length;
    const ticketCount = tickets.filter(t => t.customerId === customerId).length;
    const projectCount = projects.filter(p => p.customerId === customerId).length;
    const leftBehind = [
      bookingCount > 0 ? `${bookingCount} booking${bookingCount > 1 ? 's' : ''}` : '',
      ticketCount > 0 ? `${ticketCount} ticket${ticketCount > 1 ? 's' : ''}` : '',
      projectCount > 0 ? `${projectCount} big job${projectCount > 1 ? 's' : ''}` : ''
    ].filter(Boolean);
    
    let message = contactCount > 0 
      ? `Delete "${customer?.name}" and ${contactCount} associated contact${contactCount > 1 ? 's' : ''}?`
      : `Delete "${customer?.name}"?`;
    if (leftBehind.length > 0) {
      message += `\n\nThis customer has ${leftBehind.join(', ')}. Those will stay in the diary and reports but show as "Unknown".`;
    }
    message += '\n\nThis cannot be undone.';
    
    askConfirm(message, 'Delete customer', () => reallyDeleteCustomer(customerId));
  };

  const reallyDeleteCustomer = async (customerId) => {
    const customer = customers.find(c => c.id === customerId);
    const customerContacts = contacts.filter(c => c.customerId === customerId);
    
    // OPTIMISTIC
    setCustomers(prev => prev.filter(c => c.id !== customerId));
    setContacts(prev => prev.filter(c => c.customerId !== customerId));
    setView('customers');
    setEditingCustomer(null);
    setSelectedCustomer(null);
    
    startBgSave();
    try {
      await apiCall('deleteCustomer', { customerId });
      endBgSave(true);
    } catch (err) {
      if (customer) {
        setCustomers(prev => [...prev, customer]);
      }
      if (customerContacts.length > 0) {
        setContacts(prev => [...prev, ...customerContacts]);
      }
      endBgSave(false, err.message);
    }
  };

  // ============================================================
  // CONTACT FUNCTIONS (OPTIMISTIC)
  // ============================================================

  const addContact = async () => {
    if (!editingCustomer || !newContactName) return;
    
    const tempId = generateTempId();
    const newContact = { 
      id: tempId, 
      customerId: editingCustomer.id, 
      name: newContactName, 
      role: newContactRole, 
      phone: newContactPhone, 
      email: newContactEmail,
      isBookingContact: newContactIsBooking
    };
    
    // OPTIMISTIC
    setContacts(prev => [...prev, newContact]);
    setShowAddContact(false);
    setNewContactName('');
    setNewContactRole('');
    setNewContactPhone('');
    setNewContactEmail('');
    setNewContactIsBooking(false);
    
    startBgSave();
    try {
      const result = await apiCall('addContact', { 
        data: JSON.stringify({
          customerId: editingCustomer.id,
          name: newContactName,
          role: newContactRole,
          phone: newContactPhone,
          email: newContactEmail,
          isBookingContact: newContactIsBooking
        })
      });
      learnId(tempId, result.id);
      setContacts(prev => prev.map(c => c.id === tempId ? { ...c, id: result.id } : c));
      endBgSave(true);
    } catch (err) {
      learnId(tempId, null);
      setContacts(prev => prev.filter(c => c.id !== tempId));
      endBgSave(false, err.message);
    }
  };

  const saveContact = async (contact) => {
    const originalContact = contacts.find(c => c.id === contact.id);
    
    // OPTIMISTIC
    setContacts(prev => prev.map(c => c.id === contact.id ? contact : c));
    setEditingContact(null);
    
    startBgSave();
    try {
      await apiCall('updateContact', { data: JSON.stringify(contact) });
      endBgSave(true);
    } catch (err) {
      if (originalContact) {
        setContacts(prev => prev.map(c => c.id === contact.id ? originalContact : c));
      }
      endBgSave(false, err.message);
    }
  };

  const deleteContact = async (contactId) => {
    const contactToDelete = contacts.find(c => c.id === contactId);
    if (!contactToDelete) return;
    
    // OPTIMISTIC: it disappears now, but the sheet is only told once the Undo bar has gone
    pendingDeleteRef.current.add(contactId);
    setContacts(prev => prev.filter(c => c.id !== contactId));
    setEditingContact(null);
    
    offerUndo(`Contact deleted: ${contactToDelete.name}`,
      () => {
        const nowId = tempIdMapRef.current[contactId] || contactId;
        pendingDeleteRef.current.delete(contactId); pendingDeleteRef.current.delete(nowId);
        setContacts(prev => prev.some(c => c.id === nowId || c.id === contactId) ? prev : [...prev, { ...contactToDelete, id: nowId }]);
      },
      async () => {
        const realId = await realIdFor(contactId);
        if (!realId) return; // it never reached the sheet
        startBgSave();
        try {
          await apiCall('deleteContact', { contactId: realId });
          endBgSave(true);
        } catch (err) {
          pendingDeleteRef.current.delete(contactId); pendingDeleteRef.current.delete(realId);
          setContacts(prev => prev.some(c => c.id === realId) ? prev : [...prev, { ...contactToDelete, id: realId }]);
          endBgSave(false, err.message);
        }
      });
  };

  const getStats = () => {
    const completedJobs = bookings.filter(b => b.status === 'completed');
    const uninvoicedTotal = completedJobs.reduce((sum, b) => sum + (parseFloat(b.price) || 0), 0);
    const awaitingPayment = bookings.filter(b => b.status === 'invoiced');
    const awaitingTotal = awaitingPayment.reduce((sum, b) => sum + (parseFloat(b.price) || 0), 0);
    return {
      tuningDays: bookings.filter(b => b.type?.startsWith('tuning') || b.type === 'OTS' || b.type === 'TSC').length,
      faultDays: bookings.filter(b => b.type === 'fault').length,
      bigDays: bookings.filter(b => b.type === 'big' || b.type === 'project').length,
      needsInvoicing: completedJobs.length,
      uninvoicedTotal,
      awaitingPayment: awaitingPayment.length,
      awaitingTotal
    };
  };
  const stats = getStats();

  // Get unique tuning groups from all customers
  const existingTuningGroups = [...new Set(customers.map(c => c.tuningGroup).filter(g => g && g.trim()))].sort();
  
  const setTuningGroup = async (groupName) => {
    if (!editingCustomer) return;
    const updated = { ...editingCustomer, tuningGroup: groupName };
    setEditingCustomer(updated);
    setTuningGroupSearch(groupName);
    setShowGroupDropdown(false);
    await updateCustomer(updated);
  };

  const toggleTuningMonth = async (monthIdx) => {
    if (!editingCustomer) return;
    const months = editingCustomer.tuningMonths || [];
    const newMonths = months.includes(monthIdx) 
      ? months.filter(m => m !== monthIdx) 
      : [...months, monthIdx].sort((a, b) => a - b);
    const updated = { ...editingCustomer, tuningMonths: newMonths };
    setEditingCustomer(updated);
    await updateCustomer(updated);
  };

  // ============================================================
  // CONFIGURATION SCREEN
  // ============================================================
  
  if (!isConfigured) {
    return (
      <div className="min-h-screen bg-gray-900 flex items-center justify-center p-8">
        <div className="bg-white rounded-2xl p-8 max-w-lg w-full shadow-2xl">
          <h1 className="text-3xl font-bold mb-2">🎹 Command Centre</h1>
          <p className="text-gray-600 mb-6">Connect to your Google Sheets database</p>
          <label className="block text-sm font-medium text-gray-700 mb-2">Google Apps Script URL</label>
          <input type="text" value={configUrl} onChange={(e) => setConfigUrl(e.target.value)} placeholder="https://script.google.com/macros/s/..." className="w-full p-4 text-lg border-2 rounded-lg mb-6" />
          <button onClick={() => { if (configUrl) { setApiUrl(configUrl); setIsConfigured(true); } }} className="w-full bg-blue-600 text-white py-4 rounded-lg text-xl font-bold hover:bg-blue-700">Connect</button>
        </div>
      </div>
    );
  }

  if (needsKey && !loading) {
    const submitKey = () => {
      if (!keyInput.trim()) return;
      setApiKey(keyInput.trim());
      setKeyTried(true);
      setNeedsKey(false);
      loadData();
    };
    return (
      <div className="min-h-screen bg-gray-900 flex items-center justify-center p-8">
        <div className="bg-white rounded-2xl p-8 max-w-lg w-full shadow-2xl">
          <h1 className="text-3xl font-bold mb-2">🔑 Access key</h1>
          <p className="text-gray-600 mb-6">The database is locked. Type the access key for this device. You only need to do this once.</p>
          {keyTried && <div className="mb-4 p-3 rounded-lg bg-red-100 text-red-700 font-medium">That key was not accepted. Check it and try again.</div>}
          <input type="text" value={keyInput} onChange={(e) => setKeyInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') submitKey(); }} placeholder="xxxx-xxxx-xxxx-xxxx-xxxx" autoCapitalize="off" autoComplete="off" spellCheck={false} className="w-full p-4 text-xl border-2 rounded-lg mb-6 font-mono" />
          <button onClick={submitKey} className="w-full bg-blue-600 text-white py-4 rounded-lg text-xl font-bold hover:bg-blue-700">Unlock</button>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div className="min-h-screen bg-gray-100 flex items-center justify-center">
        <div className="text-center">
          <div className="loading-spinner mx-auto mb-4"></div>
          <p className="text-xl text-gray-600">Loading your data...</p>
        </div>
      </div>
    );
  }

  // ============================================================
  // MOVING AROUND: DAY / WEEK / MONTH / YEAR
  // currentDate is the day in focus. The arrows move it by one day,
  // week, month or year depending on the view.
  // ============================================================

  const dateToStr = (d) => getDateString(d.getFullYear(), d.getMonth(), d.getDate());
  const todayStrNow = () => dateToStr(new Date());
  const focusStr = dateToStr(currentDate);

  const startOfWeek = (d) => {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // back to Monday
    return x;
  };

  // The Monday of the week on show (at a weekend, the week that is about to start)
  const weekMonday = () => {
    const base = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());
    if (base.getDay() === 6) base.setDate(base.getDate() + 2);
    if (base.getDay() === 0) base.setDate(base.getDate() + 1);
    return startOfWeek(base);
  };

  const shiftFocus = (dir) => {
    const d = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());
    if (plannerView === 'day') { do { d.setDate(d.getDate() + dir); } while (d.getDay() === 0 || d.getDay() === 6); }
    else if (plannerView === 'week') d.setDate(d.getDate() + 7 * dir);
    else if (plannerView === 'month') { d.setDate(1); d.setMonth(d.getMonth() + dir); }
    else { d.setMonth(0, 1); d.setFullYear(d.getFullYear() + dir); }
    setCurrentDate(d);
  };

  const plannerTitle = (() => {
    if (plannerView === 'day') return currentDate.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    if (plannerView === 'week') {
      const mon = weekMonday();
      const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
      const sameMonth = mon.getMonth() === fri.getMonth();
      return `${mon.getDate()}${sameMonth ? '' : ' ' + monthNames[mon.getMonth()].slice(0, 3)} – ${fri.getDate()} ${monthNames[fri.getMonth()]} ${fri.getFullYear()}`;
    }
    if (plannerView === 'month') return `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
    return String(currentYear);
  })();

  // One booking, as a small card (week view) or a one-line chip (month view)
  const bookingTone = (b) => {
    if (calm) return { solid: 'bg-white border-gray-500', dashed: 'bg-white border-gray-500', chip: 'bg-gray-200 text-gray-900' };
    const color = getJobTypeColor(b.type);
    if (color === 'blue') return { solid: 'bg-blue-50 border-blue-500', dashed: 'bg-blue-50 border-blue-400', chip: 'bg-blue-500 text-white' };
    if (color === 'orange') return { solid: 'bg-orange-50 border-orange-500', dashed: 'bg-orange-50 border-orange-400', chip: 'bg-orange-400 text-white' };
    if (color === 'pink') return { solid: 'bg-pink-50 border-pink-500', dashed: 'bg-pink-50 border-pink-400', chip: 'bg-pink-400 text-white' };
    if (color === 'purple') return { solid: 'bg-purple-50 border-purple-500', dashed: 'bg-purple-50 border-purple-400', chip: 'bg-purple-500 text-white' };
    return { solid: 'bg-gray-50 border-gray-500', dashed: 'bg-gray-50 border-gray-400', chip: 'bg-gray-500 text-white' };
  };
  const bookingTitle = (b) => b.type === 'project' ? (b.projectName || 'Big job') : nameFor(b.customerId);

  const renderBookingCard = (b) => {
    const isProject = b.type === 'project';
    const provisional = b.status === 'scheduled' && !isProject;
    const tone = bookingTone(b);
    const open = isProject ? [] : getOpenTickets(b.customerId);
    return (
      <div key={b.id} className={`rounded-lg p-2 ${provisional ? `border-2 border-dashed ${tone.dashed}` : `border-l-4 ${tone.solid}`}`}>
        <div className="font-bold leading-tight">{bookingTitle(b)}</div>
        {isProject && <div className="text-sm text-gray-600">{nameFor(b.customerId)}</div>}
        <div className="text-sm text-gray-600">{getJobTypeLabel(b.type)}{!isProject ? ` · ${STATUS_WORDS[b.status] || b.status}` : ''}</div>
        {b.notes && !isProject && <div className="text-sm italic">{b.notes}</div>}
        {open.length > 0 && <div className="text-sm text-orange-700 font-medium">📋 {open.length} ticket{open.length === 1 ? '' : 's'} while there</div>}
      </div>
    );
  };

  // ============================================================
  // WEEK VIEW (the opening screen): Monday to Friday, one column each
  // ============================================================

  const WeekView = stable('WeekView', () => {
    const todayS = todayStrNow();
    const monday = weekMonday();
    const days = [0, 1, 2, 3, 4].map(i => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });
    const isSelecting = !!(selectedCustomerToBook || allocatingProject || blockMode);
    
    return (
      <div className={`grid grid-cols-5 gap-2 ${selectedCustomerToBook ? 'focus-mode' : ''}`}>
        {days.map(d => {
          const ds = dateToStr(d);
          const dow = d.getDay();
          const off = isDayOff(ds);
          const list = getBookingsForDay(ds);
          const isToday = ds === todayS;
          const isPast = ds < todayS;
          const kind = dow === STRETCH_DAY ? '4th day' : dow === ADMIN_DAY ? 'Admin day' : '';
          return (
            <div key={ds} data-date={ds} onClick={() => handleDayClick(ds, d.getFullYear(), d.getMonth(), d.getDate())}
              className={`relative rounded-lg shadow p-3 flex flex-col gap-2 cursor-pointer ${isNarrow ? 'min-h-[340px]' : 'min-h-[460px]'} ${isPast ? 'bg-gray-50' : 'bg-white'} ${off ? 'dim-when-booking' : ''}`}>
              {isToday && <div className="absolute inset-0 border-4 border-red-500 rounded-lg pointer-events-none"></div>}
              {blockDateSet.has(ds) && <div className="absolute inset-0 border-4 border-green-600 rounded-lg pointer-events-none"></div>}
              <div className="flex justify-between items-baseline gap-1">
                <div><span className="text-xl font-bold">{dayNames[dow].slice(0, 3)}</span> <span className="text-lg text-gray-600">{d.getDate()} {monthNames[d.getMonth()].slice(0, 3)}</span></div>
                {isToday ? <span className="text-sm font-bold text-red-600">Today</span> : kind && <span className="text-sm text-gray-500">{kind}</span>}
              </div>
              {off && <div className={`p-3 rounded-lg font-medium ${calm ? 'bg-gray-200 text-gray-800' : 'bg-yellow-100 text-yellow-900'}`}>Day off{getDayOffReason(ds) ? ` — ${getDayOffReason(ds)}` : ''}</div>}
              {!off && list.map(renderBookingCard)}
              {!off && list.length === 0 && !isSelecting && <div className="text-gray-400 py-2">Nothing booked</div>}
              {!off && isSelecting && <div className="mt-auto p-3 rounded-lg border-2 border-dashed border-green-500 text-green-700 font-bold text-center">👆 Tap to {blockMode ? 'choose' : 'book'} this day</div>}
            </div>
          );
        })}
      </div>
    );
  });

  // ============================================================
  // MONTH VIEW: Monday to Friday across, weeks down, names in the boxes
  // ============================================================

  const MonthView = stable('MonthView', () => {
    const todayS = todayStrNow();
    const y = currentDate.getFullYear(), m = currentDate.getMonth();
    const first = new Date(y, m, 1);
    const last = new Date(y, m + 1, 0);
    const weeks = [];
    const cursor = startOfWeek(first);
    while (cursor <= last) {
      const row = [0, 1, 2, 3, 4].map(i => { const d = new Date(cursor); d.setDate(cursor.getDate() + i); return d; });
      if (row.some(d => d.getMonth() === m)) weeks.push(row);
      cursor.setDate(cursor.getDate() + 7);
    }
    
    return (
      <div className={`bg-white rounded-lg shadow p-3 ${selectedCustomerToBook ? 'focus-mode' : ''}`}>
        <div className="grid grid-cols-5 gap-2 mb-2 text-sm font-bold text-gray-600">
          {['Mon', 'Tue', 'Wed', 'Thu · 4th day', 'Fri · Admin'].map(label => <div key={label} className="px-2">{label}</div>)}
        </div>
        <div className="grid grid-cols-5 gap-2">
          {weeks.flat().map(d => {
            const ds = dateToStr(d);
            const inMonth = d.getMonth() === m;
            const off = isDayOff(ds);
            const list = getBookingsForDay(ds);
            const isToday = ds === todayS;
            return (
              <div key={ds} data-date={ds} onClick={() => handleDayClick(ds, d.getFullYear(), d.getMonth(), d.getDate())}
                className={`relative rounded-lg border p-2 cursor-pointer ${isNarrow ? 'min-h-[92px]' : 'min-h-[112px]'} ${off ? (calm ? 'bg-gray-200' : 'bg-yellow-100') + ' dim-when-booking' : inMonth ? 'bg-white' : 'bg-gray-50'}`}>
                {isToday && <div className="absolute inset-0 border-4 border-red-500 rounded-lg pointer-events-none"></div>}
                {blockDateSet.has(ds) && <div className="absolute inset-0 border-4 border-green-600 rounded-lg pointer-events-none"></div>}
                <div className={`font-bold ${inMonth ? '' : 'text-gray-400'}`}>{d.getDate()}{inMonth ? '' : ' ' + monthNames[d.getMonth()].slice(0, 3)}</div>
                {off && <div className="text-sm">Day off{getDayOffReason(ds) ? ` — ${getDayOffReason(ds)}` : ''}</div>}
                {!off && list.slice(0, 3).map(b => {
                  const provisional = b.status === 'scheduled' && b.type !== 'project';
                  const tone = bookingTone(b);
                  return <div key={b.id} className={`text-sm truncate rounded px-2 py-1 mt-1 ${provisional ? `border-2 border-dashed ${tone.dashed}` : tone.chip}`}>{provisional ? '? ' : ''}{bookingTitle(b)}</div>;
                })}
                {!off && list.length > 3 && <div className="text-sm text-gray-600 mt-1">+{list.length - 3} more</div>}
              </div>
            );
          })}
        </div>
        <div className="mt-3 flex justify-end no-print">
          <button onClick={() => setZoomedMonth({ month: m, year: y })} className="px-4 py-3 bg-gray-200 rounded-lg font-medium touch-target">🖨️ Print this month</button>
        </div>
      </div>
    );
  });

  // ============================================================
  // YEAR VIEW WITH CAPACITY COLORING
  // ============================================================
  
  const YearView = stable('YearView', () => {
    const today = new Date();
    const todayStr = getDateString(today.getFullYear(), today.getMonth(), today.getDate());
    
    // Months that are over can be folded away so the months still to come fit on the screen
    const viewingThisYear = currentYear === today.getFullYear();
    const pastMonthCount = viewingThisYear ? Math.max(0, today.getMonth() - 1) : 0; // keep last month visible
    const pastShown = showPastMonths === null ? !isNarrow : showPastMonths;
    const firstMonthShown = pastShown ? 0 : pastMonthCount;
    
    return (
      <div className={`bg-white rounded-lg shadow overflow-auto ${selectedCustomerToBook ? 'focus-mode' : ''}`}>
        {pastMonthCount > 0 && (
          <button onClick={() => setShowPastMonths(!pastShown)} className="w-full py-3 text-sm font-medium text-gray-600 bg-gray-100 border-b no-print touch-target">
            {pastShown ? '▲ Hide the months that are over' : `▼ Show ${monthNames[0]} to ${monthNames[pastMonthCount - 1]}`}
          </button>
        )}
        <table className="w-full border-collapse">
          <thead className="sticky top-0 bg-gray-800 text-white z-10">
            <tr>
              <th className={isCompact ? "p-1 text-left text-sm sticky left-0 bg-gray-800 z-20" : "p-3 text-left text-lg w-32"}>{currentYear}</th>
              {[...Array(31)].map((_, i) => <th key={i} className="p-1 text-center text-sm font-medium">{i + 1}</th>)}
            </tr>
          </thead>
          <tbody>
            {plannerMonths.filter((_, monthIdx) => monthIdx >= firstMonthShown).map((monthData) => (
              <tr key={monthData.month} id={monthData.month === today.getMonth() && monthData.year === today.getFullYear() ? 'this-month-row' : undefined} className="border-b">
                <td onClick={() => { setCurrentDate(new Date(monthData.year, monthData.month, 1)); setPlannerView('month'); }} className={`font-bold border-r bg-gray-50 cursor-pointer underline hover:bg-blue-100 hover:text-blue-700 transition-colors ${isCompact ? 'p-1 text-sm sticky left-0 z-[5]' : 'p-3 text-lg'}`}>{isCompact ? monthData.name.slice(0, 3) : monthData.name}</td>
                {[...Array(31)].map((_, dayIdx) => {
                  const day = dayIdx + 1;
                  if (day > monthData.days) return <td key={dayIdx} className="bg-gray-200"></td>;
                  const dateStr = getDateString(monthData.year, monthData.month, day);
                  const isWork = isWorkDay(monthData.year, monthData.month, day);
                  const isOff = isDayOff(dateStr);
                  const dayBookings = getBookingsForDay(dateStr);
                  const hasBooking = dayBookings.length > 0;
                  const firstBookingType = hasBooking ? dayBookings[0].type : null;
                  const firstBookingStatus = hasBooking ? dayBookings[0].status : null;
                  const isProvisional = firstBookingStatus === 'scheduled' && firstBookingType !== 'project';
                  const color = firstBookingType ? getJobTypeColor(firstBookingType) : null;
                  const isSelecting = selectedCustomerToBook !== null || allocatingProject !== null || blockMode !== null;
                  const inBlock = blockDateSet.has(dateStr);
                  const isToday = dateStr === todayStr;
                  const isPast = dateStr < todayStr;
                  
                  const isReservedForTuning = !hasBooking && isWork && !isOff && !isPast && capacityData.reservedDays.has(dateStr);
                  const isPlannedForProject = !hasBooking && isWork && !isOff && !isPast && capacityData.plannedDays.has(dateStr);
                  const dow = getDayOfWeek(monthData.year, monthData.month, day);
                  const isPlanDay = PLAN_DAYS.includes(dow);
                  const isAdminDay = dow === ADMIN_DAY;
                  const isFreeForProjects = !hasBooking && isWork && !isOff && !isPast && isPlanDay && !capacityData.reservedDays.has(dateStr) && !capacityData.plannedDays.has(dateStr);
                  const isStretchFree = !hasBooking && isWork && !isOff && !isPast && dow === STRETCH_DAY;

                  let cellClass = 'text-center border transition-all cursor-pointer relative ';
                  if (!isWork) cellClass += 'bg-gray-100 dim-when-booking';
                  else if (isOff) cellClass += 'bg-yellow-200 dim-when-booking';
                  else if (isProvisional && color === 'blue') cellClass += 'bg-blue-200 text-blue-800 border-2 border-dashed border-blue-400';
                  else if (isProvisional && color === 'orange') cellClass += 'bg-orange-200 text-orange-800 border-2 border-dashed border-orange-400';
                  else if (isProvisional) cellClass += 'bg-gray-200 text-gray-600 border-2 border-dashed border-gray-400';
                  else if (color === 'blue') cellClass += 'bg-blue-500 text-white';
                  else if (color === 'green') cellClass += 'bg-emerald-500 text-white';
                  else if (color === 'purple') cellClass += 'bg-purple-500 text-white';
                  else if (color === 'pink') cellClass += 'bg-pink-400 text-white';
                  else if (color === 'orange') cellClass += 'bg-orange-400 text-white';
                  else if (color === 'red') cellClass += 'bg-red-500 text-white';
                  else if (isPast && isWork) cellClass += 'bg-gray-50 text-gray-300';
                  else if (isReservedForTuning) cellClass += isSelecting ? 'bg-amber-300 hover:bg-amber-400' : 'bg-amber-200 hover:bg-amber-300';
                  else if (isPlannedForProject) cellClass += isSelecting ? 'bg-pink-300 hover:bg-pink-400' : 'bg-pink-200 hover:bg-pink-300';
                  else if (isFreeForProjects) cellClass += isSelecting ? 'bg-green-300 hover:bg-green-400' : 'bg-green-200 hover:bg-green-300';
                  else if (isStretchFree) cellClass += isSelecting ? 'bg-green-100 hover:bg-green-200' : 'bg-green-50 hover:bg-green-100';
                  else cellClass += 'bg-white hover:bg-gray-100';
                  
                  // Calm view: booked, provisional, day off, free - nothing else
                  if (calm) {
                    cellClass = 'text-center border transition-all cursor-pointer relative ';
                    if (!isWork) cellClass += 'bg-gray-100 dim-when-booking';
                    else if (isOff) cellClass += 'bg-gray-300 dim-when-booking';
                    else if (hasBooking && isProvisional) cellClass += 'bg-white text-gray-800 border-2 border-dashed border-gray-500';
                    else if (hasBooking) cellClass += 'bg-gray-700 text-white';
                    else cellClass += 'bg-white';
                  }

                  return (
                    <td key={dayIdx} data-date={dateStr} onClick={() => handleDayClick(dateStr, monthData.year, monthData.month, day)} className={cellClass}>
                      {inBlock && <div className="absolute inset-0 border-4 border-green-600 rounded pointer-events-none"></div>}
                      {isToday && <div className="absolute inset-0 border-2 border-red-500 rounded pointer-events-none"></div>}
                      <div className={`${isCompact ? 'text-[10px]' : 'text-[11px]'} leading-none pt-1 font-medium whitespace-nowrap ${!isWork ? 'text-gray-400' : hasBooking && !isProvisional ? 'text-white' : 'text-gray-500'}`}>{DAY_SHORT[dow]} {day}</div>
                      <div className={`${isCompact ? 'w-7 h-7' : 'w-8 h-8'} flex items-center justify-center mx-auto text-sm font-bold`}>
                        {hasBooking ? (isProvisional ? '?' : dayBookings.length > 1 ? dayBookings.length : firstBookingType === 'project' ? 'B' : (firstBookingType === 'OTS' || firstBookingType === 'TSC' || firstBookingType?.startsWith('tuning')) ? '✓' : firstBookingType === 'fault' ? 'F' : '✓') : isWork && !isOff && !isPast && !isAdminDay ? '·' : ''}
                      </div>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
        {calm ? (
          <div className="flex gap-4 p-4 bg-gray-100 border-t text-sm flex-wrap">
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-gray-700 rounded flex items-center justify-center text-white text-xs">✓</div> Booked</div>
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-white rounded border-2 border-dashed border-gray-500 flex items-center justify-center text-xs">?</div> Provisional</div>
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-gray-300 rounded"></div> Day off</div>
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-white rounded border-2 border-red-500"></div> Today</div>
            <div className="text-gray-600">F = fault · B = big job · a number = more than one visit</div>
          </div>
        ) : (
          <div className="flex gap-4 p-4 bg-gray-100 border-t text-sm flex-wrap">
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-blue-200 rounded border-2 border-dashed border-blue-400 flex items-center justify-center text-xs">?</div> Provisional</div>
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-blue-500 rounded flex items-center justify-center text-white text-xs">✓</div> Confirmed</div>
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-orange-400 rounded flex items-center justify-center text-white text-xs">F</div> Fault</div>
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-pink-400 rounded flex items-center justify-center text-white text-xs">B</div> Big job</div>
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-amber-200 rounded border border-amber-400"></div> Needed for tunings</div>
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-pink-200 rounded border border-pink-300"></div> Needed for big jobs</div>
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-green-200 rounded border border-green-400"></div> Free</div>
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-green-50 rounded border border-green-300"></div> 4th day (Thu)</div>
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-white rounded border border-gray-300"></div> Admin (Fri)</div>
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-yellow-200 rounded"></div> Day off</div>
            <div className="flex items-center gap-2"><div className="w-6 h-6 bg-white rounded border-2 border-red-500"></div> Today</div>
          </div>
        )}
      </div>
    );
  });

  // ============================================================
  // MONTH ZOOM VIEW (Printable)
  // ============================================================
  
  const MonthZoomView = stable('MonthZoomView', ({ month, year, onClose }) => {
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const monthName = monthNames[month];
    
    // Get all days with their bookings
    const daysData = [];
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = getDateString(year, month, day);
      const dow = getDayOfWeek(year, month, day);
      const dayBookings = getBookingsForDay(dateStr);
      const isOff = isDayOff(dateStr);
      const offReason = getDayOffReason(dateStr);
      
      daysData.push({
        day,
        dateStr,
        dayName: dayNames[dow],
        isWeekend: dow === 0 || dow === 6,
        isOff,
        offReason,
        bookings: dayBookings
      });

    return (
      <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 no-print-overlay">
        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col print-container">

          <div className="p-4 border-b flex justify-between items-center no-print">
            <h2 className="text-2xl font-bold">📅 {monthName} {year}</h2>
            <div className="flex gap-2">
              <button onClick={() => window.print()} className="px-4 py-2 bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-600">🖨️ Print</button>
              <button onClick={onClose} className="px-4 py-2 bg-gray-200 rounded-lg font-medium hover:bg-gray-300">✕ Close</button>
            </div>
          </div>
          
          {/* Print Header */}
          <div className="hidden print:block p-4 border-b">
            <h1 className="text-3xl font-bold text-center">{monthName} {year}</h1>
            <p className="text-center text-gray-500">Gary Cook Organbuilder</p>
          </div>
          
          {/* Content */}
          <div className="flex-1 overflow-y-auto p-4 print-content">
            <div className="space-y-1">
              {daysData.map(dayInfo => {
                const hasContent = dayInfo.bookings.length > 0 || dayInfo.isOff;
                
                // Skip weekends with no bookings for cleaner view
                if (dayInfo.isWeekend && !hasContent) return null;
                
                return (
                  <div key={dayInfo.day} className={`flex gap-4 p-2 rounded ${dayInfo.isWeekend ? 'bg-gray-100' : dayInfo.isOff ? 'bg-yellow-50' : hasContent ? 'bg-white border' : 'bg-gray-50'}`}>
                    {/* Date column */}
                    <div className="w-24 flex-shrink-0">
                      <div className={`font-bold ${dayInfo.isWeekend ? 'text-gray-400' : ''}`}>
                        {dayInfo.dayName.slice(0, 3)} {dayInfo.day}
                      </div>
                    </div>
                    
                    {/* Content column */}
                    <div className="flex-1">
                      {dayInfo.isOff ? (
                        <div className="text-yellow-700 font-medium">
                          🏖️ Day Off {dayInfo.offReason && `— ${dayInfo.offReason}`}
                        </div>
                      ) : dayInfo.bookings.length > 0 ? (
                        <div className="space-y-1">
                          {dayInfo.bookings.map(booking => {
                            const customer = getCustomerById(booking.customerId);
                            const color = getJobTypeColor(booking.type);
                            const statusIcon = booking.status === 'scheduled' ? '❓' : booking.status === 'confirmed' ? '✓' : booking.status === 'in_progress' ? '▶' : booking.status === 'completed' ? '✅' : booking.status === 'invoiced' ? '📧' : booking.status === 'paid' ? '💰' : '';
                            
                            return (
                              <div key={booking.id} className={`flex justify-between items-start ${color === 'blue' ? 'text-blue-700' : color === 'orange' ? 'text-orange-700' : color === 'pink' ? 'text-pink-700' : 'text-gray-700'}`}>
                                <div>
                                  <span className="font-bold">
                                    {customer?.name || 'Unknown'}
                                  </span>
                                  {booking.type === 'project' && booking.projectName && (
                                    <span className="text-pink-600 ml-2">🔧 {booking.projectName}</span>
                                  )}
                                  <span className="text-gray-500 ml-2 text-sm">
                                    {getJobTypeLabel(booking.type)}
                                  </span>
                                  {booking.notes && booking.type !== 'project' && <span className="text-gray-400 ml-2 text-sm italic">— {booking.notes}</span>}
                                </div>
                                <div className="flex items-center gap-2 text-sm">
                                  <span>{statusIcon}</span>
                                  {booking.type !== 'project' && <span className="font-medium">£{booking.price}</span>}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      ) : (
                        <div className="text-gray-300 text-sm">—</div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
            
            {/* Month Summary */}
            <div className="mt-6 pt-4 border-t">
              <h3 className="font-bold text-lg mb-2">Summary</h3>
              <div className="grid grid-cols-4 gap-4 text-center">
                <div className="bg-blue-50 p-3 rounded">
                  <div className="text-2xl font-bold text-blue-700">
                    {daysData.reduce((sum, d) => sum + d.bookings.filter(b => b.type === 'OTS' || b.type === 'TSC' || b.type === 'WS').length, 0)}
                  </div>
                  <div className="text-sm text-blue-600">Tunings</div>
                </div>
                <div className="bg-orange-50 p-3 rounded">
                  <div className="text-2xl font-bold text-orange-700">
                    {daysData.reduce((sum, d) => sum + d.bookings.filter(b => b.type === 'fault').length, 0)}
                  </div>
                  <div className="text-sm text-orange-600">Faults</div>
                </div>
                <div className="bg-pink-50 p-3 rounded">
                  <div className="text-2xl font-bold text-pink-700">
                    {daysData.reduce((sum, d) => sum + d.bookings.filter(b => b.type === 'project').length, 0)}
                  </div>
                  <div className="text-sm text-pink-600">Big job days</div>
                </div>
                <div className="bg-green-50 p-3 rounded">
                  <div className="text-2xl font-bold text-green-700">
                    £{daysData.reduce((sum, d) => sum + d.bookings.reduce((s, b) => s + (parseFloat(b.price) || 0), 0), 0).toLocaleString()}
                  </div>
                  <div className="text-sm text-green-600">Total Value</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  });

  // ============================================================
  // DAY PANEL
  // ============================================================
  
  const DayPanel = stable('DayPanel', ({ date, onClose, embedded }) => {
    const [year, month, day] = date.split('-').map(Number);
    const d = new Date(year, month - 1, day);
    const dayBookings = getBookingsForDay(date);
    const isOff = isDayOff(date);
    const [localReason, setLocalReason] = useState(getDayOffReason(date));

    return (
      <div className={embedded ? "contents" : isNarrow ? "fixed inset-0 bg-black bg-opacity-40 z-40 flex justify-end" : "contents"} onClick={!embedded && isNarrow ? onClose : undefined}>
      <div onClick={(e) => e.stopPropagation()} className={embedded ? "day-view bg-white rounded-lg shadow p-5 flex flex-col w-full max-w-3xl" : isNarrow ? "w-full max-w-md h-full bg-white shadow-xl p-5 flex flex-col" : "w-96 flex-shrink-0 bg-white rounded-lg shadow-xl p-5 flex flex-col max-h-[calc(100vh-160px)]"}>
        {embedded && (selectedCustomerToBook || allocatingProject) && !isOff && isWorkDay(year, month - 1, day) && (
          <button onClick={() => handleDayClick(date, year, month - 1, day)} className="w-full mb-4 py-4 rounded-lg border-2 border-dashed border-green-500 text-green-700 text-lg font-bold touch-target flex-shrink-0">👆 Book {allocatingProject ? allocatingProject.name : selectedCustomerToBook.name} on this day</button>
        )}
        <div className="flex justify-between items-start mb-4 flex-shrink-0">
          <div>
            <h2 className="text-2xl font-bold">{dayNames[d.getDay()]}</h2>
            <p className="text-lg text-gray-500">{d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
          </div>
          {!embedded && <button onClick={onClose} className="px-4 py-3 bg-gray-200 rounded-lg font-medium touch-target">✕ Close</button>}
        </div>

        <label className="flex items-center gap-3 mb-2 p-4 bg-yellow-50 rounded-lg cursor-pointer touch-target flex-shrink-0">
          <input type="checkbox" checked={isOff} onChange={() => toggleDayOff(date)} className="w-6 h-6" />
          <span className="text-lg font-medium">Day off</span>
        </label>
        
        {isOff && (
          <div className="mb-4 p-3 bg-yellow-100 rounded-lg flex-shrink-0">
            <input
              type="text"
              placeholder="Reason (e.g. Bank Holiday, Annual Leave)"
              value={localReason}
              onChange={(e) => {
                setLocalReason(e.target.value);
                updateDayOffReason(date, e.target.value);
              }}
              className="w-full p-3 border-2 rounded-lg text-lg"
            />
          </div>
        )}

        {!isOff && (
          <div className="space-y-3 mb-4 flex-1 overflow-y-auto min-h-0">
            {dayBookings.map((booking) => {
              const customer = getCustomerById(booking.customerId);
              const bookingContact = getBookingContact(booking.customerId);
              const color = getJobTypeColor(booking.type);
              const isProject = booking.type === 'project';
              const isProvisional = booking.status === 'scheduled' && !isProject;
              const emailSubject = encodeURIComponent(`Organ Tuning - ${customer?.name} - ${d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`);
              
              return (
                <div key={booking.id} className={`p-4 rounded-lg ${isProvisional ? 'border-2 border-dashed border-gray-400 bg-gray-50' : color === 'blue' ? 'bg-blue-100 border-l-4 border-blue-500' : color === 'pink' ? 'bg-pink-100 border-l-4 border-pink-500' : color === 'orange' ? 'bg-orange-100 border-l-4 border-orange-500' : 'bg-gray-100 border-l-4 border-gray-500'}`}>
                  <div className="flex justify-between items-start">
                    <div>
                      {isProject && <div className="text-sm text-gray-600">{customer?.name}</div>}
                      <div className="font-bold text-lg flex items-center gap-2">
                        {isProvisional && <span className="text-gray-400">❓</span>}
                        {booking.status === 'confirmed' && <span className="text-blue-500">✓</span>}
                        {booking.status === 'in_progress' && <span className="text-green-600">▶</span>}
                        {isProject ? booking.projectName : customer?.name}
                      </div>
                      <div className="text-sm text-gray-500 mt-1">{getJobTypeLabel(booking.type)}{!isProject ? ` · ${STATUS_WORDS[booking.status] || booking.status}` : ''}</div>
                      {booking.notes && !isProject && <div className="text-sm italic mt-1">{booking.notes}</div>}
                      {isProject && projects.find(p => p.id === booking.projectId)?.notes && <div className="text-sm italic mt-1">📝 {projects.find(p => p.id === booking.projectId).notes}</div>}
                    </div>
                    <div className="text-right">
                      {!isProject && <div className="font-bold text-lg">£{booking.price}</div>}

                    </div>
                  </div>
                  
                  {(customer?.accessNotes) && (
                    <div className="mt-3 p-3 bg-blue-50 rounded-lg border border-blue-200 text-sm whitespace-pre-line"><span className="font-bold text-blue-800">🔑 Access: </span>{customer.accessNotes}</div>

                        </div>
                      ))}
                    </div>
                  )}
                  
                  {isProvisional && bookingContact && (
                    <div className="mt-3 p-3 bg-yellow-50 rounded-lg border border-yellow-300">
                      <div className="text-sm text-gray-600 mb-1">📞 Contact to confirm:</div>
                      <div className="font-bold">{bookingContact.isBookingContact && '⭐ '}{bookingContact.name}</div>
                      {bookingContact.role && <div className="text-sm text-gray-500">{bookingContact.role}</div>}
                      <div className="flex gap-2 mt-2 flex-wrap">
                        {bookingContact.phone && (
                          <a href={`tel:${bookingContact.phone}`} className="bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-1">

                  {!isProject && (
                    <div className="mt-3 pt-2 border-t flex gap-2 flex-wrap">
                      {booking.status === 'scheduled' && <button onClick={() => updateBookingStatus(booking.id, 'confirmed')} className="text-sm bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 touch-target">✓ Confirm</button>}

                      {booking.status === 'in_progress' && <button onClick={() => updateBookingStatus(booking.id, 'completed')} className="text-sm bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 touch-target">✓ Done</button>}
                      {booking.status === 'completed' && <button onClick={() => openInvoiceCalc(booking)} className="text-sm bg-amber-200 px-4 py-2 rounded-lg hover:bg-amber-300 touch-target">📧 Invoice</button>}
                      {booking.status === 'invoiced' && <button onClick={() => updateBookingStatus(booking.id, 'paid')} className="text-sm bg-green-200 px-4 py-2 rounded-lg hover:bg-green-300 touch-target">💷 Paid</button>}
                      {booking.status === 'paid' && <span className="text-sm bg-green-500 text-white px-4 py-2 rounded-lg">✓ Paid</span>}
                    </div>
                  )}
                </div>
              );
            })}
            {dayBookings.length === 0 && <p className="text-gray-400 italic text-lg py-4">Nothing booked</p>}
          </div>
        )}
        {!embedded && <button onClick={onClose} className="w-full bg-gray-200 py-4 rounded-lg text-lg font-medium hover:bg-gray-300 touch-target flex-shrink-0">Close</button>}
      </div>
      </div>
    );
  });

  // ============================================================
  // INVOICE CALCULATOR MODAL (OPTIMISTIC)
  // ============================================================
  
  const InvoiceCalcModal = stable('InvoiceCalcModal', () => {
    if (!showInvoiceCalc) return null;
    
    const customer = getCustomerById(showInvoiceCalc.customerId);
    const serviceType = showInvoiceCalc.serviceType || showInvoiceCalc.type || 'TSC';
    const suggestedBand = Math.max(4, Math.ceil(showInvoiceCalc.actualHours || 4));
    
    const band = pricing.timeBands.find(b => b.hours === selectedBand);
    const bandPrice = band ? (band[serviceType] || band.TSC || 0) : 0;
    const serviceCharge = customAmount ? parseFloat(customAmount) : bandPrice;
    
    const autoDistancePremium = pricing.distanceBands.find(d => 
      (showInvoiceCalc.distance || 0) >= d.minMiles && 
      (showInvoiceCalc.distance || 0) <= d.maxMiles
    )?.premium || 0;
    const distancePremium = selectedDistance !== null ? selectedDistance : autoDistancePremium;
    
    const materialsTotal = invoiceMaterials.reduce((sum, m) => sum + ((m.cost || 0) * (m.quantity || 1)), 0);
    const total = serviceCharge + distancePremium + materialsTotal;
    
    const handleAddMaterial = () => {
      if (newMaterialDesc && newMaterialCost) {
        setInvoiceMaterials([...invoiceMaterials, { description: newMaterialDesc, cost: parseFloat(newMaterialCost) || 0, quantity: newMaterialQty || 1 }]);
        setNewMaterialDesc('');
        setNewMaterialCost('');
        setNewMaterialQty(1);
      }
    };
    
    const handleConfirm = async () => {
      const originalBooking = bookings.find(b => b.id === showInvoiceCalc.id);
      const updates = {
        price: total,
        status: 'invoiced',
        materials: JSON.stringify(invoiceMaterials),
        invoiceDate: todayStrNow()
      };
      
      // OPTIMISTIC
      setBookings(prev => prev.map(b => b.id === showInvoiceCalc.id ? { ...b, ...updates } : b));
      setShowInvoiceCalc(null);
      setSelectedBand(null);
      
      if (originalBooking) {
        const invoicedId = showInvoiceCalc.id;
        offerUndo(`Invoiced ${nameFor(originalBooking.customerId)}: ${formatCurrency(total)}`, async () => {
          setBookings(prev => prev.map(b => b.id === invoicedId ? originalBooking : b));
          await waitForSaves();
          startBgSave();
          try {
            await apiCall('updateBooking', { data: JSON.stringify({ id: invoicedId, price: originalBooking.price || 0, status: originalBooking.status, materials: originalBooking.materials || '', invoiceDate: originalBooking.invoiceDate || '' }) });
            endBgSave(true);
          } catch (err) {
            endBgSave(false, err.message);
          }
        });
      }
      
      startBgSave();
      try {
        await apiCall('updateBooking', { data: JSON.stringify({ id: showInvoiceCalc.id, ...updates }) });
        endBgSave(true);
      } catch (err) {
        if (originalBooking) {
          setBookings(prev => prev.map(b => b.id === showInvoiceCalc.id ? originalBooking : b));
        }
        endBgSave(false, err.message);
      }
    };
    
    return (
      <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto">
          <h2 className="text-2xl font-bold mb-4">📧 Invoice Calculator</h2>
          
          <div className="bg-blue-50 rounded-lg p-4 mb-4">
            <div className="font-bold text-lg">{customer?.name || 'Unknown'}</div>
            <div className="text-blue-700">Actual time: {showInvoiceCalc.actualHours ? `${Math.floor(showInvoiceCalc.actualHours)}h ${Math.round((showInvoiceCalc.actualHours % 1) * 60)}m` : 'Not recorded'}</div>
            <div className="text-sm text-gray-500">Service: {getJobTypeLabel(serviceType)}</div>
            {customer?.customRate && (
              <div className="mt-2 text-sm font-medium text-green-700">
                Custom tuning rate: {formatCurrency(customer.customRate)}
                {parseFloat(customAmount) === customer.customRate

              </div>
            )}
          </div>
          
          <div className="mb-4">
            <div className="text-sm text-gray-600 mb-2">Select time band:</div>
            <div className="grid grid-cols-5 gap-2 mb-2">
              {pricing.timeBands.map(b => {
                const price = b[serviceType] || b.TSC || 0;
                const isSelected = selectedBand === b.hours && !customAmount;
                const isSuggested = suggestedBand === b.hours;
                return (
                  <button key={b.hours} onClick={() => { setSelectedBand(b.hours); setCustomAmount(''); }}
                    className={`p-3 rounded-lg text-center border-2 transition-all ${isSelected ? 'bg-blue-500 text-white border-blue-500' : isSuggested ? 'bg-blue-100 border-blue-300' : 'bg-white border-gray-200 hover:border-blue-300'}`}>
                    <div className="font-bold">{b.hours}h</div><div className="text-sm">£{price}</div>
                  </button>
                );
              })}
            </div>
            <div className="flex items-center gap-2">
              <span className="text-sm text-gray-500">Custom:</span><span className="text-gray-400">£</span>
              <input type="number" placeholder="Enter amount" value={customAmount} onChange={(e) => setCustomAmount(e.target.value)}
                className={`flex-1 p-2 border-2 rounded text-sm ${customAmount ? 'border-blue-500 bg-blue-50' : 'border-gray-200'}`} />
            </div>
          </div>
          
          <div className="bg-gray-100 rounded-lg p-4 mb-4">
            <div className="flex justify-between mb-2"><span className="text-gray-600">Distance</span><span>{showInvoiceCalc.distance || 0} miles</span></div>
            {pricing.distanceBands.length > 0 && selectedDistance === null && !pricing.distanceBands.some(d => (showInvoiceCalc.distance || 0) >= d.minMiles && (showInvoiceCalc.distance || 0) <= d.maxMiles) && (
              <div className="mb-2 p-2 rounded bg-red-100 text-red-700 text-sm font-medium">⚠️ No distance band covers {showInvoiceCalc.distance || 0} miles, so no premium has been added. Pick one below.</div>
            )}
            <div className="text-sm text-gray-600 mb-2">Select distance band:</div>
            <div className="grid grid-cols-4 gap-2">
              {pricing.distanceBands.map((band, idx) => {
                const autoSelected = (showInvoiceCalc.distance || 0) >= band.minMiles && (showInvoiceCalc.distance || 0) <= band.maxMiles;
                const isSelected = selectedDistance !== null ? selectedDistance === band.premium : autoSelected;
                return (
                  <button key={idx} onClick={() => setSelectedDistance(band.premium)}
                    className={`p-2 rounded-lg text-center border-2 transition-all ${isSelected ? 'bg-green-500 text-white border-green-500' : 'bg-white border-gray-200 hover:border-green-300'}`}>
                    <div className="text-xs">{band.minMiles}-{band.maxMiles}mi</div><div className="font-bold">+£{band.premium}</div>
                  </button>
                );
              })}
            </div>
          </div>
          
          <div className="bg-gray-100 rounded-lg p-4 mb-4">
            <div className="text-sm text-gray-600 mb-2">Materials / Parts</div>
            {invoiceMaterials.length > 0 && (
              <div className="space-y-1 mb-3">
                {invoiceMaterials.map((mat, idx) => {
                  const qty = mat.quantity || 1;
                  const lineTotal = ((mat.cost || 0) * qty).toFixed(2);
                  return (
                    <div key={idx} className="flex justify-between items-center bg-white p-2 rounded">
                      <span className="text-sm">{mat.description} {qty > 1 ? `×${qty}` : ''}</span>
                      <div className="flex items-center gap-2">
                        <span className="font-medium">£{lineTotal}</span>
                        <button onClick={() => setInvoiceMaterials(invoiceMaterials.filter((_, i) => i !== idx))} className="text-red-700 text-sm bg-white border border-red-300 px-3 py-2 rounded-lg">Remove</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            <div className="flex gap-2">
              <input type="text" placeholder="Description" value={newMaterialDesc} onChange={(e) => setNewMaterialDesc(e.target.value)} className="flex-1 p-2 border rounded text-sm" />
              <input type="number" placeholder="Qty" value={newMaterialQty} onChange={(e) => setNewMaterialQty(parseInt(e.target.value) || 1)} className="w-14 p-2 border rounded text-sm text-center" min="1" />
              <input type="number" placeholder="£" value={newMaterialCost} onChange={(e) => setNewMaterialCost(e.target.value)} className="w-20 p-2 border rounded text-sm" step="0.01" />
              <button onClick={handleAddMaterial} className="px-3 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">+</button>
            </div>
          </div>
          
          <div className="border-t-2 pt-4 mb-4">
            <div className="flex justify-between text-lg"><span>Service {customAmount ? '(custom)' : `(${selectedBand}h)`}</span><span>£{serviceCharge.toFixed(2)}</span></div>
            <div className="flex justify-between text-lg"><span>Distance</span><span>+£{distancePremium}</span></div>
            {materialsTotal > 0 && <div className="flex justify-between text-lg"><span>Materials</span><span>+£{materialsTotal.toFixed(2)}</span></div>}
            <div className="flex justify-between text-2xl font-bold mt-2 pt-2 border-t"><span>Total</span><span className="text-green-600">£{total.toFixed(2)}</span></div>
          </div>
          
          <div className="flex gap-3">
            <button onClick={() => { setShowInvoiceCalc(null); setSelectedBand(null); }} className="flex-1 py-3 bg-gray-200 rounded-lg font-medium">Cancel</button>
            <button onClick={handleConfirm} className="flex-1 py-3 bg-green-500 text-white rounded-lg font-bold text-lg">✓ Confirm £{total.toFixed(2)}</button>
          </div>
        </div>
      </div>
    );
  });

  const ReportsView = stable('ReportsView', () => {
    const [reportType, setReportType] = useState('summary');
    const [selectedYear, setSelectedYear] = useState(currentYear);
    
    const getMonthlyIncome = () => {
      const months = Array(12).fill(0).map((_, i) => ({ month: i, income: 0, count: 0, tunings: 0, faults: 0, projects: 0 }));
      bookings.filter(b => {
        const d = parseLocalDate(b.date);
        return d.getFullYear() === selectedYear && (b.status === 'completed' || b.status === 'invoiced' || b.status === 'paid');
      }).forEach(b => {
        const m = parseLocalDate(b.date).getMonth();
        months[m].income += parseFloat(b.price) || 0;
        months[m].count++;
        if (b.type === 'OTS' || b.type === 'TSC' || b.type === 'WS') months[m].tunings++;
        else if (b.type === 'fault') months[m].faults++;
        else if (b.type === 'project') months[m].projects++;
      });
      return months;
    };
    
    const getOutstanding = () => {
      return bookings.filter(b => b.status === 'invoiced').map(b => ({
        ...b, customer: getCustomerById(b.customerId),
        daysSince: Math.floor((new Date() - new Date(b.invoiceDate || b.date)) / (1000 * 60 * 60 * 24))
      })).sort((a, b) => b.daysSince - a.daysSince);
    };
    
    const getAwaitingInvoice = () => {
      return bookings.filter(b => b.status === 'completed').map(b => ({
        ...b, customer: getCustomerById(b.customerId),
        daysSince: Math.floor((new Date() - parseLocalDate(b.date)) / (1000 * 60 * 60 * 24))
      })).sort((a, b) => b.daysSince - a.daysSince);
    };
    
    const getYearSummary = () => {
      const yearBookings = bookings.filter(b => parseInt(b.date.split('-')[0]) === selectedYear);
      const paid = yearBookings.filter(b => b.status === 'paid');
      const invoiced = yearBookings.filter(b => b.status === 'invoiced');
      const completed = yearBookings.filter(b => b.status === 'completed');
      const tunings = yearBookings.filter(b => b.type === 'OTS' || b.type === 'TSC' || b.type === 'WS');
      const faults = yearBookings.filter(b => b.type === 'fault');
      const projectDays = yearBookings.filter(b => b.type === 'project');
      return {
        totalJobs: yearBookings.length,
        paidJobs: paid.length, paidTotal: paid.reduce((sum, b) => sum + (parseFloat(b.price) || 0), 0),
        invoicedJobs: invoiced.length, invoicedTotal: invoiced.reduce((sum, b) => sum + (parseFloat(b.price) || 0), 0),
        completedJobs: completed.length, completedTotal: completed.reduce((sum, b) => sum + (parseFloat(b.price) || 0), 0),
        tuningCount: tunings.length, faultCount: faults.length, projectDayCount: projectDays.length
      };
    };
    
    const monthlyData = getMonthlyIncome();
    const outstanding = getOutstanding();
    const awaitingInvoice = getAwaitingInvoice();
    const yearSummary = getYearSummary();
    const maxMonthlyIncome = Math.max(...monthlyData.map(m => m.income), 1);

      { id: 'summary', label: '📋 Summary', count: null },

      { id: 'awaiting', label: '📝 To Invoice', count: awaitingInvoice.length },

    return (
      <div className="bg-white rounded-lg shadow-lg p-6 max-h-[calc(100vh-140px)] overflow-hidden flex flex-col">
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-2xl font-bold">📊 Reports Dashboard</h2>
          <button onClick={downloadBackup} disabled={backupBusy} className={`px-4 py-3 rounded-lg font-medium touch-target ${backupBusy ? 'bg-gray-300 cursor-wait' : 'bg-gray-800 text-white'}`}>{backupBusy ? '⏳ Preparing...' : '💾 Download backup'}</button>
          <select value={selectedYear} onChange={(e) => setSelectedYear(parseInt(e.target.value))} className="px-4 py-2 border-2 rounded-lg bg-white text-lg">
            {[currentYear - 1, currentYear, currentYear + 1].map(y => <option key={y} value={y}>{y}</option>)}
          </select>
        </div>
        
        <div className="flex gap-2 mb-4 flex-wrap">
          {reportTabs.map(tab => (
            <button key={tab.id} onClick={() => setReportType(tab.id)} 
              className={`px-3 py-2 rounded-lg font-medium text-sm ${reportType === tab.id ? 'bg-blue-500 text-white' : 'bg-gray-100 hover:bg-gray-200'}`}>
              {tab.label} {tab.count !== null && tab.count > 0 && <span className="ml-1 bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full">{tab.count}</span>}
            </button>
          ))}
        </div>
        
        <div className="flex-1 overflow-y-auto">
          {reportType === 'summary' && (
            <div>
              <h3 className="text-xl font-bold mb-4">Year Summary {selectedYear}</h3>
              <div className="grid grid-cols-3 gap-4 mb-6">
                <div className="bg-green-100 rounded-lg p-6 text-center">
                  <div className="text-4xl font-bold text-green-700">{formatCurrency(yearSummary.paidTotal)}</div>
                  <div className="text-green-600 mt-2">💰 Paid ({yearSummary.paidJobs})</div>
                </div>
                <div className="bg-blue-100 rounded-lg p-6 text-center">
                  <div className="text-4xl font-bold text-blue-700">{formatCurrency(yearSummary.invoicedTotal)}</div>
                  <div className="text-blue-600 mt-2">📧 Invoiced ({yearSummary.invoicedJobs})</div>
                </div>
                <div className="bg-amber-100 rounded-lg p-6 text-center">
                  <div className="text-4xl font-bold text-amber-700">{formatCurrency(yearSummary.completedTotal)}</div>
                  <div className="text-amber-600 mt-2">✓ Done ({yearSummary.completedJobs})</div>
                </div>
              </div>
              <div className="p-4 bg-gray-800 text-white rounded-lg">
                <div className="text-3xl font-bold">{formatCurrency(yearSummary.paidTotal + yearSummary.invoicedTotal + yearSummary.completedTotal)}</div>
                <div className="text-gray-300">Total Pipeline for {selectedYear}</div>
              </div>
            </div>
          )}
          
          {reportType === 'monthly' && (
            <div>
              <h3 className="text-xl font-bold mb-4">Monthly Income {selectedYear}</h3>
              <div className="space-y-2">
                {monthlyData.map((m, i) => (
                  <div key={i} className="flex items-center gap-4">
                    <div className="w-12 text-sm font-medium">{monthNames[i].slice(0, 3)}</div>
                    <div className="flex-1 bg-gray-100 rounded-full h-10 overflow-hidden">
                      <div className="bg-green-500 h-full rounded-full flex items-center justify-end pr-3" style={{ width: `${Math.max((m.income / maxMonthlyIncome) * 100, m.income > 0 ? 15 : 0)}%` }}>
                        {m.income > 0 && <span className="text-white text-sm font-bold">{formatCurrency(m.income)}</span>}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          
          {reportType === 'outstanding' && (
            <div>
              <h3 className="text-xl font-bold mb-4">Outstanding Invoices ({outstanding.length})</h3>
              {outstanding.length === 0 ? (
                <div className="text-center py-12 text-gray-500"><div className="text-5xl mb-4">🎉</div>No outstanding invoices!</div>
              ) : (
                <div className="space-y-2">
                  {outstanding.map(b => (
                    <div key={b.id} className={`flex justify-between items-center p-4 rounded-lg border-l-4 ${b.daysSince > 30 ? 'bg-red-50 border-red-500' : b.daysSince > 14 ? 'bg-amber-50 border-amber-500' : 'bg-blue-50 border-blue-500'}`}>

                        <button onClick={() => updateBookingStatus(b.id, 'paid')} className="text-sm bg-green-500 text-white px-3 py-1 rounded mt-1">💰 Paid</button>
                      </div>

                  ))}
                </div>
              )}
            </div>
