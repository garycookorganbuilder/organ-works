          {reportType === 'awaiting' && (
            <div>
              <h3 className="text-xl font-bold mb-4">Needs Invoicing ({awaitingInvoice.length})</h3>
              {awaitingInvoice.length === 0 ? (
                <div className="text-center py-12 text-gray-500"><div className="text-5xl mb-4">✨</div>All caught up!</div>
              ) : (
                <div className="space-y-2">
                  {awaitingInvoice.map(b => (
                    <div key={b.id} className={`flex justify-between items-center p-4 rounded-lg border-l-4 ${b.daysSince > 14 ? 'bg-red-50 border-red-500' : b.daysSince > 7 ? 'bg-amber-50 border-amber-500' : 'bg-gray-50 border-gray-300'}`}>
                      <div>
                        <div className="font-bold">{b.customer?.name || 'Unknown'}</div>
                        <div className="text-sm text-gray-500">{parseLocalDate(b.date).toLocaleDateString('en-GB')} • {getJobTypeLabel(b.type)}</div>
                      </div>
                      <div className="text-right">
                        <div className="font-bold text-lg">{formatCurrency(b.price)}</div>
                        <button onClick={() => updateBookingStatus(b.id, 'invoiced')} className="text-sm bg-amber-500 text-white px-3 py-1 rounded mt-1">📧 Invoice</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    );
  });

  // ============================================================
  // "WHAT AM I PLACING" BOXES
  // Shown in the side list on a wide screen, above the calendar on a tablet.
  // ============================================================

  const blockControls = blockMode && (
    <div className="mt-3 p-3 bg-white rounded-lg border-2 border-gray-300 text-gray-800">
      <div className="text-sm font-bold mb-2">Which days of the week?</div>
      <div className="grid grid-cols-3 gap-2">
        {['mw', 'mt', 'mf'].map(k => (
          <button key={k} onClick={() => setBlockDays(k)} className={`py-3 rounded-lg text-sm font-medium touch-target ${blockDays === k ? 'bg-gray-800 text-white' : 'bg-gray-200'}`}>{BLOCK_DAY_LABELS[k]}</button>
        ))}
      </div>
      {!blockStart && <div className="text-lg mt-3 font-bold text-center p-3 rounded-lg bg-green-200 text-green-800">👆 Tap the FIRST day</div>}
      {blockStart && !blockEnd && (
        <div className="text-lg mt-3 font-bold text-center p-3 rounded-lg bg-green-200 text-green-800">
          First day: {formatDayLong(blockStart)}<br/>👆 Now tap the LAST day
        </div>
      )}
      {blockPlan && (
        <div className="mt-3">
          <div className="font-bold">{formatDayLong(blockStart)} → {formatDayLong(blockEnd)}</div>
          <div className="text-2xl font-bold mt-1">{blockPlan.dates.length} day{blockPlan.dates.length === 1 ? '' : 's'}</div>
          {blockPlan.alreadyBooked.length > 0 && <div className="text-sm text-orange-700 mt-1">{blockPlan.alreadyBooked.length} day{blockPlan.alreadyBooked.length === 1 ? ' already has' : 's already have'} something booked and will be left alone.</div>}
          {blockPlan.daysOffSkipped.length > 0 && <div className="text-sm text-gray-600 mt-1">{blockPlan.daysOffSkipped.length} day{blockPlan.daysOffSkipped.length === 1 ? '' : 's'} off skipped.</div>}
          {blockPlan.tooMany && <div className="text-sm text-red-700 mt-1 font-bold">That is more than {BLOCK_MAX_DAYS} days. Choose a shorter block.</div>}
          <button onClick={confirmBlock} disabled={blockPlan.dates.length === 0 || blockPlan.tooMany} className="w-full mt-3 py-3 bg-green-600 text-white rounded-lg text-lg font-bold touch-target disabled:opacity-50">
            ✓ {blockMode === 'off' ? 'Mark' : 'Book'} {blockPlan.dates.length} day{blockPlan.dates.length === 1 ? '' : 's'}{blockMode === 'off' ? ' off' : ''}
          </button>
          <button onClick={() => { setBlockStart(null); setBlockEnd(null); }} className="w-full mt-2 py-3 bg-gray-200 rounded-lg font-medium touch-target">Choose different days</button>
        </div>
      )}
    </div>
  );

  const bookingBox = selectedCustomerToBook && (
              <div className={`border-2 rounded-lg p-4 mb-3 booking-highlight ${selectedTicketToBook ? 'bg-orange-100 border-orange-500' : selectedGroupToBook ? 'bg-blue-100 border-blue-500' : 'bg-green-100 border-green-500'}`}>
                <div className={isNarrow ? 'grid grid-cols-2 gap-4 items-start' : ''}>
                <div>
                <div className={`font-bold text-lg ${selectedTicketToBook ? 'text-orange-800' : selectedGroupToBook ? 'text-blue-800' : 'text-green-800'}`}>
                  {selectedTicketToBook ? ((selectedTicketToBook.type || 'fault') === 'fault' ? '🔧 Booking Fault:' : '📋 Booking from ticket:') : selectedGroupToBook ? `🔗 Booking Group (${selectedGroupToBook.length}):` : '📍 Booking:'}
                </div>
                {selectedGroupToBook ? (
                  <div className="space-y-1 mt-2">
                    {selectedGroupToBook.map((item, idx) => (
                      <div key={idx} className="font-medium text-blue-700 bg-white rounded px-2 py-1">{item.customer.name}</div>
                    ))}
                  </div>
                ) : (
                  <div className={`font-medium text-lg ${selectedTicketToBook ? 'text-orange-700' : 'text-green-700'}`}>{selectedCustomerToBook.name}</div>
                )}
                {selectedTicketToBook && <div className="text-sm text-orange-600 mt-1">"{selectedTicketToBook.description}"</div>}
                {!selectedGroupToBook && getOpenTickets(selectedCustomerToBook.id).filter(t => t.id !== selectedTicketToBook?.id).length > 0 && (
                  <div className="mt-2 p-2 bg-white rounded-lg border text-sm">
                    <div className="font-bold text-gray-700">📋 Also open for this customer:</div>
                    {getOpenTickets(selectedCustomerToBook.id).filter(t => t.id !== selectedTicketToBook?.id).map(t => (
                      <div key={t.id} className="mt-1">{TICKET_ICONS[t.type] || '📋'} {t.description}</div>
                    ))}
                  </div>
                )}
                </div>
                <div>
                <div className="grid grid-cols-3 gap-2 mt-3">
                  {[{ type: 'OTS', label: 'With helper', desc: 'OTS' }, { type: 'TSC', label: 'Solo', desc: 'TSC' }, { type: 'WS', label: 'Workshop', desc: 'WS' }].map(item => (
                    <button key={item.type} onClick={() => setBookingType(item.type)} className={`py-3 rounded-lg text-sm font-medium touch-target ${bookingType === item.type ? 'bg-blue-500 text-white' : 'bg-gray-200'}`}>
                      {item.label}<br/><span className="text-xs opacity-75">{item.desc}</span>
                    </button>
                  ))}
                </div>
                
                <div className="mt-3">
                  <label className="text-sm text-gray-600">Job notes (optional):</label>
                  <input type="text" value={jobNotes} onChange={(e) => setJobNotes(e.target.value)} className="w-full p-3 border rounded-lg text-sm" placeholder="e.g. Fix cipher, service swell" />
                </div>
                
                {!selectedGroupToBook && !selectedTicketToBook && (
                  <div className="grid grid-cols-2 gap-2 mt-3">
                    <button onClick={clearBlock} className={`py-3 rounded-lg text-sm font-medium touch-target ${blockMode !== 'job' ? 'bg-gray-800 text-white' : 'bg-gray-200'}`}>One day</button>
                    <button onClick={() => startBlock('job')} className={`py-3 rounded-lg text-sm font-medium touch-target ${blockMode === 'job' ? 'bg-gray-800 text-white' : 'bg-gray-200'}`}>Several days</button>
                  </div>
                )}
                {blockMode === 'job'
                  ? blockControls
                  : <div className={`text-lg mt-3 font-bold text-center p-3 rounded-lg ${selectedTicketToBook ? 'text-orange-700 bg-orange-200' : 'text-green-700 bg-green-200'}`}>👆 Now tap a day on the calendar</div>}
                <button onClick={() => { clearBlock(); setSelectedCustomerToBook(null); setSelectedGroupToBook(null); setSelectedTicketToBook(null); setCustomQuote(''); setJobNotes(''); }} className="w-full mt-3 py-3 bg-gray-200 rounded-lg text-lg font-medium touch-target">Cancel</button>
                </div>
                </div>
              </div>
  );

  const allocatingBox = allocatingProject && (
                <div className="bg-purple-500 text-white rounded-lg p-3 mb-2">
                  <div className="font-bold">📍 Placing days</div>
                  <div className="text-sm opacity-80">{allocatingProject.customerName}</div>
                  <div className="font-medium">{allocatingProject.name}</div>
                  {allocatingProject.notes && <div className="text-sm italic opacity-90">{allocatingProject.notes}</div>}
                  {allocatingProject.estimatedDays && <div className="text-sm mt-1">{bookings.filter(b => b.type === 'project' && b.projectId === allocatingProject.id).length} of {allocatingProject.estimatedDays} days</div>}
                  {String(allocatingProject.id).startsWith('temp_')
                    ? <div className="mt-2 p-3 bg-white text-purple-800 rounded-lg font-bold text-center">⏳ Saving the job… one moment</div>
                    : blockMode === 'project'
                    ? blockControls
                    : <>
                        <div className="text-sm mt-2 opacity-90">Tap days to add/remove, or:</div>
                        <button onClick={() => startBlock('project')} className="mt-2 w-full py-3 bg-purple-800 text-white rounded-lg font-medium touch-target">➕ Add a block of days</button>
                      </>}
                  <button onClick={() => { clearBlock(); setAllocatingProject(null); }} className="mt-2 w-full py-3 bg-white text-purple-700 rounded-lg font-medium touch-target">Done</button>
                </div>
  );

  const offBlockBox = blockMode === 'off' && (
    <div className="border-2 rounded-lg p-4 mb-3 bg-yellow-50 border-yellow-500">
      <div className={isNarrow ? 'grid grid-cols-2 gap-4 items-start' : ''}>
        <div>
          <div className="font-bold text-lg text-yellow-900">🏖️ Days off</div>
          <input type="text" value={blockReason} onChange={(e) => setBlockReason(e.target.value)} placeholder="Reason (e.g. Christmas, Holiday)" className="w-full p-3 border-2 rounded-lg mt-2" />
          <button onClick={clearBlock} className="w-full mt-3 py-3 bg-gray-200 rounded-lg text-lg font-medium touch-target">Cancel</button>
        </div>
        <div>{blockControls}</div>
      </div>
    </div>
  );

  const plannerToolbar = (
    <div className="bg-white rounded-lg shadow p-2 mb-3 flex flex-wrap items-center justify-between gap-2 no-print">
      <div className="flex gap-1 bg-gray-100 rounded-lg p-1">
        {[['day', 'Day'], ['week', 'Week'], ['month', 'Month'], ['year', 'Year']].map(([key, label]) => (
          <button key={key} onClick={() => setPlannerView(key)} className={`${isNarrow ? 'px-3' : 'px-5'} py-3 rounded-lg font-bold touch-target ${plannerView === key ? 'bg-gray-800 text-white' : ''}`}>{label}</button>
        ))}
      </div>
      <div className="flex items-center gap-2">
        <button onClick={() => shiftFocus(-1)} aria-label="Earlier" className="px-4 py-3 rounded-lg bg-gray-200 text-xl font-bold touch-target">‹</button>
        <div className="font-bold text-lg text-center" style={{ minWidth: isNarrow ? 190 : 300 }}>{plannerTitle}</div>
        <button onClick={() => shiftFocus(1)} aria-label="Later" className="px-4 py-3 rounded-lg bg-gray-200 text-xl font-bold touch-target">›</button>
        <button onClick={() => setCurrentDate(new Date())} className="px-4 py-3 rounded-lg bg-gray-800 text-white font-bold touch-target">Today</button>
      </div>
      <button onClick={toggleCalm} className={`px-4 py-3 rounded-lg font-medium touch-target ${calm ? 'bg-gray-800 text-white' : 'bg-gray-200'}`}>Calm view: {calm ? 'on' : 'off'}</button>
    </div>
  );

  // One line of "time left" on the day / week / month views. The year view has the full bar.
  const timeLeftStrip = (
    <button onClick={() => setPlannerView('year')} className="w-full text-left bg-white rounded-lg shadow px-4 py-3 mb-3 touch-target no-print flex flex-wrap items-baseline gap-x-4 gap-y-1">
      <span>⏳ <strong className="text-xl">{capacityData.planDaysLeft}</strong> working days left in {currentYear}</span>
      <span><strong className={`text-xl ${capacityData.isOvercommitted ? 'text-red-600' : 'text-green-600'}`}>{capacityData.isOvercommitted ? capacityData.overcommittedBy : capacityData.daysFreeForProjects}</strong> {capacityData.isOvercommitted ? 'days short' : 'still free'}</span>
      <span className="text-gray-600">+{capacityData.stretchFree} Thursdays if needed</span>
      <span className="ml-auto text-blue-600 font-medium">Year view ›</span>
    </button>
  );

  const activeBox = bookingBox || allocatingBox || offBlockBox;

  // ============================================================
  // NEEDS YOU: everything waiting for a decision, in one list
  // ============================================================
  const todayForNeeds = todayStrNow();
  const visitBookings = bookings.filter(b => b.type !== 'project');
  const byDate = (a, b) => String(a.date).localeCompare(String(b.date));
  const needs = {
    notDone: visitBookings.filter(b => b.date < todayForNeeds && ['scheduled', 'confirmed', 'in_progress'].includes(b.status)).sort(byDate),
    toConfirm: visitBookings.filter(b => b.date >= todayForNeeds && b.status === 'scheduled').sort(byDate),
    toInvoice: visitBookings.filter(b => b.status === 'completed').sort(byDate),
    toBePaid: visitBookings.filter(b => b.status === 'invoiced').sort(byDate),
  };
  const openTicketCount = tickets.filter(t => t.status === 'new').length;
  const todoCount = needs.notDone.length + needs.toConfirm.length + needs.toInvoice.length + needs.toBePaid.length + openTicketCount + jobsDue.length;

  // Open a day from the list (on a tablet, jump to the calendar tab first)
  const goToDay = (dateStr) => { setCurrentDate(parseLocalDate(dateStr)); setPlannerTab('calendar'); setSelectedDay(dateStr); };

  const renderNeedGroup = (key, title, list, buttonLabel, onButton, extra) => {
    if (list.length === 0) return null;
    const expanded = !!needsExpanded[key];
    const shown = expanded ? list : list.slice(0, 4);
    return (
      <div className="mb-4" data-need={key}>
        <h3 className="font-bold text-gray-700 mb-2">{title} ({list.length})</h3>
        {shown.map(b => (
          <div key={b.id} className="flex items-center justify-between gap-2 p-2 mb-2 rounded-lg border-2 border-gray-200 bg-gray-50">
            <button onClick={() => goToDay(b.date)} className="text-left flex-1 min-w-0 py-1 touch-target">
              <div className="font-bold truncate">{nameFor(b.customerId)}</div>
              <div className="text-sm text-gray-600">{dayWords(b.date)} · {getJobTypeLabel(b.type)}{extra ? extra(b) : ''}</div>
            </button>
            <button onClick={() => onButton(b)} className="flex-shrink-0 px-4 py-3 rounded-lg bg-gray-800 text-white font-bold touch-target">{buttonLabel}</button>
          </div>
        ))}
        {list.length > 4 && (
          <button onClick={() => setNeedsExpanded(prev => ({ ...prev, [key]: !expanded }))} className="w-full py-3 text-sm text-gray-600 bg-gray-100 rounded-lg touch-target">{expanded ? 'Show fewer' : `Show all ${list.length}`}</button>
        )}
      </div>
    );
  };
  const headBtn = isNarrow ? 'px-3 py-3 text-base' : 'px-5 py-3 text-lg';

  // ============================================================
  // MAIN RENDER
  // ============================================================
  
  return (
    <div className={`min-h-screen bg-gray-100 p-3 flex flex-col ${calm ? 'calm' : ''}`}>
      {loadError && (
        <div className="bg-red-100 border-2 border-red-400 text-red-800 rounded-lg p-4 mb-3 flex flex-wrap items-center justify-between gap-3">
          <div className="font-medium">Could not load your data: {loadError}</div>
          <button onClick={loadData} className="px-5 py-3 bg-red-600 text-white rounded-lg font-bold touch-target">Try again</button>
        </div>
      )}
      {/* Header */}
      <div className="bg-white rounded-lg shadow-lg p-4 mb-3 no-print">
        <div className={`flex flex-wrap items-center justify-between ${isNarrow ? 'gap-2' : 'gap-4'}`}>
          <h1 className={isNarrow ? "text-lg font-bold" : "text-3xl font-bold"}>🎹 COMMAND CENTRE</h1>
          
          {view === 'planner' && (
            <div className="relative">
              <input type="text" placeholder="🔍 Search customer..." value={plannerSearch} onChange={(e) => setPlannerSearch(e.target.value)} className={`${isNarrow ? 'w-40 px-3' : 'w-64 px-4'} py-2 border-2 rounded-lg`} />
              {plannerSearch.length > 0 && (
                <div className="absolute top-full left-0 right-0 bg-white border-2 rounded-b-lg shadow-lg max-h-64 overflow-y-auto z-50">
                  {customers.filter(c => c.name.toLowerCase().includes(plannerSearch.toLowerCase())).slice(0, 10).map(c => (
                    <div key={c.id} onMouseDown={(e) => e.preventDefault()} onClick={() => { setSelectedCustomerToBook(c); setBookingType('OTS'); setPlannerSearch(''); }} className="p-3 hover:bg-blue-50 cursor-pointer border-b">
                      <div className="font-medium">{c.name}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
          
          <div className="flex gap-2">
            <button onClick={() => { setView('planner'); setSelectedDay(null); setSelectedCustomer(null); }} className={`${headBtn} rounded-lg font-bold touch-target ${view === 'planner' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>📅 Planner</button>
            <button onClick={() => { setView('customers'); setSelectedCustomer(null); }} className={`${headBtn} rounded-lg font-bold touch-target ${view.includes('customer') ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>👥 Customers</button>
            <button onClick={() => setView('reports')} className={`${headBtn} rounded-lg font-bold touch-target ${view === 'reports' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>📊 Reports</button>
          </div>

          <button onClick={loadData} className={`${isNarrow ? 'px-3 text-base' : 'px-4 text-lg'} py-3 rounded-lg bg-gray-600 text-white font-medium touch-target`}>🔄 Refresh</button>
        </div>
      </div>

      {/* Main Content */}
      {view === 'planner' && (
        <div className={isNarrow ? "flex-1" : "flex gap-3 flex-1 min-h-0"}>
          {/* TABS (tablet only). Hidden while something is being placed on the calendar. */}
          {isNarrow && !activeBox && (
            <div className="grid grid-cols-2 gap-2 mb-3 no-print">
              <button onClick={() => setPlannerTab('calendar')} className={`py-3 rounded-lg text-lg font-bold touch-target ${plannerTab === 'calendar' ? 'bg-gray-800 text-white' : 'bg-white'}`}>📅 Calendar</button>
              <button onClick={() => setPlannerTab('todo')} className={`py-3 rounded-lg text-lg font-bold touch-target ${plannerTab === 'todo' ? 'bg-gray-800 text-white' : 'bg-white'}`}>Needs you ({todoCount})</button>
            </div>
          )}
          {/* LEFT PANEL */}
          <div className={isNarrow ? `bg-white rounded-lg shadow-xl p-4 no-print max-w-3xl mx-auto ${plannerTab === 'todo' && !activeBox ? '' : 'hidden'}` : "w-80 flex-shrink-0 bg-white rounded-lg shadow-xl p-4 no-print overflow-y-auto scroll-panel"} style={isNarrow ? {} : {maxHeight: 'calc(100vh - 160px)'}}>
            {!isNarrow && bookingBox}
            {!isNarrow && offBlockBox}
            
            <h2 className="text-xl font-bold mb-3">Needs you ({todoCount})</h2>
            {todoCount === 0 && <div className="text-center py-6 text-gray-500 text-lg">Nothing needs you right now.</div>}
            {renderNeedGroup('notDone', 'Did this happen?', needs.notDone, '✓ Done', b => updateBookingStatus(b.id, 'completed'))}
            {renderNeedGroup('toConfirm', 'To confirm', needs.toConfirm, '✓ Confirm', b => updateBookingStatus(b.id, 'confirmed'))}
            {renderNeedGroup('toInvoice', 'To invoice', needs.toInvoice, 'Invoice', b => openInvoiceCalc(b))}
            {renderNeedGroup('toBePaid', 'Waiting to be paid', needs.toBePaid, 'Paid', b => updateBookingStatus(b.id, 'paid'), b => ` · ${formatCurrency(b.price)}`)}
            
            {/* Tickets */}
            {(tickets.length > 0 || showAddTicket) && (() => {
              const activeTickets = tickets.filter(t => t.status === 'new');
              const typeIcons = { tuning: '🎹', fault: '⚠️', quote: '💰', reminder: '🔔', 'part-return': '🔧', 'follow-up': '📞' };
              
              const renderTicket = (ticket) => {
                const customer = getCustomerById(ticket.customerId);
                const isSelected = selectedTicketToBook?.id === ticket.id;
                const icon = typeIcons[ticket.type] || '📋';
                return (
                  <div key={ticket.id} onClick={() => selectTicketToBook(ticket)} className={`p-3 rounded-lg cursor-pointer mb-2 border-2 ${isSelected ? 'bg-orange-100 border-orange-500' : 'bg-red-50 border-red-300 hover:border-orange-400'}`}>
                    <div className="font-bold">{icon} {customer?.name || 'Unknown'}</div>
                    {isPortalTicket(ticket) && <div className="inline-block text-xs font-bold bg-blue-600 text-white px-2 py-1 rounded mt-1">From the portal</div>}
                    <div className="text-sm text-gray-700">{ticket.description}</div>
                    {isVisibleToChurch(ticket) && !isPortalTicket(ticket) && <div className="text-xs text-blue-700 mt-1">👁 The church can see this</div>}
                    {ticket.dueDate && <div className="text-xs text-gray-500 mt-1">Due: {formatDate(ticket.dueDate)}</div>}
                    {!ticket.dueDate && ticket.dueType === 'next-visit' && <div className="text-xs text-gray-500 mt-1">Due: next visit</div>}
                    <div className="text-sm font-bold text-orange-700 mt-2">👆 Tap to book a visit</div>
                    <div className="grid grid-cols-3 gap-2 mt-2">
                      <button onClick={(e) => { e.stopPropagation(); closeTicket(ticket.id); }} className="text-sm bg-white border border-gray-300 py-3 rounded-lg touch-target">✓ Done</button>
                      <button onClick={(e) => { e.stopPropagation(); openEditTicket(ticket); }} className="text-sm bg-white border border-gray-300 py-3 rounded-lg touch-target">Edit</button>
                      <button onClick={(e) => { e.stopPropagation(); deleteTicket(ticket.id); }} className="text-sm bg-white border border-gray-300 py-3 rounded-lg touch-target text-red-700">Delete</button>
                    </div>
                  </div>
                );
              };
              
              return (
                <div className="mb-4">
                  {activeTickets.length > 0 && (
                    <>
                      <h3 className="font-bold text-gray-700 mb-2">Tickets ({activeTickets.length})</h3>
                      {activeTickets.map(renderTicket)}
                    </>
                  )}
                </div>
              );
            })()}
            
            {jobsDue.length > 0 && <h3 className="font-bold text-gray-700 mb-2">Tunings to book ({jobsDue.length})</h3>}
            <div className="space-y-2 mb-4">
              {jobsDue.length === 0 ? null : (() => {
                // Group jobs by tuningGroup
                const grouped = {};
                const ungrouped = [];
                jobsDue.forEach(item => {
                  if (item.customer.tuningGroup) {
                    const key = `${item.customer.tuningGroup}-${item.month}-${item.year}`;
                    if (!grouped[key]) grouped[key] = { group: item.customer.tuningGroup, month: item.month, year: item.year, monthName: item.monthName, urgent: item.urgent, items: [] };
                    grouped[key].items.push(item);
                    if (item.urgent) grouped[key].urgent = true;
                  } else {
                    ungrouped.push(item);
                  }
                });
                
                const allItems = [...Object.values(grouped), ...ungrouped.map(item => ({ items: [item], month: item.month, year: item.year, monthName: item.monthName, urgent: item.urgent }))];
                allItems.sort((a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0));
                
                return allItems.map((entry, idx) => {
                  const isGroup = entry.items.length > 1;
                  const isSelected = isGroup 
                    ? selectedGroupToBook && entry.items.every(item => selectedGroupToBook.some(g => g.customer.id === item.customer.id))
                    : selectedCustomerToBook?.id === entry.items[0].customer.id;
                  
                  return (
                    <div key={idx} onClick={() => {
                      if (isGroup) {
                        setSelectedGroupToBook(entry.items);
                        setSelectedCustomerToBook(entry.items[0].customer);
                      } else {
                        setSelectedCustomerToBook(entry.items[0].customer);
                        setSelectedGroupToBook(null);
                      }
                      setBookingType('OTS');
                      setCustomQuote('');
                      setJobNotes('');
                    }}
                      className={`p-4 rounded-lg cursor-pointer transition-all touch-target ${entry.urgent ? 'bg-amber-50 border-2 border-amber-400' : 'bg-gray-50 border-2 border-gray-200'} ${isSelected ? 'ring-4 ring-green-500' : 'hover:border-blue-400'}`}>

              <div className="text-sm text-gray-600 mb-1">Access notes (the church can see and change these)</div>
              {accessNotesDraft === null ? (
                <div className="flex items-start gap-3">
                  <div className="flex-1 whitespace-pre-line p-3 bg-gray-50 rounded-lg min-h-[52px]">{editingCustomer.accessNotes || <span className="text-gray-400">Nothing written yet</span>}</div>
                  <button onClick={() => setAccessNotesDraft(editingCustomer.accessNotes || '')} className="bg-white border-2 border-gray-300 px-4 py-3 rounded-lg touch-target">Edit</button>
                </div>
              ) : (
                <div>
                  <textarea value={accessNotesDraft} onChange={(e) => setAccessNotesDraft(e.target.value)} className="w-full p-3 border-2 rounded-lg min-h-[100px]" placeholder="Where the key is, alarm, parking..." />
                  <div className="flex gap-2 mt-2">
                    <button onClick={() => saveAccessNotes(editingCustomer, accessNotesDraft)} className="bg-green-500 text-white px-5 py-3 rounded-lg font-bold touch-target">Save</button>
                    <button onClick={() => setAccessNotesDraft(null)} className="bg-gray-200 px-5 py-3 rounded-lg touch-target">Cancel</button>
                  </div>
                </div>
              )}
            </div>
            
            {/* Delete Customer */}
            <div className="border-t-2 pt-4 mt-6">
              <button onClick={() => deleteCustomer(editingCustomer.id)} className="bg-red-100 text-red-600 px-4 py-2 rounded-lg hover:bg-red-200 text-sm">🗑️ Delete Customer</button>
            </div>
          </div>
        );
      })()}
      
      {view === 'reports' && <ReportsView />}
      
      {showProjectSummary && <ProjectSummaryModal key={showProjectSummary.id} project={showProjectSummary} onClose={() => setShowProjectSummary(null)} />}
      {showInvoiceCalc && <InvoiceCalcModal />}
      {zoomedMonth && <MonthZoomView month={zoomedMonth.month} year={zoomedMonth.year} onClose={() => setZoomedMonth(null)} />}
      
      {/* Edit Ticket Modal */}
      {editingTicket && (() => {
        const customer = getCustomerById(editingTicket.customerId);
        const typeIcons = { tuning: '🎹', fault: '⚠️', quote: '💰', reminder: '🔔', 'part-return': '🔧', 'follow-up': '📞' };
        
        return (
          <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={() => setEditingTicket(null)}>
            <div className="bg-white rounded-xl p-6 max-w-md w-full max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
              <div className="flex justify-between items-start mb-4">
                <h2 className="text-2xl font-bold">Edit ticket</h2>
                <button onClick={() => setEditingTicket(null)} className="px-4 py-3 bg-gray-200 rounded-lg font-medium touch-target">✕ Close</button>
              </div>
              
              <div className="mb-4 p-3 bg-gray-100 rounded-lg">
                <div className="font-bold text-lg">{customer?.name || 'Unknown'}</div>
              </div>
              
              <div className="mb-4">
                <label className="block text-sm text-gray-600 mb-1">Type</label>
                <select value={editingTicket.type || 'fault'} onChange={(e) => setEditingTicket({...editingTicket, type: e.target.value})} className="w-full p-3 border-2 rounded-lg">
                  <option value="tuning">🎹 Tuning Request</option>
                  <option value="fault">⚠️ Fault</option>
                  <option value="quote">💰 Quote Required</option>
                  <option value="reminder">🔔 Reminder</option>
                  <option value="part-return">🔧 Part to Return</option>
                  <option value="follow-up">📞 Follow Up</option>
                </select>
              </div>
              
              <div className="mb-4">
                <label className="block text-sm text-gray-600 mb-1">Description</label>
                <textarea value={editingTicket.description || ''} onChange={(e) => setEditingTicket({...editingTicket, description: e.target.value})} className="w-full p-3 border-2 rounded-lg min-h-[100px]" placeholder="What needs to be done?" />
              </div>
              
              <label className="flex items-center gap-3 mb-4 p-3 rounded-lg bg-blue-50 border border-blue-200 cursor-pointer touch-target">
                <input type="checkbox" className="w-6 h-6" checked={isVisibleToChurch(editingTicket)} disabled={isPortalTicket(editingTicket)} onChange={(e) => setEditingTicket({...editingTicket, visibleToCustomer: e.target.checked})} />
                <span>👁 The church can see this in the portal{isPortalTicket(editingTicket) ? ' (they sent it)' : ''}</span>
              </label>
              
              <div className="flex gap-2">
                <button onClick={() => updateTicket(editingTicket)} className="flex-1 py-3 bg-green-500 text-white rounded-lg font-medium">Save</button>
                <button onClick={() => { deleteTicket(editingTicket.id); }} className="py-3 px-4 bg-red-100 text-red-600 rounded-lg font-medium">Delete</button>
              </div>
            </div>
          </div>
        );
      })()}
      
      {undoInfo && (
        <div className="undo-bar no-print" role="status">
          <span>{undoInfo.message}</span>
          <button className="undo-btn" onClick={doUndo}>↩ Undo</button>
          <button className="ok-btn" onClick={settleUndo}>OK</button>
        </div>
      )}
      
      {confirmDialog && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[60] p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
            <div className="text-lg whitespace-pre-line">{confirmDialog.message}</div>
            <div className="flex gap-3 mt-6">
              <button onClick={() => setConfirmDialog(null)} className="flex-1 py-3 bg-gray-200 rounded-lg text-lg font-medium touch-target">Cancel</button>
              <button onClick={() => { const run = confirmDialog.onConfirm; setConfirmDialog(null); run(); }} className="flex-1 py-3 bg-red-600 text-white rounded-lg text-lg font-bold touch-target">{confirmDialog.confirmLabel}</button>
            </div>
          </div>
        </div>
      )}
      
      <SavingIndicator />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<CommandCentre />);
  </script>
</body>
</html>
