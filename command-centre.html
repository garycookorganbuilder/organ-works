<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Centre — Organ Works</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { touch-action: manipulation; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 0; 
    }
    
    /* ADHD-friendly: Reduce visual noise when booking */
    .focus-mode .dim-when-booking {
      opacity: 0.3;
      pointer-events: none;
      filter: grayscale(50%);
    }
    
    /* ADHD-friendly: Clear visual feedback on booking panel */
    .booking-highlight {
      animation: pulse-green 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    }
    
    /* Large touch targets */
    .touch-target {
      min-height: 48px;
      min-width: 48px;
    }
    
    /* Loading state */
    .loading-spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @media print {
      .no-print { display: none !important; }
      body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ============================================================
// CONFIGURATION
// ============================================================

const getApiUrl = () => localStorage.getItem('organWorks_apiUrl') || '';
const setApiUrl = (url) => localStorage.setItem('organWorks_apiUrl', url);

// ============================================================
// API FUNCTIONS
// ============================================================

const apiCall = async (action, params = {}) => {
  const API_URL = getApiUrl();
  if (!API_URL) throw new Error('API URL not configured');
  
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  
  Object.keys(params).forEach(key => {
    if (typeof params[key] === 'object') {
      url.searchParams.set(key, JSON.stringify(params[key]));
    } else {
      url.searchParams.set(key, params[key]);
    }
  });
  
  const response = await fetch(url.toString());
  const data = await response.json();
  
  if (data && data.error) {
    throw new Error(data.error);
  }
  
  return data;
};

// ============================================================
// MAIN COMPONENT
// ============================================================

const CommandCentre = () => {
  const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 
                      'July', 'August', 'September', 'October', 'November', 'December'];
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  // Default pricing
  const DEFAULT_PRICES = {
    tuning_full: 550,
    tuning_half: 300,
    fault: 300,
    big: 550
  };

  // State
  const [isConfigured, setIsConfigured] = useState(!!getApiUrl());
  const [configUrl, setConfigUrl] = useState('');
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  
  const [customers, setCustomers] = useState([]);
  const [contacts, setContacts] = useState([]);
  const [bookings, setBookings] = useState([]);
  const [daysOff, setDaysOff] = useState([]);
  const [tickets, setTickets] = useState([]);

  const [viewMode, setViewMode] = useState('year');
  const [currentDate, setCurrentDate] = useState(new Date());
  const [selectedCustomerToBook, setSelectedCustomerToBook] = useState(null);
  const [selectedTicketToBook, setSelectedTicketToBook] = useState(null);
  const [selectedDay, setSelectedDay] = useState(null);
  const [view, setView] = useState('planner');
  const [selectedCustomer, setSelectedCustomer] = useState(null);
  const [bookingType, setBookingType] = useState('OTS');
  const [customQuote, setCustomQuote] = useState('');
  const [jobNotes, setJobNotes] = useState('');
  const [showAddTicket, setShowAddTicket] = useState(false);
  const [newTicketCustomer, setNewTicketCustomer] = useState('');
  const [newTicketDescription, setNewTicketDescription] = useState('');
  const [customerSearch, setCustomerSearch] = useState('');
  
  // Invoice calculator
  const [showInvoiceCalc, setShowInvoiceCalc] = useState(null); // booking object or null
  const [selectedBand, setSelectedBand] = useState(null);
  const [pricing, setPricing] = useState({ timeBands: [], distanceBands: [] });
  const [invoiceMaterials, setInvoiceMaterials] = useState([]); // [{description, cost}]
  const [newMaterialDesc, setNewMaterialDesc] = useState('');
  const [newMaterialCost, setNewMaterialCost] = useState('');
  const [materialsList, setMaterialsList] = useState([]); // quick-pick from sheet
  const [materialSearch, setMaterialSearch] = useState('');
  const [materialQty, setMaterialQty] = useState(1);
  const [newMaterialQty, setNewMaterialQty] = useState(1);
  const [selectedMaterial, setSelectedMaterial] = useState(null); // {name, price}

  // Current year for planner
  const currentYear = currentDate.getFullYear();
  
  // Planner months
  const plannerMonths = monthNames.map((name, idx) => ({
    name,
    year: currentYear,
    month: idx,
    days: new Date(currentYear, idx + 1, 0).getDate()
  }));

  // ============================================================
  // DATA LOADING
  // ============================================================
  
  const loadData = useCallback(async () => {
    if (!getApiUrl()) return;
    
    setLoading(true);
    try {
      const data = await apiCall('getAllData');
      
      // Parse customers
      const parsedCustomers = (data.customers || []).map(c => ({
        ...c,
        tuningMonths: typeof c.tuningMonths === 'string' ? 
          (c.tuningMonths ? JSON.parse(c.tuningMonths) : []) : 
          (c.tuningMonths || []),
        customRate: c.customRate ? parseFloat(c.customRate) : null
      }));
      
      setCustomers(parsedCustomers);
      setContacts(data.contacts || []);
      // Normalize booking dates to YYYY-MM-DD format
      const normalizedBookings = (data.bookings || []).map(b => ({
        ...b,
        date: b.date ? b.date.split('T')[0] : b.date
      }));
      setBookings(normalizedBookings);
      setDaysOff((data.daysOff || []).map(d => d.date));
      setTickets(data.tickets || []);
      setPricing(data.pricing || { timeBands: [], distanceBands: [] });
      setMaterialsList(data.materialsList || []);
      
    } catch (err) {
      console.error('Failed to load data:', err);
      alert('Failed to load data: ' + err.message);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    if (isConfigured) {
      loadData();
    }
  }, [isConfigured, loadData]);

  // ============================================================
  // HELPER FUNCTIONS
  // ============================================================
  
  const getDateString = (year, month, day) => 
    `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  
  const getDayOfWeek = (year, month, day) => new Date(year, month, day).getDay();
  
  const isWorkDay = (year, month, day) => {
    const dow = getDayOfWeek(year, month, day);
    return dow >= 1 && dow <= 5; // Mon-Fri available
  };
  
  const getBookingsForDay = (date) => bookings.filter(b => b.date === date);
  
  const getCustomerById = (id) => customers.find(c => c.id === id);
  
  const isDayOff = (date) => daysOff.includes(date);

  const getJobPrice = (type, customer, customAmount) => {
    if (customAmount) return parseFloat(customAmount);
    if (type === 'tuning_full') return customer?.customRate || DEFAULT_PRICES.tuning_full;
    if (type === 'tuning_half') return customer?.customRate ? Math.round(customer.customRate * 0.55) : DEFAULT_PRICES.tuning_half;
    if (type === 'fault') return DEFAULT_PRICES.fault;
    if (type === 'big') return DEFAULT_PRICES.big;
    return 0;
  };

  const getJobTypeLabel = (type) => {
    // New service types
    if (type === 'OTS') return 'On-site (with helper)';
    if (type === 'TSC') return 'Solo Site Work';
    if (type === 'WS') return 'Workshop';
    // Legacy types
    if (type === 'tuning_full') return 'Tuning (Full Day)';
    if (type === 'tuning_half') return 'Tuning (Half Day)';
    if (type === 'fault') return 'Fault Visit';
    if (type === 'big') return 'Big Job';
    return type || 'Visit';
  };

  const getJobTypeColor = (type) => {
    // New service types
    if (type === 'OTS') return 'blue';
    if (type === 'TSC') return 'green';
    if (type === 'WS') return 'purple';
    // Legacy types for existing bookings
    if (type?.startsWith('tuning')) return 'blue';
    if (type === 'fault') return 'orange';
    if (type === 'big') return 'red';
    return 'gray';
  };

  const isCustomerBookedInMonth = (customerId, monthIndex, year) => {
    const monthStart = getDateString(year, monthIndex, 1);
    const monthEnd = getDateString(year, monthIndex, new Date(year, monthIndex + 1, 0).getDate());
    return bookings.some(b => 
      b.customerId === customerId && 
      b.date >= monthStart && 
      b.date <= monthEnd
    );
  };

  const getCustomerHistory = (customerId) => {
    return bookings
      .filter(b => b.customerId === customerId)
      .sort((a, b) => new Date(b.date) - new Date(a.date));
  };

  const getLastTuningPrice = (customerId) => {
    const history = getCustomerHistory(customerId);
    const lastTuning = history.find(b => b.type?.startsWith('tuning') && b.status === 'paid');
    return lastTuning ? parseFloat(lastTuning.price) : null;
  };

  const getJobsDue = () => {
    const now = new Date();
    const thisMonth = now.getMonth();
    const thisYear = now.getFullYear();
    const nextMonth = (thisMonth + 1) % 12;
    const nextYear = thisMonth === 11 ? thisYear + 1 : thisYear;

    const due = [];
    customers.forEach(customer => {
      if (!customer.tuningMonths || customer.tuningMonths.length === 0) return;
      
      if (customer.tuningMonths.includes(thisMonth) && !isCustomerBookedInMonth(customer.id, thisMonth, thisYear)) {
        due.push({ customer, month: thisMonth, year: thisYear, monthName: monthNames[thisMonth], urgent: true });
      }
      if (customer.tuningMonths.includes(nextMonth) && !isCustomerBookedInMonth(customer.id, nextMonth, nextYear)) {
        due.push({ customer, month: nextMonth, year: nextYear, monthName: monthNames[nextMonth], urgent: false });
      }
    });
    return due;
  };

  const jobsDue = getJobsDue();

  // ============================================================
  // BOOKING FUNCTIONS
  // ============================================================
  
  const addBooking = async (date, customerId, type, price, notes, ticket = null) => {
    setSaving(true);
    try {
      // Price is calculated later based on actual hours - store 0 for now
      const result = await apiCall('addBooking', {
        data: {
          date,
          customerId,
          type,
          serviceType: type, // OTS, TSC, WS
          price: price || 0,
          status: 'scheduled',
          notes: notes || ''
        }
      });
      
      // Add to local state
      setBookings([...bookings, {
        id: result.id,
        date,
        customerId,
        type,
        serviceType: type,
        price: price || 0,
        status: 'scheduled',
        notes: notes || ''
      }]);
      
      // If this came from a ticket, mark it scheduled
      if (ticket) {
        await apiCall('updateTicket', {
          data: {
            id: ticket.id,
            status: 'scheduled',
            bookingId: result.id
          }
        });
        setTickets(tickets.filter(t => t.id !== ticket.id));
        setSelectedTicketToBook(null);
      }
      
      // Clear booking form
      setSelectedCustomerToBook(null);
      setCustomQuote('');
      setJobNotes('');
      setLastSaved(new Date());
      
    } catch (err) {
      alert('Failed to save booking: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const removeBooking = async (date, bookingId) => {
    if (!confirm('Remove this booking?')) return;
    
    setSaving(true);
    try {
      await apiCall('deleteBooking', { bookingId });
      setBookings(bookings.filter(b => b.id !== bookingId));
      
      // Refresh tickets in case this booking was linked to one
      const ticketData = await apiCall('getTickets');
      setTickets(ticketData || []);
      
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to remove booking: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const updateBookingStatus = async (bookingId, status) => {
    setSaving(true);
    try {
      const updates = { id: bookingId, status };
      if (status === 'invoiced') updates.invoiceDate = new Date().toISOString().split('T')[0];
      if (status === 'paid') updates.paidDate = new Date().toISOString().split('T')[0];
      
      await apiCall('updateBooking', { data: updates });
      
      setBookings(bookings.map(b => 
        b.id === bookingId ? { ...b, ...updates } : b
      ));
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to update: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const toggleDayOff = async (date) => {
    setSaving(true);
    try {
      if (isDayOff(date)) {
        await apiCall('removeDayOff', { date });
        setDaysOff(daysOff.filter(d => d !== date));
      } else {
        await apiCall('addDayOff', { data: { date, reason: '' } });
        setDaysOff([...daysOff, date]);
      }
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to update day off: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const handleDayClick = (dateStr, year, month, day) => {
    if (!isWorkDay(year, month, day)) return;
    if (isDayOff(dateStr)) return;
    
    if (selectedCustomerToBook) {
      const price = customQuote ? parseFloat(customQuote) : 0; // Price calculated later from hours
      addBooking(dateStr, selectedCustomerToBook.id, bookingType, price, jobNotes, selectedTicketToBook);
    } else {
      setSelectedDay(dateStr);
    }
  };

  // ============================================================
  // TICKET FUNCTIONS
  // ============================================================

  const addTicket = async () => {
    if (!newTicketCustomer || !newTicketDescription) return;
    
    setSaving(true);
    try {
      const result = await apiCall('addTicket', {
        data: {
          customerId: newTicketCustomer,
          description: newTicketDescription,
          status: 'new'
        }
      });
      
      setTickets([...tickets, {
        id: result.id,
        customerId: newTicketCustomer,
        description: newTicketDescription,
        status: 'new',
        createdAt: new Date().toISOString()
      }]);
      
      setShowAddTicket(false);
      setNewTicketCustomer('');
      setNewTicketDescription('');
      setCustomerSearch('');
      setLastSaved(new Date());
      
    } catch (err) {
      alert('Failed to add: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const selectTicketToBook = (ticket) => {
    const customer = getCustomerById(ticket.customerId);
    setSelectedCustomerToBook(customer);
    setSelectedTicketToBook(ticket);
    setBookingType('TSC');
    setJobNotes(ticket.description);
  };

  const deleteTicket = async (ticketId) => {
    setSaving(true);
    try {
      await apiCall('deleteTicket', { ticketId });
      setTickets(tickets.filter(t => t.id !== ticketId));
    } catch (err) {
      alert('Failed to delete: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  // ============================================================
  // CUSTOMER FUNCTIONS
  // ============================================================
  
  const updateCustomer = async (customer) => {
    setSaving(true);
    try {
      await apiCall('updateCustomer', { 
        data: {
          ...customer,
          tuningMonths: customer.tuningMonths
        }
      });
      
      setCustomers(customers.map(c => c.id === customer.id ? customer : c));
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to save: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  // ============================================================
  // STATS
  // ============================================================
  
  const getStats = () => {
    const completedJobs = bookings.filter(b => b.status === 'completed');
    const uninvoicedTotal = completedJobs.reduce((sum, b) => sum + (parseFloat(b.price) || 0), 0);
    const awaitingPayment = bookings.filter(b => b.status === 'invoiced');
    const awaitingTotal = awaitingPayment.reduce((sum, b) => sum + (parseFloat(b.price) || 0), 0);
    
    return {
      tuningDays: bookings.filter(b => b.type?.startsWith('tuning')).length,
      faultDays: bookings.filter(b => b.type === 'fault').length,
      bigDays: bookings.filter(b => b.type === 'big').length,
      needsInvoicing: completedJobs.length,
      uninvoicedTotal,
      awaitingPayment: awaitingPayment.length,
      awaitingTotal
    };
  };

  const stats = getStats();

  // ============================================================
  // CONFIGURATION SCREEN
  // ============================================================
  
  if (!isConfigured) {
    return (
      <div className="min-h-screen bg-gray-900 flex items-center justify-center p-8">
        <div className="bg-white rounded-2xl p-8 max-w-lg w-full shadow-2xl">
          <h1 className="text-3xl font-bold mb-2">🎹 Command Centre</h1>
          <p className="text-gray-600 mb-6">Connect to your Google Sheets database</p>
          
          <label className="block text-sm font-medium text-gray-700 mb-2">
            Google Apps Script URL
          </label>
          <input
            type="text"
            value={configUrl}
            onChange={(e) => setConfigUrl(e.target.value)}
            placeholder="https://script.google.com/macros/s/..."
            className="w-full p-4 text-lg border-2 rounded-lg mb-6"
          />
          
          <button
            onClick={() => {
              if (configUrl) {
                setApiUrl(configUrl);
                setIsConfigured(true);
              }
            }}
            className="w-full bg-blue-600 text-white py-4 rounded-lg text-xl font-bold hover:bg-blue-700"
          >
            Connect
          </button>
        </div>
      </div>
    );
  }

  // ============================================================
  // LOADING SCREEN
  // ============================================================
  
  if (loading) {
    return (
      <div className="min-h-screen bg-gray-100 flex items-center justify-center">
        <div className="text-center">
          <div className="loading-spinner mx-auto mb-4"></div>
          <p className="text-xl text-gray-600">Loading your data...</p>
        </div>
      </div>
    );
  }

  // ============================================================
  // JOBS DUE PANEL (Left sidebar)
  // ============================================================
  
  const jobsDuePanelContent = (
    <div className="w-80 bg-white rounded-lg shadow-xl p-4 flex flex-col h-full no-print">
      
      {/* BOOKING CONFIRMATION - Always at top when active */}
      {selectedCustomerToBook && (
        <div className={`border-2 rounded-lg p-4 mb-3 booking-highlight ${selectedTicketToBook ? 'bg-orange-100 border-orange-500' : 'bg-green-100 border-green-500'}`}>
          <div className={`font-bold text-lg ${selectedTicketToBook ? 'text-orange-800' : 'text-green-800'}`}>
            {selectedTicketToBook ? '🔧 Booking Fault:' : '📍 Booking:'}
          </div>
          <div className={`font-medium text-lg ${selectedTicketToBook ? 'text-orange-700' : 'text-green-700'}`}>{selectedCustomerToBook.name}</div>
          {selectedTicketToBook && (
            <div className="text-sm text-orange-600 mt-1">"{selectedTicketToBook.description}"</div>
          )}
          
          <div className="grid grid-cols-3 gap-2 mt-3">
            {[
              { type: 'OTS', label: 'OTS', desc: 'With helper' },
              { type: 'TSC', label: 'Solo', desc: 'Just me' },
              { type: 'WS', label: 'Workshop', desc: 'No travel' }
            ].map(item => (
              <button
                key={item.type}
                onClick={() => setBookingType(item.type)}
                className={`py-3 rounded-lg text-sm font-medium touch-target ${
                  bookingType === item.type 
                    ? 'bg-blue-500 text-white'
                    : 'bg-gray-200'
                }`}
              >
                {item.label}<br/>
                <span className="text-xs opacity-75">{item.desc}</span>
              </button>
            ))}
          </div>
          
          {bookingType === 'big' && (
            <div className="mt-3">
              <label className="text-sm text-gray-600">Quote amount:</label>
              <div className="relative">
                <span className="absolute left-3 top-3 text-gray-500">£</span>
                <input
                  type="number"
                  value={customQuote}
                  onChange={(e) => setCustomQuote(e.target.value)}
                  className="w-full p-3 pl-7 border rounded-lg"
                  placeholder="Enter quote"
                />
              </div>
            </div>
          )}
          
          <div className="mt-3">
            <label className="text-sm text-gray-600">Job notes (optional):</label>
            <input
              type="text"
              value={jobNotes}
              onChange={(e) => setJobNotes(e.target.value)}
              className="w-full p-3 border rounded-lg text-sm"
              placeholder="e.g. Fix cipher, service swell"
            />
          </div>
          
          {/* ADHD: Very clear next step instruction */}
          <div className={`text-lg mt-4 font-bold text-center p-3 rounded-lg ${selectedTicketToBook ? 'text-orange-700 bg-orange-200' : 'text-green-700 bg-green-200'}`}>
            👆 Now tap a day on the calendar
          </div>
          
          <button
            onClick={() => { setSelectedCustomerToBook(null); setSelectedTicketToBook(null); setCustomQuote(''); setJobNotes(''); }}
            className="w-full mt-3 py-3 bg-gray-200 rounded-lg text-lg font-medium touch-target"
          >
            Cancel
          </button>
        </div>
      )}
      
      {/* INBOX - Faults and requests */}
      {(tickets.length > 0 || showAddTicket) && (
        <div className="mb-4 pb-4 border-b-2">
          <div className="flex justify-between items-center mb-2">
            <h2 className="text-lg font-bold">📥 Inbox ({tickets.length})</h2>
          </div>
          
          {tickets.map(ticket => {
            const customer = getCustomerById(ticket.customerId);
            const isSelected = selectedTicketToBook?.id === ticket.id;
            const age = Math.floor((new Date() - new Date(ticket.createdAt)) / (1000 * 60 * 60 * 24));
            
            return (
              <div
                key={ticket.id}
                onClick={() => selectTicketToBook(ticket)}
                className={`p-3 rounded-lg cursor-pointer mb-2 border-2 ${
                  isSelected 
                    ? 'bg-orange-100 border-orange-500 ring-4 ring-orange-300' 
                    : 'bg-red-50 border-red-300 hover:border-orange-400'
                }`}
              >
                <div className="flex justify-between items-start">
                  <div className="font-bold">{customer?.name || 'Unknown'}</div>
                  <button 
                    onClick={(e) => { e.stopPropagation(); deleteTicket(ticket.id); }}
                    className="text-gray-400 hover:text-red-500 text-sm"
                  >✕</button>
                </div>
                <div className="text-sm text-gray-700">{ticket.description}</div>
                <div className="text-xs text-gray-400 mt-1">
                  {age === 0 ? 'Today' : age === 1 ? 'Yesterday' : `${age} days ago`}
                </div>
              </div>
            );
          })}
        </div>
      )}
      
      {/* Add ticket form */}
      {showAddTicket && (
        <div className="mb-4 pb-4 border-b-2 bg-yellow-50 p-3 rounded-lg">
          <div className="font-bold mb-2">New Request</div>
          <input
            type="text"
            placeholder="Search customer..."
            value={customerSearch}
            onChange={(e) => setCustomerSearch(e.target.value)}

            </div>
          )}

          <div className="flex gap-3 items-center">
            <div className="text-sm bg-blue-100 text-blue-800 px-3 py-2 rounded-lg font-medium">
              🔵 {stats.tuningDays} tuning
            </div>
            <div className="text-sm bg-orange-100 text-orange-800 px-3 py-2 rounded-lg font-medium">
              🟠 {stats.faultDays} fault
            </div>
            <div className="text-sm bg-red-100 text-red-800 px-3 py-2 rounded-lg font-medium">
              🔴 {stats.bigDays} big
            </div>
            <button
              onClick={loadData}
              className="px-4 py-3 rounded-lg bg-gray-600 text-white text-lg touch-target"
              title="Refresh data"
            >
              🔄
            </button>
          </div>
        </div>
      </div>

      {/* Main Content */}
      {view === 'planner' && (
        <div className="flex gap-3 flex-1">
          {jobsDuePanelContent}
          <div className="flex-1">
            <YearView />
          </div>
          {selectedDay && <DayPanel date={selectedDay} onClose={() => setSelectedDay(null)} />}
        </div>
      )}

      {view === 'customers' && <CustomerListView />}
      {view === 'customerDetail' && selectedCustomer && <CustomerDetailView />}
      
      {/* Invoice Calculator Modal */}
      {showInvoiceCalc && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
            <div className="flex justify-between items-start mb-4">
              <div>
                <h2 className="text-2xl font-bold">💰 Invoice Calculator</h2>
                <p className="text-gray-600">{getCustomerById(showInvoiceCalc.customerId)?.name}</p>
              </div>
              <button 
                onClick={() => setShowInvoiceCalc(null)}
                className="text-2xl text-gray-400 hover:text-gray-600"
              >×</button>
            </div>
            
            {/* Actual time worked */}
            <div className="bg-gray-100 rounded-lg p-4 mb-4">
              <div className="text-sm text-gray-600">Time on site</div>
              <div className="text-2xl font-bold">
                {showInvoiceCalc.actualHours ? `${Math.floor(showInvoiceCalc.actualHours)}h ${Math.round((showInvoiceCalc.actualHours % 1) * 60)}m` : 'Not recorded'}
              </div>
              <div className="text-sm text-gray-500">Service: {getJobTypeLabel(showInvoiceCalc.type || showInvoiceCalc.serviceType)}</div>
            </div>
            
            {/* Time band selection */}
            <div className="mb-4">
              <div className="text-sm text-gray-600 mb-2">Select time band:</div>
              <div className="grid grid-cols-5 gap-2">
                {pricing.timeBands.map(band => {
                  const serviceType = showInvoiceCalc.serviceType || showInvoiceCalc.type || 'TSC';
                  const price = band[serviceType] || band.TSC || 0;
                  const isSelected = selectedBand === band.hours;
                  const isSuggested = Math.max(4, Math.ceil(showInvoiceCalc.actualHours || 0)) === band.hours;
                  
                  return (
                    <button
                      key={band.hours}
                      onClick={() => setSelectedBand(band.hours)}
                      className={`p-3 rounded-lg text-center border-2 transition-all ${
                        isSelected 
                          ? 'bg-blue-500 text-white border-blue-500' 
                          : isSuggested
                            ? 'bg-blue-100 border-blue-300'
                            : 'bg-white border-gray-200 hover:border-blue-300'
                      }`}
                    >
                      <div className="font-bold">{band.hours}h</div>
                      <div className="text-sm">£{price}</div>
                    </button>
                  );
                })}
              </div>
            </div>
            
            {/* Distance premium */}
            <div className="bg-gray-100 rounded-lg p-4 mb-4">
              <div className="flex justify-between">
                <span className="text-gray-600">Distance</span>
                <span>{showInvoiceCalc.distance || 0} miles</span>
              </div>
              <div className="flex justify-between">
                <span className="text-gray-600">Premium</span>
                <span className="font-bold">
                  +£{pricing.distanceBands.find(d => 
                    (showInvoiceCalc.distance || 0) >= d.minMiles && 
                    (showInvoiceCalc.distance || 0) <= d.maxMiles
                  )?.premium || 0}
                </span>
              </div>
            </div>
            
            {/* Materials */}
            <div className="bg-gray-100 rounded-lg p-4 mb-4">
              <div className="text-sm text-gray-600 mb-2">Materials / Parts</div>
              
              {invoiceMaterials.length > 0 && (
                <div className="space-y-1 mb-3">
                  {invoiceMaterials.map((mat, idx) => {
                    const qty = mat.quantity || 1;
                    const lineTotal = (mat.cost * qty).toFixed(2);
                    return (
                      <div key={idx} className="flex justify-between items-center bg-white p-2 rounded">
                        <span className="text-sm">{mat.description} {qty > 1 ? `×${qty}` : ''}</span>
                        <div className="flex items-center gap-2">
                          <span className="font-medium">£{lineTotal}</span>
                          <button 
                            onClick={() => setInvoiceMaterials(invoiceMaterials.filter((_, i) => i !== idx))}
                            className="text-red-500 text-sm"
                          >✕</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
              
              {/* Searchable dropdown */}
              {materialsList.length > 0 && (
                <div className="relative mb-3">
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="Search materials..."
                      value={materialSearch || ''}
                      onChange={(e) => {
                        setMaterialSearch(e.target.value);
                        setSelectedMaterial(null);
                      }}
                      className="flex-1 p-2 border rounded text-sm"
                    />
                    <input
                      type="number"
                      min="1"
                      value={materialQty}
                      onChange={(e) => setMaterialQty(parseInt(e.target.value) || 1)}
                      className="w-16 p-2 border rounded text-sm text-center"
                      placeholder="Qty"
                    />
                    <button
                      disabled={!selectedMaterial}
                      onClick={() => {
                        if (selectedMaterial) {
                          setInvoiceMaterials([...invoiceMaterials, { 
                            description: selectedMaterial.name, 
                            cost: selectedMaterial.price, 
                            quantity: materialQty 
                          }]);
                          setMaterialSearch('');
                          setSelectedMaterial(null);
                          setMaterialQty(1);
                        }
                      }}
                      className={`px-3 py-2 rounded text-sm font-medium ${selectedMaterial ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-400'}`}
                    >Add</button>
                  </div>
                  {materialSearch && !selectedMaterial && (
                    <div className="absolute top-full left-0 right-0 bg-white border rounded-b shadow-lg max-h-40 overflow-y-auto z-10">
                      {materialsList
                        .filter(m => m.name.toLowerCase().includes(materialSearch.toLowerCase()))
                        .map((mat, idx) => (
                          <div
                            key={idx}
                            onClick={() => {
                              setSelectedMaterial({ name: mat.name, price: mat.price });
                              setMaterialSearch(mat.name);
                            }}
                            className="flex justify-between p-2 hover:bg-blue-50 cursor-pointer border-b"
                          >
                            <span>{mat.name}</span>
                            <span className="text-green-600 font-medium">£{parseFloat(mat.price).toFixed(2)}</span>
                          </div>
                        ))}
                      {materialsList.filter(m => m.name.toLowerCase().includes(materialSearch.toLowerCase())).length === 0 && (
                        <div className="p-2 text-gray-400">No matches</div>
                      )}
                    </div>
                  )}
                </div>
              )}
              
              {/* Manual add */}
              <div className="text-xs text-gray-500 mb-1">Not listed?</div>
              <div className="flex gap-2">
                <input
                  type="text"
                  placeholder="Description"
                  value={newMaterialDesc}
                  onChange={(e) => setNewMaterialDesc(e.target.value)}
                  className="flex-1 p-2 border rounded text-sm"
                />
                <input
                  type="number"
                  placeholder="£"
                  value={newMaterialCost}
                  onChange={(e) => setNewMaterialCost(e.target.value)}
                  className="w-16 p-2 border rounded text-sm"
                />
                <input
                  type="number"
                  min="1"
                  placeholder="Qty"
                  value={newMaterialQty}
                  onChange={(e) => setNewMaterialQty(parseInt(e.target.value) || 1)}
                  className="w-14 p-2 border rounded text-sm text-center"
                />
                <button
                  onClick={() => {
                    if (newMaterialDesc && newMaterialCost) {
                      setInvoiceMaterials([...invoiceMaterials, {
                        description: newMaterialDesc,
                        cost: parseFloat(newMaterialCost),
                        quantity: newMaterialQty
                      }]);
                      setNewMaterialDesc('');
                      setNewMaterialCost('');
                      setNewMaterialQty(1);
                    }
                  }}
                  className="px-3 py-2 bg-blue-500 text-white rounded text-sm font-medium"
                >+</button>
              </div>
            </div>
            
            {/* Total */}
            {(() => {
              const serviceType = showInvoiceCalc.serviceType || showInvoiceCalc.type || 'TSC';
              const band = pricing.timeBands.find(b => b.hours === selectedBand);
              const serviceCharge = band ? (band[serviceType] || band.TSC || 0) : 0;
              const distancePremium = pricing.distanceBands.find(d => 
                (showInvoiceCalc.distance || 0) >= d.minMiles && 
                (showInvoiceCalc.distance || 0) <= d.maxMiles
              )?.premium || 0;
              const materialsTotal = invoiceMaterials.reduce((sum, m) => sum + (m.cost * (m.quantity || 1)), 0);
              const total = serviceCharge + distancePremium + materialsTotal;
              
              return (
                <div className="border-t-2 pt-4 mb-4">
                  <div className="flex justify-between text-lg">
                    <span>Service ({selectedBand}h)</span>
                    <span>£{serviceCharge}</span>
                  </div>
                  <div className="flex justify-between text-lg">
                    <span>Distance</span>
                    <span>+£{distancePremium}</span>
                  </div>
                  {materialsTotal > 0 && (
                    <div className="flex justify-between text-lg">
                      <span>Materials</span>
                      <span>+£{materialsTotal}</span>
                    </div>
                  )}
                  <div className="flex justify-between text-2xl font-bold mt-2 pt-2 border-t">
                    <span>Total</span>
                    <span className="text-green-600">£{total}</span>
                  </div>
                </div>
              );
            })()}
            
            {/* Action buttons */}
            <div className="flex gap-3">
              <button
                onClick={() => setShowInvoiceCalc(null)}
                className="flex-1 py-3 bg-gray-200 rounded-lg font-medium"
              >
                Cancel
              </button>
              <button
                onClick={async () => {
                  const serviceType = showInvoiceCalc.serviceType || showInvoiceCalc.type || 'TSC';
                  const band = pricing.timeBands.find(b => b.hours === selectedBand);
                  const serviceCharge = band ? (band[serviceType] || band.TSC || 0) : 0;
                  const distancePremium = pricing.distanceBands.find(d => 
                    (showInvoiceCalc.distance || 0) >= d.minMiles && 
                    (showInvoiceCalc.distance || 0) <= d.maxMiles
                  )?.premium || 0;
                  const materialsTotal = invoiceMaterials.reduce((sum, m) => sum + (m.cost * (m.quantity || 1)), 0);
                  const total = serviceCharge + distancePremium + materialsTotal;
                  
                  // Update booking with price and status
                  setSaving(true);
                  try {
                    await apiCall('updateBooking', {
                      data: {
                        id: showInvoiceCalc.id,
                        price: total,
                        status: 'invoiced',
                        materials: JSON.stringify(invoiceMaterials),
                        invoiceDate: new Date().toISOString().split('T')[0]
                      }
                    });
                    
                    setBookings(bookings.map(b => 
                      b.id === showInvoiceCalc.id 
                        ? { ...b, price: total, status: 'invoiced', materials: JSON.stringify(invoiceMaterials), invoiceDate: new Date().toISOString().split('T')[0] }
                        : b
                    ));
                    setShowInvoiceCalc(null);
                    setLastSaved(new Date());
                  } catch (err) {
                    alert('Failed to update: ' + err.message);
                  } finally {
                    setSaving(false);
                  }
                }}
                className="flex-1 py-3 bg-green-500 text-white rounded-lg font-bold text-lg"
              >
                ✓ Confirm £{(() => {
                  const serviceType = showInvoiceCalc.serviceType || showInvoiceCalc.type || 'TSC';
                  const band = pricing.timeBands.find(b => b.hours === selectedBand);
                  const serviceCharge = band ? (band[serviceType] || band.TSC || 0) : 0;
                  const distancePremium = pricing.distanceBands.find(d => 
                    (showInvoiceCalc.distance || 0) >= d.minMiles && 
                    (showInvoiceCalc.distance || 0) <= d.maxMiles
                  )?.premium || 0;
                  const materialsTotal = invoiceMaterials.reduce((sum, m) => sum + (m.cost * (m.quantity || 1)), 0);
                  return serviceCharge + distancePremium + materialsTotal;
                })()}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<CommandCentre />);
  </script>
</body>
</html>
