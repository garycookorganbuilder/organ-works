    .undo-bar {

    @media (max-width: 1450px) { .undo-bar { bottom: 72px; } }
    .calm .booking-highlight { animation: none; }
    .saving-indicator.success { background: #16a34a; }
    .mini-spinner {
      width: 14px;
      height: 14px;

  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

const getApiUrl = () => localStorage.getItem('organWorks_apiUrl') || '';
const setApiUrl = (url) => localStorage.setItem('organWorks_apiUrl', url);
const getApiKey = () => localStorage.getItem('organWorks_apiKey') || '';
const setApiKey = (key) => localStorage.setItem('organWorks_apiKey', key);

const apiCall = async (action, params = {}) => {
  const API_URL = getApiUrl();
  if (!API_URL) throw new Error('API URL not configured');
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  const apiKey = getApiKey();
  if (apiKey) url.searchParams.set('key', apiKey);
  Object.keys(params).forEach(key => {
    if (typeof params[key] === 'object') {
      url.searchParams.set(key, JSON.stringify(params[key]));
    } else {
      url.searchParams.set(key, params[key]);
    }
  });
  const response = await fetch(url.toString(), { keepalive: true });
  const data = await response.json();
  if (data && data.error === 'ACCESS_KEY_REQUIRED') {
    // The backend is locked and this device has no key (or the wrong one)
    window.dispatchEvent(new Event('organworks-needkey'));
    const err = new Error('Access key needed');
    err.needKey = true;
    throw err;
  }
  if (data && data.error) throw new Error(data.error);
  return data;
};

// ------------------------------------------------------------
// The screens inside the Command Centre (day panel, invoice
// calculator, reports...) are written inside the main component.
// Without this helper React treats each one as a brand-new screen
// every time anything changes, throws the old one away and rebuilds
// it - which is why a text box lost the cursor after every letter.
// stable() keeps ONE screen per name and just hands it the latest code.
// ------------------------------------------------------------
const stableImpls = {};
const stableScreens = {};
const stable = (name, impl) => {
  stableImpls[name] = impl;
  if (!stableScreens[name]) {
    const Screen = (props) => stableImpls[name](props);
    Screen.displayName = name;
    stableScreens[name] = Screen;
  }
  return stableScreens[name];
};

const TICKET_ICONS = { tuning: '🎹', fault: '⚠️', quote: '💰', reminder: '🔔', 'part-return': '🔧', 'follow-up': '📞' };

// Generate temporary IDs for optimistic updates
const generateTempId = () => `temp_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;

const CommandCentre = () => {
  const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const DEFAULT_PRICES = { tuning_full: 250, tuning_half: 190, fault: 250, big: 250 };

  // State
  const [isConfigured, setIsConfigured] = useState(!!getApiUrl());
  const [configUrl, setConfigUrl] = useState('');
  const [needsKey, setNeedsKey] = useState(false);

  // Screen size: narrow = tablet (two tabs instead of side by side); compact = smaller calendar cells
  const [isNarrow, setIsNarrow] = useState(window.innerWidth < 1450);
  const [isCompact, setIsCompact] = useState(window.innerWidth < 1700);
  const [plannerTab, setPlannerTab] = useState('calendar');   // 'calendar' | 'todo' (narrow screens only)
  const [plannerView, setPlannerView] = useState('week');     // 'day' | 'week' | 'month' | 'year' - always opens on the week
  const [showPastMonths, setShowPastMonths] = useState(null); // null = automatic (hidden on a tablet, shown on a wide screen)

  // Block booking: first day + last day
  const [blockMode, setBlockMode] = useState(null);           // null | 'job' | 'project' | 'off'
  const [blockStart, setBlockStart] = useState(null);
  const [blockEnd, setBlockEnd] = useState(null);
  const [blockDays, setBlockDays] = useState('mw');           // 'mw' | 'mt' | 'mf'
  const [blockReason, setBlockReason] = useState('');
  const [showCompletedProjects, setShowCompletedProjects] = useState(false);

  // Undo: after a change a bar offers Undo for 10 seconds
  // Calm view: fewer colours, no movement. Remembered on this device.
  const [calm, setCalm] = useState(() => { try { return localStorage.getItem('organWorks_calm') === '1'; } catch (e) { return false; } });
  const toggleCalm = () => setCalm(prev => { const next = !prev; try { localStorage.setItem('organWorks_calm', next ? '1' : '0'); } catch (e) {} return next; });

  const [undoInfo, setUndoInfo] = useState(null);             // { message, revert }
  const undoTimerRef = useRef(null);
  const undoCommitRef = useRef(null);                         // a delete that waits until the bar has gone
  // In-page "are you sure" for the few things that cannot be undone
  const [confirmDialog, setConfirmDialog] = useState(null);   // { message, confirmLabel, onConfirm }
  const [loadError, setLoadError] = useState(null);
  const [needsExpanded, setNeedsExpanded] = useState({});      // which groups of the Needs you list are showing everything
  const [keyInput, setKeyInput] = useState('');
  const [keyTried, setKeyTried] = useState(false);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const [syncing, setSyncing] = useState(false);
  const [syncMessage, setSyncMessage] = useState('');
  
  // Background saving state for optimistic updates
  const [bgSaveCount, setBgSaveCount] = useState(0);
  const [saveError, setSaveError] = useState(null);
  const errorTimeoutRef = useRef(null);
  const successTimeoutRef = useRef(null);
  const [showSaved, setShowSaved] = useState(false);
  
  const [customers, setCustomers] = useState([]);
  const [contacts, setContacts] = useState([]);
  const [projects, setProjects] = useState([]);
  const [bookings, setBookings] = useState([]);
  const [daysOff, setDaysOff] = useState([]);
  const [tickets, setTickets] = useState([]);
  const [jobs, setJobs] = useState([]);
  const [timeEntries, setTimeEntries] = useState([]);
  const [materials, setMaterials] = useState([]);

  const [currentDate, setCurrentDate] = useState(new Date());
  const [selectedCustomerToBook, setSelectedCustomerToBook] = useState(null);
  const [selectedGroupToBook, setSelectedGroupToBook] = useState(null);
  const [selectedTicketToBook, setSelectedTicketToBook] = useState(null);
  const [selectedDay, setSelectedDay] = useState(null);
  const [zoomedMonth, setZoomedMonth] = useState(null);
  const [view, setView] = useState('planner');
  const [selectedCustomer, setSelectedCustomer] = useState(null);
  const [editingCustomer, setEditingCustomer] = useState(null);
  const [tuningGroupSearch, setTuningGroupSearch] = useState('');
  const [showGroupDropdown, setShowGroupDropdown] = useState(false);
  const [editingContact, setEditingContact] = useState(null);
  const [showAddContact, setShowAddContact] = useState(false);
  const [showAddCustomer, setShowAddCustomer] = useState(false);
  const [newCustomerName, setNewCustomerName] = useState('');
  const [newCustomerAddress, setNewCustomerAddress] = useState('');
  const [newCustomerRate, setNewCustomerRate] = useState('');
  const [newContactName, setNewContactName] = useState('');
  const [newContactRole, setNewContactRole] = useState('');
  const [newContactPhone, setNewContactPhone] = useState('');
  const [newContactEmail, setNewContactEmail] = useState('');
  const [newContactIsBooking, setNewContactIsBooking] = useState(false);
  const [bookingType, setBookingType] = useState('OTS');
  const [customQuote, setCustomQuote] = useState('');
  const [jobNotes, setJobNotes] = useState('');
  const [showAddTicket, setShowAddTicket] = useState(false);
  const [editingTicket, setEditingTicket] = useState(null);
  const [accessNotesDraft, setAccessNotesDraft] = useState(null); // null = not editing
  const [customerDraft, setCustomerDraft] = useState(null); // name, address, rate, distance being edited
  const [newTicketCustomer, setNewTicketCustomer] = useState('');
  const [newTicketDescription, setNewTicketDescription] = useState('');
  const [newTicketType, setNewTicketType] = useState('tuning');
  const [newTicketDueDate, setNewTicketDueDate] = useState('');
  const [customerSearch, setCustomerSearch] = useState('');
  
  const filteredCustomersForSearch = useMemo(() => {
    if (!customerSearch) return [];
    return customers.filter(c => c.name.toLowerCase().includes(customerSearch.toLowerCase())).slice(0, 5);
  }, [customers, customerSearch]);
  const [plannerSearch, setPlannerSearch] = useState('');
  const [customerListSearch, setCustomerListSearch] = useState('');
  const [showProjectSummary, setShowProjectSummary] = useState(null);
  const [showCapacityDetails, setShowCapacityDetails] = useState(false);
  
  const [showInvoiceCalc, setShowInvoiceCalc] = useState(null);
  const [selectedBand, setSelectedBand] = useState(null);
  const [selectedDistance, setSelectedDistance] = useState(null);
  const [customAmount, setCustomAmount] = useState('');
  const [pricing, setPricing] = useState({ timeBands: [], distanceBands: [] });
  const [invoiceMaterials, setInvoiceMaterials] = useState([]);
  const [newMaterialDesc, setNewMaterialDesc] = useState('');
  const [newMaterialCost, setNewMaterialCost] = useState('');
  const [materialsList, setMaterialsList] = useState([]);
  const [materialSearch, setMaterialSearch] = useState('');
  const [materialQty, setMaterialQty] = useState(1);
  const [newMaterialQty, setNewMaterialQty] = useState(1);
  const [selectedMaterial, setSelectedMaterial] = useState(null);

  const [allocatingProject, setAllocatingProject] = useState(null);
  const [showNewProject, setShowNewProject] = useState(false);
  const [newProjectName, setNewProjectName] = useState('');
  const [newProjectCustomer, setNewProjectCustomer] = useState(null);
  const [projectCustomerSearch, setProjectCustomerSearch] = useState('');
  
  const filteredCustomersForProject = useMemo(() => {
    if (!projectCustomerSearch) return [];
    return customers.filter(c => c.name.toLowerCase().includes(projectCustomerSearch.toLowerCase())).slice(0, 10);
  }, [customers, projectCustomerSearch]);
  const [newProjectEstDays, setNewProjectEstDays] = useState('');
  const [newProjectNotes, setNewProjectNotes] = useState('');
  const [newProjectYearStart, setNewProjectYearStart] = useState(new Date().getFullYear());
  const [newProjectYearEnd, setNewProjectYearEnd] = useState(new Date().getFullYear());
  const [editingProject, setEditingProject] = useState(null);

  const currentYear = currentDate.getFullYear();
  const plannerMonths = monthNames.map((name, idx) => ({ name, year: currentYear, month: idx, days: new Date(currentYear, idx + 1, 0).getDate() }));

  // ============================================================
  // OPTIMISTIC UPDATE HELPERS
  // ============================================================
  
  const bgBusyRef = useRef(0);           // saves in flight right now
  const pendingDeleteRef = useRef(new Set()); // ids removed on screen, not yet removed in the sheet
  const tempIdMapRef = useRef({});       // temporary id -> the real id the sheet gave it (null = the save failed)
  const pause = (ms) => new Promise(resolve => setTimeout(resolve, ms));
  // Undo waits for the save it is undoing, so the two cannot overtake each other
  const waitForSaves = async () => { for (let i = 0; i < 150 && bgBusyRef.current > 0; i++) await pause(200); };
  // An item that was only just added still has a temporary id: note its real one when it arrives
  const learnId = (tempId, realId) => {
    tempIdMapRef.current[tempId] = realId || null;
    if (realId && pendingDeleteRef.current.has(tempId)) pendingDeleteRef.current.add(realId);
  };
  const realIdFor = async (id) => {
    if (!String(id).startsWith('temp_')) return id;
    for (let i = 0; i < 150; i++) {
      if (id in tempIdMapRef.current) return tempIdMapRef.current[id];
      await pause(200);
    }
    return null;
  };
  // Lists fresh from the sheet must not bring back something that is waiting to be deleted
  const dropPending = (list) => (list || []).filter(item => !pendingDeleteRef.current.has(item.id));

  const startBgSave = () => {
    bgBusyRef.current += 1;
    setBgSaveCount(c => c + 1);
    setSaveError(null);
  };
  
  const endBgSave = (success, error = null) => {
    bgBusyRef.current = Math.max(0, bgBusyRef.current - 1);
    setBgSaveCount(c => Math.max(0, c - 1));
    if (success) {
      setLastSaved(new Date());
      setShowSaved(true);
      if (successTimeoutRef.current) clearTimeout(successTimeoutRef.current);
      successTimeoutRef.current = setTimeout(() => setShowSaved(false), 1500);
    } else {
      setSaveError(error || 'Save failed');
      if (errorTimeoutRef.current) clearTimeout(errorTimeoutRef.current);
      errorTimeoutRef.current = setTimeout(() => setSaveError(null), 5000);
    }
  };

  // Saving indicator component
  const SavingIndicator = stable('SavingIndicator', () => {
    if (saveError) {
      return <div className="saving-indicator error"><span>⚠️</span><span>{saveError}</span></div>;
    }
    if (bgSaveCount > 0) {
      return <div className="saving-indicator"><div className="mini-spinner"></div><span>Saving...</span></div>;
    }
    if (showSaved) {
      return <div className="saving-indicator success"><span>✓</span><span>Saved</span></div>;
    }
    return null;
  });

  // Data loading
  const loadData = useCallback(async () => {
    if (!getApiUrl()) return;
    setLoading(true);
    setLoadError(null);
    try {
      const data = await apiCall('getAllData');
      const parsedCustomers = (data.customers || []).map(c => ({
        ...c,
        tuningMonths: typeof c.tuningMonths === 'string' ? (c.tuningMonths ? JSON.parse(c.tuningMonths) : []) : (c.tuningMonths || []),
        customRate: c.customRate ? parseFloat(c.customRate) : null
      }));
      setCustomers(parsedCustomers);
      const parsedContacts = (data.contacts || []).map(c => ({
        ...c,
        isBookingContact: c.isBookingContact === 'true' || c.isBookingContact === true
      }));
      setContacts(dropPending(parsedContacts));
      setProjects(data.projects || []);
      const normalizedBookings = (data.bookings || []).map(b => ({ ...b, date: b.date ? b.date.split('T')[0] : b.date }));
      // Older versions could save a new big job's first days against a temporary id,
      // so they were never counted on the job. Link them back by customer + job name.
      const repairs = [];
      const healedBookings = normalizedBookings.map(b => {
        if (b.type !== 'project' || !String(b.projectId || '').startsWith('temp_')) return b;
        const matches = (data.projects || []).filter(p => p.customerId === b.customerId && p.name === b.projectName);
        if (matches.length !== 1) return b;
        repairs.push({ id: b.id, projectId: matches[0].id });
        return { ...b, projectId: matches[0].id };
      });
      setBookings(dropPending(healedBookings));
      if (repairs.length > 0) {
        (async () => { for (const r of repairs) { try { await apiCall('updateBooking', { data: r }); } catch (e) { break; } } })();
      }
      setDaysOff(data.daysOff || []);
      setTickets(dropPending(data.tickets));
      setPricing(data.pricing || { timeBands: [], distanceBands: [] });
      setMaterialsList(data.materialsList || []);
      setJobs(data.jobs || []);
      setTimeEntries(data.timeEntries || []);
      setMaterials(data.materials || []);
    } catch (err) {
      console.error('Failed to load data:', err);
      if (!err.needKey) setLoadError(err.message);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { if (isConfigured) loadData(); }, [isConfigured, loadData]);

  // Follow the screen size (rotating the tablet, resizing the window)
  useEffect(() => {
    const onResize = () => { setIsNarrow(window.innerWidth < 1450); setIsCompact(window.innerWidth < 1700); };
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    return () => { window.removeEventListener('resize', onResize); window.removeEventListener('orientationchange', onResize); };
  }, []);

  // On a tablet: as soon as there is something to place, show the calendar
  useEffect(() => {
    if (blockMode) setPlannerView(v => v === 'day' ? 'week' : v);
    if (selectedCustomerToBook || allocatingProject || blockMode) {
      setPlannerTab('calendar');
      if (window.innerWidth < 1450) {
        setTimeout(() => { const row = document.getElementById('this-month-row'); if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 200);
      }
    }
  }, [selectedCustomerToBook, allocatingProject, blockMode]);

  // A block belongs to whatever started it: leaving that ends the block
  useEffect(() => {
    if ((blockMode === 'job' && !selectedCustomerToBook) || (blockMode === 'project' && !allocatingProject)) {
      setBlockMode(null); setBlockStart(null); setBlockEnd(null);
    }
  }, [blockMode, selectedCustomerToBook, allocatingProject]);

  // If the page is closed while the Undo bar is showing, carry out what was waiting
  useEffect(() => {
    const onHide = () => {
      const commit = undoCommitRef.current;
      if (!commit) return; // nothing waiting to be deleted
      undoCommitRef.current = null;
      if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
      undoTimerRef.current = null;
      setUndoInfo(null);
      commit();
    };
    const onVisibility = () => { if (document.visibilityState === 'hidden') onHide(); };
    window.addEventListener('pagehide', onHide);
    document.addEventListener('visibilitychange', onVisibility);
    return () => { window.removeEventListener('pagehide', onHide); document.removeEventListener('visibilitychange', onVisibility); };
  }, []);

  // The backend asks for the access key
  useEffect(() => {
    const onNeedKey = () => setNeedsKey(true);
    window.addEventListener('organworks-needkey', onNeedKey);
    return () => window.removeEventListener('organworks-needkey', onNeedKey);
  }, []);

  // Download everything in the database as one file
  const [backupBusy, setBackupBusy] = useState(false);
  const downloadBackup = async () => {
    setBackupBusy(true);
    try {
      const data = await apiCall('getAllData');
      const now = new Date();
      const stamp = getDateString(now.getFullYear(), now.getMonth(), now.getDate());
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `organ-works-backup-${stamp}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 10000);
    } catch (err) {
      if (!err.needKey) { setSaveError('Backup failed: ' + err.message); setTimeout(() => setSaveError(null), 5000); }
    } finally {
      setBackupBusy(false);
    }
  };

  const syncContactsToGoogle = async () => {
    setSyncing(true);
    setSyncMessage('');
    try {
      const result = await apiCall('syncContactsToGoogle');
      if (result.success) {
        setSyncMessage(result.message || 'Contacts synced to Google!');
      } else {
        setSyncMessage('Error: ' + (result.error || 'Sync failed'));
      }
    } catch (err) {
      setSyncMessage('Error: ' + err.message);
    } finally {
      setSyncing(false);
      setTimeout(() => setSyncMessage(''), 5000);
    }
  };

  // Helper functions
  const getDateString = (year, month, day) => `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  const parseLocalDate = (dateStr) => {
    if (!dateStr) return new Date();
    const [year, month, day] = dateStr.split('-').map(Number);
    return new Date(year, month - 1, day);
  };
  const getDayOfWeek = (year, month, day) => new Date(year, month, day).getDay();
  const isWorkDay = (year, month, day) => { const dow = getDayOfWeek(year, month, day); return dow >= 1 && dow <= 5; };
  const getBookingsForDay = (date) => bookings.filter(b => b.date === date);
  const getCustomerById = (id) => customers.find(c => c.id === id);
  const getBookingContact = (customerId) => contacts.find(c => c.customerId === customerId && c.isBookingContact) || contacts.find(c => c.customerId === customerId);
  const isDayOff = (date) => daysOff.some(d => d.date === date || d === date);
  const getDayOffReason = (date) => { const dayOff = daysOff.find(d => d.date === date); return dayOff?.reason || ''; };
  const formatDate = (dateStr) => { 
    if (!dateStr) return ''; 
    const [year, month, day] = dateStr.split('-').map(Number);
    const d = new Date(year, month - 1, day); 
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); 
  };
  const formatCurrency = (amount) => '£' + (parseFloat(amount) || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const getJobTypeLabel = (type) => {
    if (type === 'OTS') return 'With helper';
    if (type === 'TSC') return 'Solo';
    if (type === 'WS') return 'Workshop';
    if (type === 'project') return 'Big job';
    if (type === 'tuning_full') return 'Tuning (full day)';
    if (type === 'tuning_half') return 'Tuning (half day)';
    if (type === 'fault') return 'Fault visit';
    if (type === 'big') return 'Big job';
    return type || 'Visit';
  };

  const getJobTypeColor = (type) => {
    if (type === 'OTS') return 'blue';
    if (type === 'TSC') return 'blue';
    if (type === 'WS') return 'purple';
    if (type === 'project') return 'pink';
    if (type?.startsWith('tuning')) return 'blue';
    if (type === 'fault') return 'orange';
    if (type === 'big') return 'red';
    return 'gray';
  };

  const isCustomerBookedInMonth = (customerId, monthIndex, year) => {
    const monthStart = getDateString(year, monthIndex, 1);
    const monthEnd = getDateString(year, monthIndex, new Date(year, monthIndex + 1, 0).getDate());
    return bookings.some(b => 
      b.customerId === customerId && 
      b.date >= monthStart && 
      b.date <= monthEnd &&
      (b.type === 'OTS' || b.type === 'TSC' || b.type === 'WS' || b.type === 'tuning_full' || b.type === 'tuning_half')
    );
  };

  const getCustomerHistory = (customerId) => bookings.filter(b => b.customerId === customerId).sort((a, b) => parseLocalDate(b.date) - parseLocalDate(a.date));
  const getLastTuningPrice = (customerId) => { const history = getCustomerHistory(customerId); const lastTuning = history.find(b => b.type?.startsWith('tuning') && b.status === 'paid'); return lastTuning ? parseFloat(lastTuning.price) : null; };

  // ============================================================
  // CAPACITY PLANNING
  // The plan is Mon-Wed. Thursday is the 4th day (only if needed).
  // Friday is admin and is never counted. Everything is counted
  // from today forward, so days already gone are not "free".
  // ============================================================

  const PLAN_DAYS = [1, 2, 3];   // Mon, Tue, Wed
  const DAY_SHORT = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
  const STRETCH_DAY = 4;         // Thu
  const ADMIN_DAY = 5;           // Fri
  const TUNINGS_PER_DAY = 2;

  const isTuningType = (type) => type === 'OTS' || type === 'TSC' || type === 'WS' || (type || '').startsWith('tuning');

  const capacityData = useMemo(() => {
    const now = new Date();
    const today = getDateString(now.getFullYear(), now.getMonth(), now.getDate());
    const thisYear = now.getFullYear();
    const thisMonth = now.getMonth();

    const daysOffDates = new Set(daysOff.map(d => (typeof d === 'string' ? d : d && d.date)).filter(Boolean));
    const yearBookings = bookings.filter(b => b.date && parseInt(b.date.split('-')[0]) === currentYear);
    const bookingsByDate = {};
    yearBookings.forEach(b => { (bookingsByDate[b.date] = bookingsByDate[b.date] || []).push(b); });

    // Days still to come in the year being viewed
    const planDates = [];      // Mon-Wed, not a day off
    const stretchDates = [];   // Thursdays, not a day off
    let planDaysOff = 0;
    for (let month = 0; month < 12; month++) {
      const daysInMonth = new Date(currentYear, month + 1, 0).getDate();
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = getDateString(currentYear, month, day);
        if (dateStr < today) continue;
        const dow = new Date(currentYear, month, day).getDay();
        const isPlan = PLAN_DAYS.includes(dow);
        if (!isPlan && dow !== STRETCH_DAY) continue;
        if (daysOffDates.has(dateStr)) { if (isPlan) planDaysOff++; continue; }
        (isPlan ? planDates : stretchDates).push(dateStr);
      }
    }

    // Which of those days already have something booked
    let tuningDaysBooked = 0, faultDaysBooked = 0, projectDaysBooked = 0, otherDaysBooked = 0;
    const freePlanDates = [];
    planDates.forEach(d => {
      const list = bookingsByDate[d];
      if (!list) { freePlanDates.push(d); return; }
      if (list.some(b => isTuningType(b.type))) tuningDaysBooked++;
      else if (list.some(b => b.type === 'fault')) faultDaysBooked++;
      else if (list.some(b => b.type === 'project')) projectDaysBooked++;
      else otherDaysBooked++;
    });
    const freeStretchDates = stretchDates.filter(d => !bookingsByDate[d]);

    // Tunings still to book: due this month or later and not yet in the diary
    let tuningsToBook = 0, tuningsOverdue = 0;
    customers.forEach(c => {
      (c.tuningMonths || []).forEach(m => {
        const monthIdx = Number(m);
        if (isCustomerBookedInMonth(c.id, monthIdx, currentYear)) return;
        if (currentYear > thisYear || (currentYear === thisYear && monthIdx >= thisMonth)) tuningsToBook++;
        else if (currentYear === thisYear) tuningsOverdue++;
      });
    });
    const daysNeededForTunings = Math.ceil(tuningsToBook / TUNINGS_PER_DAY);

    // Big job days still to place this year
    let plannedProjectDays = 0;
    if (currentYear >= thisYear) {
      projects.filter(p => p.status === 'active').forEach(p => {
        const yearStart = parseInt(p.yearStart) || parseInt(p.targetYear) || currentYear;
        const yearEnd = parseInt(p.yearEnd) || parseInt(p.targetYear) || currentYear;
        if (currentYear >= yearStart && currentYear <= yearEnd) {
          const estimatedDays = parseInt(p.estimatedDays) || 0;
          const yearsSpanned = yearEnd - yearStart + 1;
          const daysThisYear = Math.ceil(estimatedDays / yearsSpanned);
          const bookedForProjectThisYear = yearBookings.filter(b => b.projectId === p.id).length;
          plannedProjectDays += Math.max(0, daysThisYear - bookedForProjectThisYear);
        }
      });
    }

    const planDaysLeft = planDates.length;
    const freePlanCount = freePlanDates.length;
    const bookedPlanCount = planDaysLeft - freePlanCount;
    const daysToPlace = daysNeededForTunings + plannedProjectDays;
    const freeAtThree = freePlanCount - daysToPlace;            // negative = short
    const daysFreeForProjects = Math.max(0, freeAtThree);
    const isOvercommitted = freeAtThree < 0;
    const overcommittedBy = isOvercommitted ? -freeAtThree : 0;
    const stretchFree = freeStretchDates.length;

    // Calendar colouring: work still to place fills the next free Mon-Wed days
    const reservedDays = new Set(freePlanDates.slice(0, daysNeededForTunings));
    const plannedDays = new Set(freePlanDates.slice(daysNeededForTunings, daysNeededForTunings + plannedProjectDays));

    return {
      today,
      planDaysLeft,
      planDaysOff,
      freePlanCount,
      bookedPlanCount,
      tuningDaysBooked,
      faultDaysBooked,
      projectDaysBooked,
      otherDaysBooked,
      tuningsToBook,
      tuningsOverdue,
      daysNeededForTunings,
      plannedProjectDays,
      freeAtThree,
      daysFreeForProjects,
      isOvercommitted,
      overcommittedBy,
      stretchFree,
      reservedDays,
      plannedDays,
    };
  }, [customers, bookings, daysOff, projects, currentYear]);

  // ============================================================
  // CAPACITY BAR COMPONENT
  // ============================================================
  
  const CapacityBar = stable('CapacityBar', () => {
    const c = capacityData;
    const barTotal = Math.max(1, c.planDaysLeft);
    const pct = (n) => `${(n / barTotal) * 100}%`;
    const reservedShown = Math.min(c.daysNeededForTunings, c.freePlanCount);
    const plannedShown = Math.min(c.plannedProjectDays, c.freePlanCount - reservedShown);
    const freeShown = Math.max(0, c.freePlanCount - reservedShown - plannedShown);
    const freeColour = c.isOvercommitted ? 'text-red-600' : c.daysFreeForProjects > 10 ? 'text-green-600' : 'text-amber-600';
    const stretchCovers = c.isOvercommitted && c.stretchFree >= c.overcommittedBy;
    
    return (
      <div className="bg-white rounded-lg shadow p-4 mb-3">
        <div className="flex justify-between items-center mb-2">
          <h3 className="font-bold text-lg">📊 Time left {currentYear}</h3>
          <button onClick={() => setShowCapacityDetails(!showCapacityDetails)} className="text-sm text-blue-600 hover:underline px-3 py-2">
            {showCapacityDetails ? 'Hide details' : 'Show details'}
          </button>
        </div>
        
        <div className="flex flex-wrap items-baseline gap-x-8 gap-y-1 mb-3">
          <div><span className="text-4xl font-bold">{c.planDaysLeft}</span> <span className="text-lg text-gray-600">working days left (Mon–Wed)</span></div>
          <div><span className={`text-4xl font-bold ${freeColour}`}>{c.isOvercommitted ? c.overcommittedBy : c.daysFreeForProjects}</span> <span className="text-lg text-gray-600">{c.isOvercommitted ? 'days short' : 'still free'}</span></div>
          <div><span className="text-2xl font-bold text-gray-700">+{c.stretchFree}</span> <span className="text-lg text-gray-600">Thursdays if needed</span></div>
        </div>
        
        <div className="capacity-bar bg-gray-200 mb-2">
          {c.tuningDaysBooked > 0 && <div className="capacity-segment bg-blue-500" style={{ width: pct(c.tuningDaysBooked) }}></div>}
          {c.faultDaysBooked > 0 && <div className="capacity-segment bg-orange-400" style={{ width: pct(c.faultDaysBooked) }}></div>}
          {c.projectDaysBooked > 0 && <div className="capacity-segment bg-pink-400" style={{ width: pct(c.projectDaysBooked) }}></div>}
          {c.otherDaysBooked > 0 && <div className="capacity-segment bg-gray-400" style={{ width: pct(c.otherDaysBooked) }}></div>}
          {reservedShown > 0 && <div className="capacity-segment bg-amber-200 border-y border-amber-300" style={{ width: pct(reservedShown) }}></div>}
          {plannedShown > 0 && <div className="capacity-segment bg-pink-200 border-y border-pink-300" style={{ width: pct(plannedShown) }}></div>}
          {freeShown > 0 && <div className="capacity-segment bg-green-200 border-y border-green-300" style={{ width: pct(freeShown) }}></div>}
        </div>
        
        <div className="flex flex-wrap gap-4 text-sm">
          {c.tuningDaysBooked > 0 && <div className="flex items-center gap-2"><div className="w-4 h-4 bg-blue-500 rounded"></div><span>Tunings booked: <strong>{c.tuningDaysBooked}</strong></span></div>}
          {c.faultDaysBooked > 0 && <div className="flex items-center gap-2"><div className="w-4 h-4 bg-orange-400 rounded"></div><span>Faults booked: <strong>{c.faultDaysBooked}</strong></span></div>}
          {c.projectDaysBooked > 0 && <div className="flex items-center gap-2"><div className="w-4 h-4 bg-pink-400 rounded"></div><span>Big jobs booked: <strong>{c.projectDaysBooked}</strong></span></div>}
          {c.otherDaysBooked > 0 && <div className="flex items-center gap-2"><div className="w-4 h-4 bg-gray-400 rounded"></div><span>Other booked: <strong>{c.otherDaysBooked}</strong></span></div>}
          <div className="flex items-center gap-2"><div className="w-4 h-4 bg-amber-200 border border-amber-300 rounded"></div><span>Tunings to book: <strong>{c.daysNeededForTunings}</strong></span></div>
          {c.plannedProjectDays > 0 && <div className="flex items-center gap-2"><div className="w-4 h-4 bg-pink-200 border border-pink-300 rounded"></div><span>Big job days to book: <strong>{c.plannedProjectDays}</strong></span></div>}
          <div className="flex items-center gap-2"><div className="w-4 h-4 bg-green-200 border border-green-300 rounded"></div><span>Free: <strong className={freeColour}>{c.daysFreeForProjects}</strong></span></div>
          {c.isOvercommitted && <div className="flex items-center gap-2 text-red-600 font-bold">⚠️ {c.overcommittedBy} days short at 3 a week — {stretchCovers ? 'Thursdays would cover it' : `Thursdays only cover ${c.stretchFree}`}</div>}
        </div>
        
        {showCapacityDetails && (
          <div className="mt-4 pt-4 border-t grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
            <div className="bg-gray-50 p-3 rounded"><div className="text-gray-500">Working days left</div><div className="text-2xl font-bold">{c.planDaysLeft}</div><div className="text-xs text-gray-400">Mon–Wed, from today</div></div>
            <div className="bg-gray-50 p-3 rounded"><div className="text-gray-500">Days off</div><div className="text-2xl font-bold">{c.planDaysOff}</div><div className="text-xs text-gray-400">on Mon–Wed, still to come</div></div>
            <div className="bg-gray-50 p-3 rounded"><div className="text-gray-500">Already booked</div><div className="text-2xl font-bold">{c.bookedPlanCount}</div><div className="text-xs text-gray-400">{c.tuningDaysBooked}T + {c.faultDaysBooked}F + {c.projectDaysBooked}P{c.otherDaysBooked > 0 ? ` + ${c.otherDaysBooked} other` : ''}</div></div>
            <div className="bg-gray-50 p-3 rounded"><div className="text-gray-500">Not yet booked</div><div className="text-2xl font-bold">{c.freePlanCount}</div><div className="text-xs text-gray-400">Mon–Wed days with nothing on</div></div>
            <div className="bg-amber-50 p-3 rounded"><div className="text-amber-600">Tunings to book</div><div className="text-2xl font-bold text-amber-700">{c.tuningsToBook}</div><div className="text-xs text-amber-500">= {c.daysNeededForTunings} days @ {TUNINGS_PER_DAY}/day{c.tuningsOverdue > 0 ? ` · ${c.tuningsOverdue} from earlier months not counted` : ''}</div></div>
            <div className="bg-pink-50 p-3 rounded"><div className="text-pink-600">Big job days to book</div><div className="text-2xl font-bold text-pink-700">{c.plannedProjectDays}</div><div className="text-xs text-pink-500">estimate − days in the diary</div></div>
            <div className={`p-3 rounded ${c.isOvercommitted ? 'bg-red-50' : 'bg-green-50'}`}><div className={c.isOvercommitted ? 'text-red-600' : 'text-green-600'}>{c.isOvercommitted ? 'Short at 3 days a week' : 'Free at 3 days a week'}</div><div className={`text-2xl font-bold ${c.isOvercommitted ? 'text-red-700' : 'text-green-700'}`}>{c.isOvercommitted ? c.overcommittedBy : c.daysFreeForProjects}</div><div className="text-xs text-gray-500">{c.freePlanCount} not booked − {c.daysNeededForTunings} tunings − {c.plannedProjectDays} big job</div></div>
            <div className="bg-gray-50 p-3 rounded"><div className="text-gray-500">Thursdays free</div><div className="text-2xl font-bold">{c.stretchFree}</div><div className="text-xs text-gray-400">4th day, only if needed</div></div>
          </div>
        )}
      </div>
    );
  });

  const getJobsDue = () => {
    const now = new Date();
    const thisMonth = now.getMonth();
    const thisYear = now.getFullYear();
    const nextMonth = (thisMonth + 1) % 12;
    const nextYear = thisMonth === 11 ? thisYear + 1 : thisYear;
    const due = [];
    customers.forEach(customer => {
      if (!customer.tuningMonths || customer.tuningMonths.length === 0) return;
      if (customer.tuningMonths.includes(thisMonth) && !isCustomerBookedInMonth(customer.id, thisMonth, thisYear)) {
        due.push({ customer, month: thisMonth, year: thisYear, monthName: monthNames[thisMonth], urgent: true });
      }
      if (customer.tuningMonths.includes(nextMonth) && !isCustomerBookedInMonth(customer.id, nextMonth, nextYear)) {
        due.push({ customer, month: nextMonth, year: nextYear, monthName: monthNames[nextMonth], urgent: false });
      }
    });
    return due;
  };
  const jobsDue = getJobsDue();

  const getActiveProjects = () => {
    return projects.filter(p => p.status === 'active').map(p => {
      const allocatedDays = bookings.filter(b => b.type === 'project' && b.projectId === p.id).map(b => b.date);
      const projectJobs = jobs.filter(j => j.projectId === p.id);
      const jobIds = projectJobs.map(j => j.id);
      const projectTimeEntries = timeEntries.filter(te => jobIds.includes(te.jobId));
      const totalHours = projectTimeEntries.reduce((sum, te) => sum + (parseFloat(te.duration) || 0), 0);
      const projectMaterials = materials.filter(m => jobIds.includes(m.jobId));
      const materialsCost = projectMaterials.reduce((sum, m) => sum + (parseFloat(m.cost) || 0), 0);
      return { ...p, customerName: customers.find(c => c.id === p.customerId)?.name || 'Unknown', days: allocatedDays, jobs: projectJobs, totalHours, materialsCost, timeEntries: projectTimeEntries, materials: projectMaterials };
    });
  };
  const activeProjects = getActiveProjects();
  const completedProjects = projects.filter(p => p.status === 'completed');

  // ============================================================
  // UNDO
  // ============================================================

  // The bar has gone without Undo being pressed: carry out anything that was waiting
  const settleUndo = () => {
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
    undoTimerRef.current = null;
    const commit = undoCommitRef.current;
    undoCommitRef.current = null;
    setUndoInfo(null);
    if (commit) commit();
  };

  // message: what just happened. revert: how to put it back.
  // commit (optional): for deletes - only sent to the sheet once the bar has gone.
  const offerUndo = (message, revert, commit = null) => {
    settleUndo();
    undoCommitRef.current = commit;
    setUndoInfo({ message, revert });
    undoTimerRef.current = setTimeout(settleUndo, 10000);
  };

  const doUndo = () => {
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
    undoTimerRef.current = null;
    undoCommitRef.current = null;
    const info = undoInfo;
    setUndoInfo(null);
    if (info && info.revert) info.revert();
  };

  const askConfirm = (message, confirmLabel, onConfirm) => setConfirmDialog({ message, confirmLabel, onConfirm });

  const STATUS_WORDS = { scheduled: 'Provisional', confirmed: 'Confirmed', in_progress: 'On site', completed: 'Done', invoiced: 'Invoiced', paid: 'Paid' };
  const nameFor = (customerId) => (customers.find(c => c.id === customerId) || {}).name || 'Unknown';
  const dayWords = (dateStr) => parseLocalDate(dateStr).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

  // Delete bookings quietly (used by Undo)
  const deleteBookingsQuietly = async (ids, refreshTickets = false) => {
    if (ids.length === 0) return;
    startBgSave();
    try {
      for (const id of ids) await apiCall('deleteBooking', { bookingId: id });
      if (refreshTickets) { const ticketData = await apiCall('getTickets'); setTickets(dropPending(ticketData)); }
      endBgSave(true);
    } catch (err) {
      endBgSave(false, err.message);
      loadData();
    }
  };

  // ============================================================
  // OPTIMISTIC BOOKING FUNCTIONS
  // ============================================================
  
  const addBooking = async (date, customerId, type, price, notes, ticket = null, serviceType = null) => {
    const svcType = serviceType || type;
    const tempId = generateTempId();
    const newBooking = { id: tempId, date, customerId, type, serviceType: svcType, price: price || 0, status: 'scheduled', notes: notes || '' };
    
    // OPTIMISTIC: Update UI immediately
    setBookings(prev => [...prev, newBooking]);
    if (ticket) {
      setTickets(prev => prev.filter(t => t.id !== ticket.id));
      setSelectedTicketToBook(null);
    }
    setSelectedCustomerToBook(null);
    setCustomQuote('');
    setJobNotes('');
    
    // Background save
    let savedId = null;
    let undone = false;
    const saving = (async () => {
      startBgSave();
      try {
        const result = await apiCall('addBooking', { data: { date, customerId, type, serviceType: svcType, price: price || 0, status: 'scheduled', notes: notes || '' } });
        savedId = result.id;
        learnId(tempId, result.id);
        setBookings(prev => prev.map(b => b.id === tempId ? { ...b, id: result.id } : b));
        if (ticket) {
          await apiCall('updateTicket', { data: { id: ticket.id, status: 'scheduled', bookingId: result.id } });
        }
        endBgSave(true);
      } catch (err) {
        learnId(tempId, null);
        setBookings(prev => prev.filter(b => b.id !== tempId));
        if (ticket && !undone) {
          setTickets(prev => prev.some(t => t.id === ticket.id) ? prev : [...prev, ticket]);
        }
        endBgSave(false, err.message);
      }
    })();

    offerUndo(`Booked ${nameFor(customerId)} on ${dayWords(date)}`, async () => {
      undone = true;
      setBookings(prev => prev.filter(b => b.id !== tempId && b.id !== savedId));
      if (ticket) setTickets(prev => prev.some(t => t.id === ticket.id) ? prev : [...prev, ticket]);
      await saving;
      if (savedId) {
        setBookings(prev => prev.filter(b => b.id !== savedId));
        await deleteBookingsQuietly([savedId], !!ticket);
      }
    });

    await saving;
  };

  const removeBooking = async (date, bookingId) => {
    const bookingToRemove = bookings.find(b => b.id === bookingId);
    if (!bookingToRemove) return;
    
    // OPTIMISTIC: it disappears now, but the sheet is only told once the Undo bar has gone
    pendingDeleteRef.current.add(bookingId);
    setBookings(prev => prev.filter(b => b.id !== bookingId));
    
    const title = bookingToRemove.type === 'project' ? (bookingToRemove.projectName || 'Big job') : nameFor(bookingToRemove.customerId);
    offerUndo(`Removed ${title} from ${dayWords(bookingToRemove.date)}`,
      () => {
        const nowId = tempIdMapRef.current[bookingId] || bookingId; // it may have been given its real id meanwhile
        pendingDeleteRef.current.delete(bookingId); pendingDeleteRef.current.delete(nowId);
        setBookings(prev => prev.some(b => b.id === nowId || b.id === bookingId) ? prev : [...prev, { ...bookingToRemove, id: nowId }]);
      },
      async () => {
        const realId = await realIdFor(bookingId); // waits if it was only just booked
        if (!realId) return; // it never reached the sheet
        startBgSave();
        try {
          await apiCall('deleteBooking', { bookingId: realId });
          const ticketData = await apiCall('getTickets');
          setTickets(dropPending(ticketData));
          endBgSave(true);
        } catch (err) {
          pendingDeleteRef.current.delete(bookingId); pendingDeleteRef.current.delete(realId);
          setBookings(prev => prev.some(b => b.id === realId) ? prev : [...prev, { ...bookingToRemove, id: realId }]);
          endBgSave(false, err.message);
        }
      });
  };

  const updateBookingStatus = async (bookingId, status) => {
    const originalBooking = bookings.find(b => b.id === bookingId);
    const updates = { status };
    if (status === 'invoiced') updates.invoiceDate = todayStrNow();
    if (status === 'paid') updates.paidDate = todayStrNow();
    
    // OPTIMISTIC
    setBookings(prev => prev.map(b => b.id === bookingId ? { ...b, ...updates } : b));
    
    if (originalBooking) {
      offerUndo(`${nameFor(originalBooking.customerId)}, ${dayWords(originalBooking.date)}: ${STATUS_WORDS[status] || status}`, async () => {
        setBookings(prev => prev.map(b => b.id === bookingId ? originalBooking : b));
        await waitForSaves();
        startBgSave();
        try {
          await apiCall('updateBooking', { data: { id: bookingId, status: originalBooking.status, invoiceDate: originalBooking.invoiceDate || '', paidDate: originalBooking.paidDate || '' } });
          endBgSave(true);
        } catch (err) {
          endBgSave(false, err.message);
        }
      });
    }
    
    startBgSave();
    try {
      await apiCall('updateBooking', { data: { id: bookingId, ...updates } });
      endBgSave(true);
    } catch (err) {
      if (originalBooking) {

  // ============================================================
  // BLOCK BOOKING (first day + last day)
  // Used for days off, smaller jobs and big jobs.
  // ============================================================

  const BLOCK_DAY_SETS = { mw: [1, 2, 3], mt: [1, 2, 3, 4], mf: [1, 2, 3, 4, 5] };
  const BLOCK_DAY_LABELS = { mw: 'Mon–Wed', mt: 'Mon–Thu', mf: 'Mon–Fri' };
  const BLOCK_MAX_DAYS = 150;

  const startBlock = (mode) => {
    setBlockMode(mode);
    setBlockStart(null);
    setBlockEnd(null);
    setBlockDays(mode === 'off' ? 'mf' : 'mw');
    setBlockReason('');
    setSelectedDay(null);
  };

  const clearBlock = () => { setBlockMode(null); setBlockStart(null); setBlockEnd(null); setBlockReason(''); };

  const formatDayLong = (dateStr) => parseLocalDate(dateStr).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

  // Work out exactly which days the block would cover
  const getBlockPlan = () => {
    if (!blockMode || !blockStart || !blockEnd) return null;
    const allowed = BLOCK_DAY_SETS[blockDays];
    const dates = [], alreadyBooked = [], daysOffSkipped = [];
    const d = parseLocalDate(blockStart);
    const end = parseLocalDate(blockEnd);
    let guard = 0;
    while (d <= end && guard < 800) {
      guard++;
      const ds = getDateString(d.getFullYear(), d.getMonth(), d.getDate());
      if (allowed.includes(d.getDay())) {
        if (isDayOff(ds)) { if (blockMode !== 'off') daysOffSkipped.push(ds); }
        else if (getBookingsForDay(ds).length > 0) alreadyBooked.push(ds);
        else dates.push(ds);
      }
      d.setDate(d.getDate() + 1);
    }
    return { dates, alreadyBooked, daysOffSkipped, tooMany: dates.length > BLOCK_MAX_DAYS };
  };
  const blockPlan = getBlockPlan();
  const blockDateSet = new Set(blockPlan ? blockPlan.dates : (blockMode && blockStart ? [blockStart] : []));

  const confirmBlock = async () => {
    const plan = getBlockPlan();
    if (!plan || plan.dates.length === 0 || plan.tooMany) return;
    const dates = plan.dates;

    // ---- days off ----
    if (blockMode === 'off') {
      const reason = blockReason.trim();
      setDaysOff(prev => [...prev, ...dates.map(date => ({ date, reason }))]);
      clearBlock();
      startBgSave();
      try {
        try {
          await apiCall('addDaysOffBatch', { data: { dates, reason } });
        } catch (err) {
          if (!/Unknown action/.test(err.message)) throw err;
          for (const date of dates) await apiCall('addDayOff', { data: { date, reason } }); // older backend: one at a time
        }
        endBgSave(true);
        offerUndo(`Marked ${dates.length} day${dates.length === 1 ? '' : 's'} off`, async () => {
          setDaysOff(prev => prev.filter(d => !dates.includes(d.date)));
          startBgSave();
          try {
            for (const date of dates) await apiCall('removeDayOff', { date });
            endBgSave(true);
          } catch (err) {
            endBgSave(false, err.message);
            loadData();
          }
        });
      } catch (err) {
        endBgSave(false, err.message);
        loadData(); // show exactly what was saved
      }
      return;
    }

    // ---- jobs and big jobs ----
    const isProjectBlock = blockMode === 'project';
    const base = isProjectBlock
      ? { customerId: allocatingProject.customerId, type: 'project', serviceType: 'project', projectId: allocatingProject.id, projectName: allocatingProject.name, price: 0, status: 'scheduled' }
      : { customerId: selectedCustomerToBook.id, type: bookingType, serviceType: bookingType, price: 0, status: 'scheduled' };
    const baseNote = isProjectBlock
      ? (allocatingProject.estimatedDays ? `Est: ${allocatingProject.estimatedDays} days` : allocatingProject.name)
      : (jobNotes || '');
    const numberDays = !isProjectBlock && dates.length > 1;
    const noteFor = (i) => [baseNote, numberDays ? `(day ${i + 1} of ${dates.length})` : ''].filter(Boolean).join(' ');
    const temp = dates.map((date, i) => ({ ...base, id: generateTempId(), date, notes: noteFor(i) }));

    // OPTIMISTIC
    setBookings(prev => [...prev, ...temp]);
    clearBlock();
    if (!isProjectBlock) { setSelectedCustomerToBook(null); setCustomQuote(''); setJobNotes(''); }

    startBgSave();
    try {
      let ids;
      try {
        const result = await apiCall('addBookingsBatch', { data: { ...base, notes: baseNote, numberDays, dates } });
        ids = result.ids || [];
      } catch (err) {
        if (!/Unknown action/.test(err.message)) throw err;
        ids = []; // older backend: one at a time
        for (const t of temp) {
          const r = await apiCall('addBooking', { data: { ...base, date: t.date, notes: t.notes } });
          ids.push(r.id);
        }
      }
      temp.forEach((t, idx) => learnId(t.id, ids[idx] || null));
      setBookings(prev => prev.map(b => { const idx = temp.findIndex(t => t.id === b.id); return idx >= 0 && ids[idx] ? { ...b, id: ids[idx] } : b; }));
      endBgSave(true);
      const blockTitle = isProjectBlock ? base.projectName : nameFor(base.customerId);
      offerUndo(`Booked ${dates.length} day${dates.length === 1 ? '' : 's'} for ${blockTitle}`, async () => {
        const saved = ids.filter(Boolean);
        setBookings(prev => prev.filter(b => !saved.includes(b.id)));
        await deleteBookingsQuietly(saved);
      });
    } catch (err) {
      endBgSave(false, err.message);
      loadData(); // show exactly what was saved
    }
  };

  const handleDayClick = async (dateStr, year, month, day) => {
    if (!isWorkDay(year, month, day)) return;
    
    // A brand-new big job must finish saving before days can be placed on it,
    // otherwise the days would not be linked to it
    if (allocatingProject && String(allocatingProject.id).startsWith('temp_')) return;
    
    // Block booking: first tap = first day, second tap = last day
    if (blockMode) {
      if (!blockStart || blockEnd) { setBlockStart(dateStr); setBlockEnd(null); }
      else if (dateStr < blockStart) { setBlockEnd(blockStart); setBlockStart(dateStr); }
      else setBlockEnd(dateStr);
      return;
    }
    
    if (isDayOff(dateStr)) {
      if (!selectedCustomerToBook && !allocatingProject) {
        setSelectedDay(dateStr);
      }
      return;
    }
    
    if (allocatingProject) { toggleProjectDay(dateStr); return; }
    if (selectedCustomerToBook) { 
      const isFault = selectedTicketToBook !== null && (selectedTicketToBook.type || 'fault') === 'fault';
      const type = isFault ? 'fault' : bookingType;
      const price = customQuote ? parseFloat(customQuote) : (isFault ? DEFAULT_PRICES.fault : 0); 
      
      if (selectedGroupToBook && selectedGroupToBook.length > 1) {

            const svcType = isFault ? bookingType : type;
            const result = await apiCall('addBooking', { data: { date: dateStr, customerId: item.customer.id, type, serviceType: svcType, price: price || 0, status: 'scheduled', notes: jobNotes || '' } });
            learnId(tempBookings[i].id, result.id);
            setBookings(prev => prev.map(b => b.id === tempBookings[i].id ? { ...b, id: result.id } : b));
            savedGroupIds.push(result.id);
          }
          endBgSave(true);
          offerUndo(`Booked ${savedGroupIds.length} churches on ${dayWords(dateStr)}`, async () => {
            setBookings(prev => prev.filter(b => !savedGroupIds.includes(b.id)));
            await deleteBookingsQuietly(savedGroupIds);
          });
        } catch (err) {
          setBookings(prev => prev.filter(b => !tempBookings.some(tb => tb.id === b.id)));
          endBgSave(false, err.message);
        }
      } else {
        await addBooking(dateStr, selectedCustomerToBook.id, type, price, jobNotes, selectedTicketToBook, isFault ? bookingType : null);
      }
    }
    else { setSelectedDay(dateStr); }
  };
