<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Centre — Organ Works</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { touch-action: manipulation; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; }
    .focus-mode .dim-when-booking { opacity: 0.3; pointer-events: none; filter: grayscale(50%); }
    .booking-highlight { animation: pulse-green 1.5s ease-in-out infinite; }
    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    }
    .touch-target { min-height: 48px; min-width: 48px; }
    .loading-spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media print { .no-print { display: none !important; } body { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
    .scroll-panel { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    .scroll-panel::-webkit-scrollbar { width: 6px; }
    .scroll-panel::-webkit-scrollbar-track { background: transparent; }
    .scroll-panel::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
    .capacity-bar { height: 24px; border-radius: 4px; overflow: hidden; display: flex; }
    .capacity-segment { height: 100%; transition: width 0.3s ease; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

const getApiUrl = () => localStorage.getItem('organWorks_apiUrl') || '';
const setApiUrl = (url) => localStorage.setItem('organWorks_apiUrl', url);

const apiCall = async (action, params = {}) => {
  const API_URL = getApiUrl();
  if (!API_URL) throw new Error('API URL not configured');
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  Object.keys(params).forEach(key => {
    if (typeof params[key] === 'object') {
      url.searchParams.set(key, JSON.stringify(params[key]));
    } else {
      url.searchParams.set(key, params[key]);
    }
  });
  const response = await fetch(url.toString());
  const data = await response.json();
  if (data && data.error) throw new Error(data.error);
  return data;
};

const CommandCentre = () => {
  const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const DEFAULT_PRICES = { tuning_full: 550, tuning_half: 300, fault: 300, big: 550 };

  // State
  const [isConfigured, setIsConfigured] = useState(!!getApiUrl());
  const [configUrl, setConfigUrl] = useState('');
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  
  const [customers, setCustomers] = useState([]);
  const [contacts, setContacts] = useState([]);
  const [projects, setProjects] = useState([]);
  const [bookings, setBookings] = useState([]);
  const [daysOff, setDaysOff] = useState([]);
  const [tickets, setTickets] = useState([]);
  const [jobs, setJobs] = useState([]);
  const [timeEntries, setTimeEntries] = useState([]);
  const [materials, setMaterials] = useState([]);

  const [currentDate, setCurrentDate] = useState(new Date());
  const [selectedCustomerToBook, setSelectedCustomerToBook] = useState(null);
  const [selectedTicketToBook, setSelectedTicketToBook] = useState(null);
  const [selectedDay, setSelectedDay] = useState(null);
  const [view, setView] = useState('planner');
  const [selectedCustomer, setSelectedCustomer] = useState(null);
  const [bookingType, setBookingType] = useState('OTS');
  const [customQuote, setCustomQuote] = useState('');
  const [jobNotes, setJobNotes] = useState('');
  const [showAddTicket, setShowAddTicket] = useState(false);
  const [newTicketCustomer, setNewTicketCustomer] = useState('');
  const [newTicketDescription, setNewTicketDescription] = useState('');
  const [customerSearch, setCustomerSearch] = useState('');
  
  // Memoize filtered customers for search to prevent re-render issues
  const filteredCustomersForSearch = useMemo(() => {
    if (!customerSearch) return [];
    return customers.filter(c => c.name.toLowerCase().includes(customerSearch.toLowerCase())).slice(0, 5);
  }, [customers, customerSearch]);
  const [plannerSearch, setPlannerSearch] = useState('');
  const [showProjectSummary, setShowProjectSummary] = useState(null);
  const [showCapacityDetails, setShowCapacityDetails] = useState(false);
  
  // Invoice calculator
  const [showInvoiceCalc, setShowInvoiceCalc] = useState(null);
  const [selectedBand, setSelectedBand] = useState(null);
  const [selectedDistance, setSelectedDistance] = useState(null);
  const [customAmount, setCustomAmount] = useState('');
  const [pricing, setPricing] = useState({ timeBands: [], distanceBands: [] });
  const [invoiceMaterials, setInvoiceMaterials] = useState([]);
  const [newMaterialDesc, setNewMaterialDesc] = useState('');
  const [newMaterialCost, setNewMaterialCost] = useState('');
  const [materialsList, setMaterialsList] = useState([]);
  const [materialSearch, setMaterialSearch] = useState('');
  const [materialQty, setMaterialQty] = useState(1);
  const [newMaterialQty, setNewMaterialQty] = useState(1);
  const [selectedMaterial, setSelectedMaterial] = useState(null);

  // Project allocation
  const [allocatingProject, setAllocatingProject] = useState(null);
  const [showNewProject, setShowNewProject] = useState(false);
  const [newProjectName, setNewProjectName] = useState('');
  const [newProjectCustomer, setNewProjectCustomer] = useState(null);
  const [projectCustomerSearch, setProjectCustomerSearch] = useState('');
  
  // Memoize filtered customers for project search
  const filteredCustomersForProject = useMemo(() => {
    if (!projectCustomerSearch) return [];
    return customers.filter(c => c.name.toLowerCase().includes(projectCustomerSearch.toLowerCase())).slice(0, 10);
  }, [customers, projectCustomerSearch]);
  const [newProjectEstDays, setNewProjectEstDays] = useState('');
  const [newProjectYearStart, setNewProjectYearStart] = useState(new Date().getFullYear());
  const [newProjectYearEnd, setNewProjectYearEnd] = useState(new Date().getFullYear());
  const [editingProject, setEditingProject] = useState(null); // For editing existing projects

  const currentYear = currentDate.getFullYear();
  const plannerMonths = monthNames.map((name, idx) => ({ name, year: currentYear, month: idx, days: new Date(currentYear, idx + 1, 0).getDate() }));

  // Data loading
  const loadData = useCallback(async () => {
    if (!getApiUrl()) return;
    setLoading(true);
    try {
      const data = await apiCall('getAllData');
      const parsedCustomers = (data.customers || []).map(c => ({
        ...c,
        tuningMonths: typeof c.tuningMonths === 'string' ? (c.tuningMonths ? JSON.parse(c.tuningMonths) : []) : (c.tuningMonths || []),
        customRate: c.customRate ? parseFloat(c.customRate) : null
      }));
      setCustomers(parsedCustomers);
      setContacts(data.contacts || []);
      setProjects(data.projects || []);
      const normalizedBookings = (data.bookings || []).map(b => ({ ...b, date: b.date ? b.date.split('T')[0] : b.date }));
      setBookings(normalizedBookings);
      setDaysOff((data.daysOff || []).map(d => d.date));
      setTickets(data.tickets || []);
      setPricing(data.pricing || { timeBands: [], distanceBands: [] });
      setMaterialsList(data.materialsList || []);
      setJobs(data.jobs || []);
      setTimeEntries(data.timeEntries || []);
      setMaterials(data.materials || []);
    } catch (err) {
      console.error('Failed to load data:', err);
      alert('Failed to load data: ' + err.message);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { if (isConfigured) loadData(); }, [isConfigured, loadData]);

  // Helper functions
  const getDateString = (year, month, day) => `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  const getDayOfWeek = (year, month, day) => new Date(year, month, day).getDay();
  const isWorkDay = (year, month, day) => { const dow = getDayOfWeek(year, month, day); return dow >= 1 && dow <= 5; }; // Mon-Fri
  const getBookingsForDay = (date) => bookings.filter(b => b.date === date);
  const getCustomerById = (id) => customers.find(c => c.id === id);
  const isDayOff = (date) => daysOff.includes(date);
  const formatDate = (dateStr) => { if (!dateStr) return ''; const d = new Date(dateStr); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
  const formatCurrency = (amount) => '£' + (parseFloat(amount) || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const getJobTypeLabel = (type) => {
    if (type === 'OTS') return 'On-site (with helper)';
    if (type === 'TSC') return 'Solo Site Work';
    if (type === 'WS') return 'Workshop';
    if (type === 'project') return 'Project Day';
    if (type === 'tuning_full') return 'Tuning (Full Day)';
    if (type === 'tuning_half') return 'Tuning (Half Day)';
    if (type === 'fault') return 'Fault Visit';
    if (type === 'big') return 'Big Job';
    return type || 'Visit';
  };

  const getJobTypeColor = (type) => {
    if (type === 'OTS') return 'blue';
    if (type === 'TSC') return 'blue';
    if (type === 'WS') return 'purple';
    if (type === 'project') return 'pink';
    if (type?.startsWith('tuning')) return 'blue';
    if (type === 'fault') return 'orange';
    if (type === 'big') return 'red';
    return 'gray';
  };

  const isCustomerBookedInMonth = (customerId, monthIndex, year) => {
    const monthStart = getDateString(year, monthIndex, 1);
    const monthEnd = getDateString(year, monthIndex, new Date(year, monthIndex + 1, 0).getDate());
    return bookings.some(b => b.customerId === customerId && b.date >= monthStart && b.date <= monthEnd);
  };

  const getCustomerHistory = (customerId) => bookings.filter(b => b.customerId === customerId).sort((a, b) => new Date(b.date) - new Date(a.date));
  const getLastTuningPrice = (customerId) => { const history = getCustomerHistory(customerId); const lastTuning = history.find(b => b.type?.startsWith('tuning') && b.status === 'paid'); return lastTuning ? parseFloat(lastTuning.price) : null; };

  // ============================================================
  // CAPACITY PLANNING - THE KEY FEATURE
  // ============================================================
  
  const capacityData = useMemo(() => {
    const now = new Date();
    const today = getDateString(now.getFullYear(), now.getMonth(), now.getDate());
    const yearStart = `${currentYear}-01-01`;
    
    // Calculate total tuning visits expected this year
    // Each customer with tuning months = that many visits per year
    let totalTuningsExpected = 0;
    customers.forEach(c => {
      if (c.tuningMonths && c.tuningMonths.length > 0) {
        totalTuningsExpected += c.tuningMonths.length;
      }
    });
    
    // Count tunings already booked this year (any type that's tuning-related)
    const tuningsBookedThisYear = bookings.filter(b => {
      if (!b.date) return false;
      const bookingYear = new Date(b.date).getFullYear();
      if (bookingYear !== currentYear) return false;
      // Count OTS, TSC as tuning visits
      return b.type === 'OTS' || b.type === 'TSC' || b.type?.startsWith('tuning');
    }).length;
    
    // Remaining tunings to book
    const tuningsRemaining = Math.max(0, totalTuningsExpected - tuningsBookedThisYear);
    
    // Days needed for remaining tunings (2 per day, half-day each)
    const daysNeededForTunings = Math.ceil(tuningsRemaining / 2);
    
    // Calculate workdays in the year (Mon-Wed only)
    const getAllWorkdays = () => {
      const workdays = [];
      for (let month = 0; month < 12; month++) {
        const daysInMonth = new Date(currentYear, month + 1, 0).getDate();
        for (let day = 1; day <= daysInMonth; day++) {
          const dow = new Date(currentYear, month, day).getDay();
          if (dow >= 1 && dow <= 5) { // Mon-Fri
            workdays.push(getDateString(currentYear, month, day));
          }
        }
      }
      return workdays;
    };
    
    const allWorkdays = getAllWorkdays();
    const totalWorkdays = allWorkdays.length;
    
    // Days off this year
    const daysOffThisYear = daysOff.filter(d => d && new Date(d).getFullYear() === currentYear);
    
    // Available workdays (minus days off)
    const availableWorkdays = allWorkdays.filter(d => !daysOffThisYear.includes(d));
    
    // Count bookings by type for this year
    const yearBookings = bookings.filter(b => b.date && new Date(b.date).getFullYear() === currentYear);
    
    // Count unique days by booking type (a day counts once even if multiple bookings)
    const tuningDays = new Set();
    const faultDays = new Set();
    const projectDays = new Set();
    
    yearBookings.forEach(b => {
      if (b.type === 'OTS' || b.type === 'TSC' || b.type === 'WS' || b.type?.startsWith('tuning')) {
        tuningDays.add(b.date);
      } else if (b.type === 'fault') {
        faultDays.add(b.date);
      } else if (b.type === 'project') {
        projectDays.add(b.date);
      }
    });
    
    // Booked days (unique dates with bookings)
    const bookedDates = new Set(yearBookings.map(b => b.date));
    
    // Calculate planned project days for this year
    // Projects spanning this year, with days split across years
    let plannedProjectDays = 0;
    projects.filter(p => p.status === 'active').forEach(p => {
      // Support both old targetYear and new yearStart/yearEnd format
      const yearStart = parseInt(p.yearStart) || parseInt(p.targetYear) || currentYear;
      const yearEnd = parseInt(p.yearEnd) || parseInt(p.targetYear) || currentYear;
      
      // Check if this year falls within the project's range
      if (currentYear >= yearStart && currentYear <= yearEnd) {
        const estimatedDays = parseInt(p.estimatedDays) || 0;
        const yearsSpanned = yearEnd - yearStart + 1;
        // Split days evenly across years
        const daysThisYear = Math.ceil(estimatedDays / yearsSpanned);
        // Count how many days are already booked for this project THIS year
        const bookedForProjectThisYear = yearBookings.filter(b => b.projectId === p.id).length;
        // Remaining planned days = allocated for this year - already booked this year
        plannedProjectDays += Math.max(0, daysThisYear - bookedForProjectThisYear);
      }
    });
    
    // Unbooked available days (full year from Jan 1st)
    const unbookedDays = availableWorkdays.filter(d => !bookedDates.has(d));
    
    // Days truly free = unbooked - reserved for tunings - planned projects
    const daysFreeForProjects = Math.max(0, unbookedDays.length - daysNeededForTunings - plannedProjectDays);
    
    // Is overcommitted?
    const totalCommitted = daysNeededForTunings + plannedProjectDays;
    const isOvercommitted = totalCommitted > unbookedDays.length;
    const overcommittedBy = isOvercommitted ? totalCommitted - unbookedDays.length : 0;
    
    // For coloring the calendar, determine which unbooked days are "reserved" vs "free"
    // Reserved days fill from START of year forwards (January first)
    // Free days appear at the END of the year
    // As tunings get booked, they lock in place and reserved block shrinks
    const futureUnbookedDays = unbookedDays.filter(d => d >= today);
    const reservedDays = new Set();
    const plannedDays = new Set();
    const sortedFutureUnbooked = [...futureUnbookedDays].sort((a, b) => a.localeCompare(b)); // Earliest first
    
    // First mark tuning reserved days
    for (let i = 0; i < Math.min(daysNeededForTunings, sortedFutureUnbooked.length); i++) {
      reservedDays.add(sortedFutureUnbooked[i]);
    }
    // Then mark planned project days (after tuning days)
    for (let i = daysNeededForTunings; i < Math.min(daysNeededForTunings + plannedProjectDays, sortedFutureUnbooked.length); i++) {
      plannedDays.add(sortedFutureUnbooked[i]);
    }
    
    return {
      totalTuningsExpected,
      tuningsBookedThisYear,
      tuningsRemaining,
      daysNeededForTunings,
      totalWorkdays,
      daysOffCount: daysOffThisYear.length,
      availableDays: availableWorkdays.length,
      bookedDays: bookedDates.size,
      tuningDaysBooked: tuningDays.size,
      faultDaysBooked: faultDays.size,
      projectDaysBooked: projectDays.size,
      plannedProjectDays,
      unbookedDaysCount: unbookedDays.length,
      futureUnbookedCount: futureUnbookedDays.length,
      daysFreeForProjects,
      isOvercommitted,
      overcommittedBy,
      reservedDays, // Set of date strings that are "reserved" for tunings (future only)
      plannedDays, // Set of date strings for planned project days
      today, // For reference
    };
  }, [customers, bookings, daysOff, projects, currentYear]);

  // ============================================================
  // CAPACITY BAR COMPONENT
  // ============================================================
  
  const CapacityBar = () => {
    const { 
      totalWorkdays, daysOffCount, availableDays, bookedDays, 
      daysNeededForTunings, daysFreeForProjects, isOvercommitted, overcommittedBy,
      totalTuningsExpected, tuningsBookedThisYear, tuningsRemaining, unbookedDaysCount,
      tuningDaysBooked, faultDaysBooked, projectDaysBooked, plannedProjectDays
    } = capacityData;
    
    // Calculate bar segments - matching calendar colours
    const barTotal = availableDays;
    const tuningWidth = (tuningDaysBooked / barTotal) * 100;
    const faultWidth = (faultDaysBooked / barTotal) * 100;
    const projectWidth = (projectDaysBooked / barTotal) * 100;
    const reservedWidth = Math.min((daysNeededForTunings / barTotal) * 100, 100 - tuningWidth - faultWidth - projectWidth);
    const plannedWidth = Math.min((plannedProjectDays / barTotal) * 100, 100 - tuningWidth - faultWidth - projectWidth - reservedWidth);
    const freeWidth = Math.max(0, 100 - tuningWidth - faultWidth - projectWidth - reservedWidth - plannedWidth);
    
    return (
      <div className="bg-white rounded-lg shadow p-4 mb-3">
        <div className="flex justify-between items-center mb-2">
          <h3 className="font-bold text-lg">📊 Capacity {currentYear}</h3>
          <button 
            onClick={() => setShowCapacityDetails(!showCapacityDetails)}
            className="text-sm text-blue-600 hover:underline"
          >
            {showCapacityDetails ? 'Hide details' : 'Show details'}
          </button>
        </div>
        
        {/* Main capacity bar - colours match calendar legend */}
        <div className="capacity-bar bg-gray-200 mb-2">
          {tuningDaysBooked > 0 && <div className="capacity-segment bg-blue-500" style={{ width: `${tuningWidth}%` }} title={`Tunings: ${tuningDaysBooked} days`}></div>}
          {faultDaysBooked > 0 && <div className="capacity-segment bg-orange-400" style={{ width: `${faultWidth}%` }} title={`Faults: ${faultDaysBooked} days`}></div>}
          {projectDaysBooked > 0 && <div className="capacity-segment bg-pink-400" style={{ width: `${projectWidth}%` }} title={`Projects booked: ${projectDaysBooked} days`}></div>}
          <div className="capacity-segment bg-amber-200 border-y border-amber-300" style={{ width: `${reservedWidth}%` }} title={`Reserved for tunings: ${daysNeededForTunings} days`}></div>
          {plannedProjectDays > 0 && <div className="capacity-segment bg-pink-200 border-y border-pink-300" style={{ width: `${plannedWidth}%` }} title={`Planned projects: ${plannedProjectDays} days`}></div>}
          <div className="capacity-segment bg-green-200 border-y border-green-300" style={{ width: `${freeWidth}%` }} title={`Free: ${daysFreeForProjects} days`}></div>
        </div>
        
        {/* Legend and key numbers - matching calendar colours */}
        <div className="flex flex-wrap gap-4 text-sm">
          {tuningDaysBooked > 0 && (
            <div className="flex items-center gap-2">
              <div className="w-4 h-4 bg-blue-500 rounded"></div>
              <span>Tunings: <strong>{tuningDaysBooked}</strong></span>
            </div>
          )}
          {faultDaysBooked > 0 && (
            <div className="flex items-center gap-2">
              <div className="w-4 h-4 bg-orange-400 rounded"></div>
              <span>Faults: <strong>{faultDaysBooked}</strong></span>
            </div>
          )}
          {projectDaysBooked > 0 && (
            <div className="flex items-center gap-2">
              <div className="w-4 h-4 bg-pink-400 rounded"></div>
              <span>Projects: <strong>{projectDaysBooked}</strong></span>
            </div>
          )}
          <div className="flex items-center gap-2">
            <div className="w-4 h-4 bg-amber-200 border border-amber-300 rounded"></div>
            <span>Reserved: <strong>{daysNeededForTunings}</strong></span>
          </div>
          {plannedProjectDays > 0 && (
            <div className="flex items-center gap-2">
              <div className="w-4 h-4 bg-pink-200 border border-pink-300 rounded"></div>
              <span>Planned: <strong>{plannedProjectDays}</strong></span>
            </div>
          )}
          <div className="flex items-center gap-2">
            <div className="w-4 h-4 bg-green-200 border border-green-300 rounded"></div>
            <span>Free: <strong className={daysFreeForProjects > 20 ? 'text-green-600' : daysFreeForProjects > 0 ? 'text-amber-600' : 'text-red-600'}>{daysFreeForProjects}</strong></span>
          </div>
          {isOvercommitted && (
            <div className="flex items-center gap-2 text-red-600 font-bold">
              ⚠️ Overcommitted by {overcommittedBy} days!
            </div>
          )}
        </div>
        
        {/* Detailed breakdown */}
        {showCapacityDetails && (
          <div className="mt-4 pt-4 border-t grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
            <div className="bg-gray-50 p-3 rounded">
              <div className="text-gray-500">Total workdays</div>
              <div className="text-2xl font-bold">{totalWorkdays}</div>
              <div className="text-xs text-gray-400">Mon-Fri all year</div>
            </div>
            <div className="bg-gray-50 p-3 rounded">
              <div className="text-gray-500">Days off</div>
              <div className="text-2xl font-bold">{daysOffCount}</div>
            </div>
            <div className="bg-gray-50 p-3 rounded">
              <div className="text-gray-500">Available</div>
              <div className="text-2xl font-bold">{availableDays}</div>
              <div className="text-xs text-gray-400">workdays − off</div>
            </div>
            <div className="bg-gray-50 p-3 rounded">
              <div className="text-gray-500">Booked</div>
              <div className="text-2xl font-bold">{bookedDays}</div>
              <div className="text-xs text-gray-400">{tuningDaysBooked}T + {faultDaysBooked}F + {projectDaysBooked}P</div>
            </div>
            <div className="bg-blue-50 p-3 rounded">
              <div className="text-blue-600">Tunings expected</div>
              <div className="text-2xl font-bold text-blue-700">{totalTuningsExpected}</div>
              <div className="text-xs text-blue-500">{tuningsBookedThisYear} booked</div>
            </div>
            <div className="bg-amber-50 p-3 rounded">
              <div className="text-amber-600">Tunings remaining</div>
              <div className="text-2xl font-bold text-amber-700">{tuningsRemaining}</div>
              <div className="text-xs text-amber-500">= {daysNeededForTunings} days @ 2/day</div>
            </div>
            <div className="bg-pink-50 p-3 rounded">
              <div className="text-pink-600">Project days</div>
              <div className="text-2xl font-bold text-pink-700">{projectDaysBooked}</div>
              <div className="text-xs text-pink-500">booked</div>
            </div>
            <div className={`p-3 rounded ${daysFreeForProjects > 20 ? 'bg-green-50' : daysFreeForProjects > 0 ? 'bg-amber-50' : 'bg-red-50'}`}>
              <div className={daysFreeForProjects > 20 ? 'text-green-600' : daysFreeForProjects > 0 ? 'text-amber-600' : 'text-red-600'}>Free for projects</div>
              <div className={`text-2xl font-bold ${daysFreeForProjects > 20 ? 'text-green-700' : daysFreeForProjects > 0 ? 'text-amber-700' : 'text-red-700'}`}>{daysFreeForProjects}</div>
              <div className="text-xs text-gray-500">{unbookedDaysCount} unbooked − {daysNeededForTunings} tunings</div>
            </div>
          </div>
        )}
      </div>
    );
  };

  const getJobsDue = () => {
    const now = new Date();
    const thisMonth = now.getMonth();
    const thisYear = now.getFullYear();
    const nextMonth = (thisMonth + 1) % 12;
    const nextYear = thisMonth === 11 ? thisYear + 1 : thisYear;
    const due = [];
    customers.forEach(customer => {
      if (!customer.tuningMonths || customer.tuningMonths.length === 0) return;
      if (customer.tuningMonths.includes(thisMonth) && !isCustomerBookedInMonth(customer.id, thisMonth, thisYear)) {
        due.push({ customer, month: thisMonth, year: thisYear, monthName: monthNames[thisMonth], urgent: true });
      }
      if (customer.tuningMonths.includes(nextMonth) && !isCustomerBookedInMonth(customer.id, nextMonth, nextYear)) {
        due.push({ customer, month: nextMonth, year: nextYear, monthName: monthNames[nextMonth], urgent: false });
      }
    });
    return due;
  };
  const jobsDue = getJobsDue();

  const getActiveProjects = () => {
    return projects.filter(p => p.status === 'active').map(p => {
      const allocatedDays = bookings.filter(b => b.type === 'project' && b.projectId === p.id).map(b => b.date);
      const projectJobs = jobs.filter(j => j.projectId === p.id);
      const jobIds = projectJobs.map(j => j.id);
      const projectTimeEntries = timeEntries.filter(te => jobIds.includes(te.jobId));
      const totalHours = projectTimeEntries.reduce((sum, te) => sum + (parseFloat(te.duration) || 0), 0);
      const projectMaterials = materials.filter(m => jobIds.includes(m.jobId));
      const materialsCost = projectMaterials.reduce((sum, m) => sum + (parseFloat(m.cost) || 0), 0);
      return { ...p, customerName: customers.find(c => c.id === p.customerId)?.name || 'Unknown', days: allocatedDays, jobs: projectJobs, totalHours, materialsCost, timeEntries: projectTimeEntries, materials: projectMaterials };
    });
  };
  const activeProjects = getActiveProjects();

  // ============================================================
  // BOOKING FUNCTIONS
  // ============================================================
  
  const addBooking = async (date, customerId, type, price, notes, ticket = null) => {
    setSaving(true);
    try {
      const result = await apiCall('addBooking', { data: { date, customerId, type, serviceType: type, price: price || 0, status: 'scheduled', notes: notes || '' } });
      setBookings([...bookings, { id: result.id, date, customerId, type, serviceType: type, price: price || 0, status: 'scheduled', notes: notes || '' }]);
      if (ticket) {
        await apiCall('updateTicket', { data: { id: ticket.id, status: 'scheduled', bookingId: result.id } });
        setTickets(tickets.filter(t => t.id !== ticket.id));
        setSelectedTicketToBook(null);
      }
      setSelectedCustomerToBook(null);
      setCustomQuote('');
      setJobNotes('');
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to save booking: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const removeBooking = async (date, bookingId) => {
    if (!confirm('Remove this booking?')) return;
    setSaving(true);
    try {
      await apiCall('deleteBooking', { bookingId });
      setBookings(bookings.filter(b => b.id !== bookingId));
      const ticketData = await apiCall('getTickets');
      setTickets(ticketData || []);
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to remove booking: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const updateBookingStatus = async (bookingId, status) => {
    setSaving(true);
    try {
      const updates = { id: bookingId, status };
      if (status === 'invoiced') updates.invoiceDate = new Date().toISOString().split('T')[0];
      if (status === 'paid') updates.paidDate = new Date().toISOString().split('T')[0];
      await apiCall('updateBooking', { data: updates });
      setBookings(bookings.map(b => b.id === bookingId ? { ...b, ...updates } : b));
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to update: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const toggleDayOff = async (date) => {
    setSaving(true);
    try {
      if (isDayOff(date)) {
        await apiCall('removeDayOff', { date });
        setDaysOff(daysOff.filter(d => d !== date));
      } else {
        await apiCall('addDayOff', { data: { date, reason: '' } });
        setDaysOff([...daysOff, date]);
      }
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to update day off: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const createProject = async () => {
    if (!newProjectName || !newProjectCustomer) return;
    setSaving(true);
    try {
      const yearStart = newProjectYearStart;
      const yearEnd = newProjectYearEnd >= newProjectYearStart ? newProjectYearEnd : newProjectYearStart;
      const result = await apiCall('addProject', { data: { customerId: newProjectCustomer.id, name: newProjectName, estimatedDays: newProjectEstDays ? parseInt(newProjectEstDays) : '', yearStart, yearEnd, status: 'active' } });
      const newProject = { id: result.id, name: newProjectName, customerId: newProjectCustomer.id, customerName: newProjectCustomer.name, estimatedDays: newProjectEstDays ? parseInt(newProjectEstDays) : null, yearStart, yearEnd, status: 'active', days: [] };
      setProjects([...projects, newProject]);
      // Only start allocating if project includes current year
      if (currentYear >= yearStart && currentYear <= yearEnd) {
        setAllocatingProject(newProject);
      }
      setShowNewProject(false);
      setNewProjectName('');
      setNewProjectCustomer(null);
      setProjectCustomerSearch('');
      setNewProjectEstDays('');
      setNewProjectYearStart(currentYear);
      setNewProjectYearEnd(currentYear);
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to create project: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const updateProject = async (projectId, updates) => {
    setSaving(true);
    try {
      await apiCall('updateProject', { data: { id: projectId, ...updates } });
      setProjects(projects.map(p => p.id === projectId ? { ...p, ...updates } : p));
      setEditingProject(null);
      setShowProjectSummary(null);
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to update project: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const deleteProject = async (projectId) => {
    if (!confirm('Delete this project? All allocated days will also be removed.')) return;
    setSaving(true);
    try {
      const projectBookings = bookings.filter(b => b.projectId === projectId);
      for (const booking of projectBookings) {
        await apiCall('deleteBooking', { bookingId: booking.id });
      }
      await apiCall('deleteProject', { projectId });
      setProjects(projects.filter(p => p.id !== projectId));
      setBookings(bookings.filter(b => b.projectId !== projectId));
      setShowProjectSummary(null);
      setAllocatingProject(null);
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to delete project: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const toggleProjectDay = async (dateStr) => {
    if (!allocatingProject) return;
    const existingBooking = bookings.find(b => b.type === 'project' && b.projectId === allocatingProject.id && b.date === dateStr);
    setSaving(true);
    try {
      if (existingBooking) {
        await apiCall('deleteBooking', { bookingId: existingBooking.id });
        setBookings(bookings.filter(b => b.id !== existingBooking.id));
      } else {
        const result = await apiCall('addBooking', { data: { date: dateStr, customerId: allocatingProject.customerId, type: 'project', serviceType: 'project', projectId: allocatingProject.id, projectName: allocatingProject.name, price: 0, status: 'scheduled', notes: allocatingProject.estimatedDays ? `Est: ${allocatingProject.estimatedDays} days` : allocatingProject.name } });
        setBookings([...bookings, { id: result.id, date: dateStr, customerId: allocatingProject.customerId, type: 'project', serviceType: 'project', projectId: allocatingProject.id, projectName: allocatingProject.name, estimatedDays: allocatingProject.estimatedDays, price: 0, status: 'scheduled', notes: allocatingProject.estimatedDays ? `Est: ${allocatingProject.estimatedDays} days` : allocatingProject.name }]);
      }
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to update project day: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const handleDayClick = (dateStr, year, month, day) => {
    if (!isWorkDay(year, month, day)) return;
    if (isDayOff(dateStr)) return;
    if (allocatingProject) { toggleProjectDay(dateStr); return; }
    if (selectedCustomerToBook) { const price = customQuote ? parseFloat(customQuote) : 0; addBooking(dateStr, selectedCustomerToBook.id, bookingType, price, jobNotes, selectedTicketToBook); }
    else { setSelectedDay(dateStr); }
  };

  // Ticket functions
  const addTicket = async () => {
    if (!newTicketCustomer || !newTicketDescription) return;
    setSaving(true);
    try {
      const result = await apiCall('addTicket', { data: { customerId: newTicketCustomer, description: newTicketDescription, status: 'new' } });
      setTickets([...tickets, { id: result.id, customerId: newTicketCustomer, description: newTicketDescription, status: 'new', createdAt: new Date().toISOString() }]);
      setShowAddTicket(false);
      setNewTicketCustomer('');
      setNewTicketDescription('');
      setCustomerSearch('');
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to add: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const selectTicketToBook = (ticket) => {
    const customer = getCustomerById(ticket.customerId);
    setSelectedCustomerToBook(customer);
    setSelectedTicketToBook(ticket);
    setBookingType('TSC');
    setJobNotes(ticket.description);
  };

  const deleteTicket = async (ticketId) => {
    setSaving(true);
    try { await apiCall('deleteTicket', { ticketId }); setTickets(tickets.filter(t => t.id !== ticketId)); }
    catch (err) { alert('Failed to delete: ' + err.message); }
    finally { setSaving(false); }
  };

  const updateCustomer = async (customer) => {
    setSaving(true);
    try {
      await apiCall('updateCustomer', { data: { ...customer, tuningMonths: customer.tuningMonths } });
      setCustomers(customers.map(c => c.id === customer.id ? customer : c));
      setLastSaved(new Date());
    } catch (err) {
      alert('Failed to save: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const getStats = () => {
    const completedJobs = bookings.filter(b => b.status === 'completed');
    const uninvoicedTotal = completedJobs.reduce((sum, b) => sum + (parseFloat(b.price) || 0), 0);
    const awaitingPayment = bookings.filter(b => b.status === 'invoiced');
    const awaitingTotal = awaitingPayment.reduce((sum, b) => sum + (parseFloat(b.price) || 0), 0);
    return {
      tuningDays: bookings.filter(b => b.type?.startsWith('tuning') || b.type === 'OTS' || b.type === 'TSC').length,
      faultDays: bookings.filter(b => b.type === 'fault').length,
      bigDays: bookings.filter(b => b.type === 'big' || b.type === 'project').length,
      needsInvoicing: completedJobs.length,
      uninvoicedTotal,
      awaitingPayment: awaitingPayment.length,
      awaitingTotal
    };
  };
  const stats = getStats();

  // ============================================================
  // CONFIGURATION SCREEN
  // ============================================================
  
  if (!isConfigured) {
    return (
      <div className="min-h-screen bg-gray-900 flex items-center justify-center p-8">
        <div className="bg-white rounded-2xl p-8 max-w-lg w-full shadow-2xl">
          <h1 className="text-3xl font-bold mb-2">🎹 Command Centre</h1>
          <p className="text-gray-600 mb-6">Connect to your Google Sheets database</p>
          <label className="block text-sm font-medium text-gray-700 mb-2">Google Apps Script URL</label>
          <input type="text" value={configUrl} onChange={(e) => setConfigUrl(e.target.value)} placeholder="https://script.google.com/macros/s/..." className="w-full p-4 text-lg border-2 rounded-lg mb-6" />
          <button onClick={() => { if (configUrl) { setApiUrl(configUrl); setIsConfigured(true); } }} className="w-full bg-blue-600 text-white py-4 rounded-lg text-xl font-bold hover:bg-blue-700">Connect</button>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div className="min-h-screen bg-gray-100 flex items-center justify-center">
        <div className="text-center">
          <div className="loading-spinner mx-auto mb-4"></div>
          <p className="text-xl text-gray-600">Loading your data...</p>
        </div>
      </div>
    );
  }

  // ============================================================
  // YEAR VIEW WITH CAPACITY COLORING
  // ============================================================
  
  const YearView = () => {
    const today = new Date();
    const todayStr = getDateString(today.getFullYear(), today.getMonth(), today.getDate());
    
    return (
      <div className={`bg-white rounded-lg shadow overflow-auto ${selectedCustomerToBook ? 'focus-mode' : ''}`}>
        <table className="w-full border-collapse">
          <thead className="sticky top-0 bg-gray-800 text-white z-10">
            <tr>
              <th className="p-3 text-left text-lg w-32">{currentYear}</th>
              {[...Array(31)].map((_, i) => <th key={i} className="p-1 text-center text-sm font-medium">{i + 1}</th>)}
            </tr>
          </thead>
          <tbody>
            {plannerMonths.map((monthData, monthIdx) => (
              <tr key={monthIdx} className="border-b">
                <td className="p-3 font-bold border-r bg-gray-50 text-lg">{monthData.name}</td>
                {[...Array(31)].map((_, dayIdx) => {
                  const day = dayIdx + 1;
                  if (day > monthData.days) return <td key={dayIdx} className="bg-gray-200"></td>;
                  const dateStr = getDateString(monthData.year, monthData.month, day);
                  const isWork = isWorkDay(monthData.year, monthData.month, day);
                  const isOff = isDayOff(dateStr);
                  const dayBookings = getBookingsForDay(dateStr);
                  const hasBooking = dayBookings.length > 0;
                  const firstBookingType = hasBooking ? dayBookings[0].type : null;
                  const color = firstBookingType ? getJobTypeColor(firstBookingType) : null;
                  const isSelecting = selectedCustomerToBook !== null || allocatingProject !== null;
                  const isToday = dateStr === todayStr;
                  const isPast = dateStr < todayStr;
                  
                  // Capacity coloring for unbooked workdays
                  const isReservedForTuning = !hasBooking && isWork && !isOff && !isPast && capacityData.reservedDays.has(dateStr);
                  const isPlannedForProject = !hasBooking && isWork && !isOff && !isPast && capacityData.plannedDays.has(dateStr);
                  const isFreeForProjects = !hasBooking && isWork && !isOff && !isPast && !capacityData.reservedDays.has(dateStr) && !capacityData.plannedDays.has(dateStr);

                  let cellClass = 'text-center border transition-all cursor-pointer relative ';
                  if (!isWork) cellClass += 'bg-gray-100 dim-when-booking';
                  else if (isOff) cellClass += 'bg-yellow-200 dim-when-booking';
                  else if (color === 'blue') cellClass += 'bg-blue-500 text-white';
                  else if (color === 'green') cellClass += 'bg-emerald-500 text-white';
                  else if (color === 'purple') cellClass += 'bg-purple-500 text-white';
                  else if (color === 'pink') cellClass += 'bg-pink-400 text-white';
                  else if (color === 'orange') cellClass += 'bg-orange-400 text-white';
                  else if (color === 'red') cellClass += 'bg-red-500 text-white';
                  else if (isPast && isWork) cellClass += 'bg-gray-50 text-gray-300';
                  else if (isReservedForTuning) cellClass += isSelecting ? 'bg-amber-300 hover:bg-amber-400' : 'bg-amber-200 hover:bg-amber-300';
                  else if (isPlannedForProject) cellClass += isSelecting ? 'bg-pink-300 hover:bg-pink-400' : 'bg-pink-200 hover:bg-pink-300';
                  else if (isFreeForProjects) cellClass += isSelecting ? 'bg-green-300 hover:bg-green-400' : 'bg-green-200 hover:bg-green-300';
                  else cellClass += 'bg-green-50 hover:bg-green-100';

                  return (
                    <td key={dayIdx} onClick={() => handleDayClick(dateStr, monthData.year, monthData.month, day)} className={cellClass}>
                      {isToday && <div className="absolute inset-0 border-2 border-red-500 rounded pointer-events-none"></div>}
                      <div className="w-8 h-8 flex items-center justify-center mx-auto text-sm font-bold">
                        {hasBooking ? (dayBookings.length > 1 ? dayBookings.length : firstBookingType === 'project' ? 'P' : (firstBookingType === 'OTS' || firstBookingType === 'TSC' || firstBookingType?.startsWith('tuning')) ? 'T' : firstBookingType === 'fault' ? 'F' : 'B') : isWork && !isOff && !isPast ? '·' : ''}
                      </div>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
        <div className="flex gap-4 p-4 bg-gray-100 border-t text-sm flex-wrap">
          <div className="flex items-center gap-2"><div className="w-6 h-6 bg-blue-500 rounded"></div> Tuning</div>
          <div className="flex items-center gap-2"><div className="w-6 h-6 bg-orange-400 rounded"></div> Fault</div>
          <div className="flex items-center gap-2"><div className="w-6 h-6 bg-pink-400 rounded"></div> Project</div>
          <div className="flex items-center gap-2"><div className="w-6 h-6 bg-amber-200 rounded border border-amber-400"></div> Reserved (tunings)</div>
          <div className="flex items-center gap-2"><div className="w-6 h-6 bg-pink-200 rounded border border-pink-400"></div> Planned (projects)</div>
          <div className="flex items-center gap-2"><div className="w-6 h-6 bg-green-200 rounded border border-green-400"></div> Free</div>
          <div className="flex items-center gap-2"><div className="w-6 h-6 bg-yellow-200 rounded"></div> Day off</div>
          <div className="flex items-center gap-2"><div className="w-6 h-6 bg-gray-100 rounded"></div> Weekend</div>
          <div className="flex items-center gap-2"><div className="w-6 h-6 bg-white rounded border-2 border-red-500"></div> Today</div>
        </div>
      </div>
    );
  };

  // ============================================================
  // DAY PANEL
  // ============================================================
  
  const DayPanel = ({ date, onClose }) => {
    const d = new Date(date);
    const dayBookings = getBookingsForDay(date);
    const isOff = isDayOff(date);

    return (
      <div className="w-96 bg-white rounded-lg shadow-xl p-5">
        <div className="flex justify-between items-start mb-4">
          <div>
            <h2 className="text-2xl font-bold">{dayNames[d.getDay()]}</h2>
            <p className="text-lg text-gray-500">{d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
          </div>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-3xl p-2 touch-target">✕</button>
        </div>

        <label className="flex items-center gap-3 mb-4 p-4 bg-yellow-50 rounded-lg cursor-pointer touch-target">
          <input type="checkbox" checked={isOff} onChange={() => toggleDayOff(date)} className="w-6 h-6" />
          <span className="text-lg font-medium">Day off / Holiday</span>
        </label>

        {!isOff && (
          <div className="space-y-3 mb-4">
            {dayBookings.map((booking) => {
              const customer = getCustomerById(booking.customerId);
              const color = getJobTypeColor(booking.type);
              const isProject = booking.type === 'project';
              return (
                <div key={booking.id} className={`p-4 rounded-lg ${color === 'blue' ? 'bg-blue-100 border-l-4 border-blue-500' : color === 'pink' ? 'bg-pink-100 border-l-4 border-pink-500' : color === 'orange' ? 'bg-orange-100 border-l-4 border-orange-500' : 'bg-gray-100 border-l-4 border-gray-500'}`}>
                  <div className="flex justify-between items-start">
                    <div>
                      {isProject && <div className="text-sm text-gray-600">{customer?.name}</div>}
                      <div className="font-bold text-lg">{isProject ? booking.projectName : customer?.name}</div>
                      <div className="text-sm text-gray-500 mt-1">{getJobTypeLabel(booking.type)}</div>
                      {booking.notes && !isProject && <div className="text-sm italic mt-1">{booking.notes}</div>}
                    </div>
                    <div className="text-right">
                      {!isProject && <div className="font-bold text-lg">£{booking.price}</div>}
                      <button onClick={() => removeBooking(date, booking.id)} className="text-red-500 text-sm hover:text-red-700 mt-2">Remove</button>
                    </div>
                  </div>
                  {!isProject && (
                    <div className="mt-3 pt-2 border-t flex gap-2 flex-wrap">
                      {booking.status === 'scheduled' && <button onClick={() => updateBookingStatus(booking.id, 'completed')} className="text-sm bg-white px-4 py-2 rounded-lg hover:bg-green-100 touch-target">✓ Done</button>}
                      {booking.status === 'completed' && <button onClick={() => updateBookingStatus(booking.id, 'invoiced')} className="text-sm bg-amber-200 px-4 py-2 rounded-lg hover:bg-amber-300 touch-target">📧 Invoice</button>}
                      {booking.status === 'invoiced' && <button onClick={() => updateBookingStatus(booking.id, 'paid')} className="text-sm bg-green-200 px-4 py-2 rounded-lg hover:bg-green-300 touch-target">💷 Paid</button>}
                      {booking.status === 'paid' && <span className="text-sm bg-green-500 text-white px-4 py-2 rounded-lg">✓ Paid</span>}
                    </div>
                  )}
                </div>
              );
            })}
            {dayBookings.length === 0 && <p className="text-gray-400 italic text-lg py-4">No bookings</p>}
          </div>
        )}
        <button onClick={onClose} className="w-full bg-gray-200 py-4 rounded-lg text-lg font-medium hover:bg-gray-300 touch-target">Close</button>
      </div>
    );
  };

  // ============================================================
  // PROJECT SUMMARY MODAL
  // ============================================================
  
  const ProjectSummaryModal = ({ project, onClose }) => {
    if (!project) return null;
    
    const [isEditing, setIsEditing] = useState(false);
    const [editName, setEditName] = useState(project.name || '');
    const [editEstDays, setEditEstDays] = useState(project.estimatedDays || '');
    const [editYearStart, setEditYearStart] = useState(project.yearStart || project.targetYear || currentYear);
    const [editYearEnd, setEditYearEnd] = useState(project.yearEnd || project.targetYear || currentYear);
    
    const hourlyRate = 45;
    const labourCost = project.totalHours * hourlyRate;
    const totalCost = labourCost + project.materialsCost;
    const yearLabel = project.yearStart === project.yearEnd ? project.yearStart : `${project.yearStart || project.targetYear}-${project.yearEnd || project.targetYear}`;
    
    const handleSave = () => {
      updateProject(project.id, {
        name: editName,
        estimatedDays: editEstDays ? parseInt(editEstDays) : null,
        yearStart: editYearStart,
        yearEnd: editYearEnd >= editYearStart ? editYearEnd : editYearStart
      });
    };
    
    return (
      <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto">
          <div className="flex justify-between items-start mb-4">
            <div className="flex-1">
              <div className="text-sm text-gray-500">{project.customerName}</div>
              {isEditing ? (
                <input 
                  type="text" 
                  value={editName} 
                  onChange={(e) => setEditName(e.target.value)} 
                  className="text-2xl font-bold w-full border-2 border-purple-300 rounded px-2 py-1 mt-1"
                />
              ) : (
                <h2 className="text-2xl font-bold">{project.name}</h2>
              )}
              {yearLabel && !isEditing && <div className="text-sm text-purple-600 mt-1">📅 {yearLabel}</div>}
            </div>
            <button onClick={onClose} className="text-2xl text-gray-400 hover:text-gray-600 ml-4">×</button>
          </div>
          
          {isEditing && (
            <div className="bg-purple-50 rounded-lg p-4 mb-4">
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-sm text-gray-600 block mb-1">Estimated Days</label>
                  <input 
                    type="number" 
                    value={editEstDays} 
                    onChange={(e) => setEditEstDays(e.target.value)} 
                    className="w-full p-2 border rounded"
                    placeholder="e.g. 40"
                  />
                </div>
                <div>
                  <label className="text-sm text-gray-600 block mb-1">Year Range</label>
                  <div className="flex gap-2 items-center">
                    <select value={editYearStart} onChange={(e) => { setEditYearStart(parseInt(e.target.value)); if (parseInt(e.target.value) > editYearEnd) setEditYearEnd(parseInt(e.target.value)); }} className="flex-1 p-2 border rounded bg-white">
                      {[currentYear - 1, currentYear, currentYear + 1, currentYear + 2, currentYear + 3].map(y => (
                        <option key={y} value={y}>{y}</option>
                      ))}
                    </select>
                    <span className="text-gray-500">→</span>
                    <select value={editYearEnd} onChange={(e) => setEditYearEnd(parseInt(e.target.value))} className="flex-1 p-2 border rounded bg-white">
                      {[currentYear - 1, currentYear, currentYear + 1, currentYear + 2, currentYear + 3].filter(y => y >= editYearStart).map(y => (
                        <option key={y} value={y}>{y}</option>
                      ))}
                    </select>
                  </div>
                </div>
              </div>
              <div className="flex gap-2 mt-4">
                <button onClick={handleSave} className="flex-1 py-2 bg-purple-500 text-white rounded font-medium">💾 Save Changes</button>
                <button onClick={() => setIsEditing(false)} className="flex-1 py-2 bg-gray-200 rounded font-medium">Cancel</button>
              </div>
            </div>
          )}
          
          <div className="grid grid-cols-3 gap-4 mb-6">
            <div className="bg-purple-100 rounded-lg p-4 text-center">
              <div className="text-3xl font-bold text-purple-700">{project.days.length}</div>
              <div className="text-sm text-purple-600">Days Allocated</div>
              {project.estimatedDays && <div className="text-xs text-purple-500">of {project.estimatedDays} est.</div>}
            </div>
            <div className="bg-blue-100 rounded-lg p-4 text-center">
              <div className="text-3xl font-bold text-blue-700">{project.totalHours.toFixed(1)}</div>
              <div className="text-sm text-blue-600">Hours Tracked</div>
            </div>
            <div className="bg-green-100 rounded-lg p-4 text-center">
              <div className="text-3xl font-bold text-green-700">{formatCurrency(project.materialsCost)}</div>
              <div className="text-sm text-green-600">Materials</div>
            </div>
          </div>
          
          <div className="flex gap-3 pt-4 border-t flex-wrap">
            <button onClick={() => { setAllocatingProject(project); onClose(); }} className="flex-1 py-3 bg-purple-500 text-white rounded-lg font-medium">📅 Allocate Days</button>
            {!isEditing && <button onClick={() => setIsEditing(true)} className="px-6 py-3 bg-purple-100 text-purple-600 rounded-lg font-medium hover:bg-purple-200">✏️ Edit</button>}
            <button onClick={() => deleteProject(project.id)} className="px-6 py-3 bg-red-100 text-red-600 rounded-lg font-medium hover:bg-red-200">🗑️ Delete</button>
            <button onClick={onClose} className="px-6 py-3 bg-gray-200 rounded-lg font-medium">Close</button>
          </div>
        </div>
      </div>
    );
  };

  // ============================================================
  // CUSTOMER VIEWS
  // ============================================================
  
  const CustomerListView = () => (
    <div className="bg-white rounded-lg shadow-lg p-4">
      <h2 className="text-2xl font-bold mb-4">Customers ({customers.length})</h2>
      <div className="grid gap-2 max-h-[calc(100vh-200px)] overflow-y-auto scroll-panel">
        {customers.sort((a, b) => a.name.localeCompare(b.name)).map(c => (
          <div key={c.id} onClick={() => { setSelectedCustomer(c); setView('customerDetail'); }} className="border-2 rounded-lg p-4 hover:bg-gray-50 cursor-pointer flex justify-between items-center touch-target">
            <div>
              <div className="font-bold text-xl">{c.name}</div>
              <div className="flex gap-1 mt-2 flex-wrap">
                {(c.tuningMonths || []).map(m => <span key={m} className="bg-blue-100 text-blue-700 text-sm px-2 py-1 rounded">{monthNames[m].slice(0, 3)}</span>)}
              </div>
            </div>
            <div className="text-right">
              <div className="text-green-600 font-bold text-xl">£{c.customRate || DEFAULT_PRICES.tuning_full}</div>
              <div className="text-gray-400 text-2xl mt-2">→</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  const CustomerDetailView = () => {
    const [localCustomer, setLocalCustomer] = useState(selectedCustomer);
    const customerContacts = contacts.filter(c => c.customerId === selectedCustomer.id);
    const history = getCustomerHistory(selectedCustomer.id);

    const toggleMonth = async (monthIdx) => {
      const months = localCustomer.tuningMonths || [];
      const newMonths = months.includes(monthIdx) ? months.filter(m => m !== monthIdx) : [...months, monthIdx].sort((a, b) => a - b);
      const updated = { ...localCustomer, tuningMonths: newMonths };
      setLocalCustomer(updated);
      await updateCustomer(updated);
    };

    return (
      <div className="bg-white rounded-lg shadow-xl p-6 max-w-4xl mx-auto">
        <div className="flex justify-between items-start mb-6">
          <h2 className="text-3xl font-bold">{localCustomer.name}</h2>
          <button onClick={() => setView('customers')} className="bg-gray-300 px-6 py-3 rounded-lg text-xl touch-target">← Back</button>
        </div>
        
        {customerContacts.length > 0 && (
          <div className="mb-6">
            <h3 className="font-bold text-xl mb-3">👥 Contacts</h3>
            <div className="grid grid-cols-2 gap-4">
              {customerContacts.map(contact => (
                <div key={contact.id} className="bg-gray-50 p-4 rounded-lg">
                  <div className="font-bold">{contact.name}</div>
                  <div className="text-blue-600 text-sm">{contact.role}</div>
                  {contact.phone && <div className="text-lg font-bold text-blue-600 mt-1">📞 {contact.phone}</div>}
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="border-t-2 pt-4 mb-6">
          <h3 className="font-bold text-xl mb-3">📅 Tuning Schedule</h3>
          <div className="grid grid-cols-6 gap-2">
            {monthNames.map((month, idx) => (
              <button key={idx} onClick={() => toggleMonth(idx)} className={`p-4 text-lg rounded-lg border-2 font-medium touch-target ${(localCustomer.tuningMonths || []).includes(idx) ? 'bg-blue-500 text-white border-blue-500' : 'bg-white border-gray-300 hover:border-blue-400'}`}>{month.slice(0, 3)}</button>
            ))}
          </div>
        </div>

        <div className="border-t-2 pt-4">
          <h3 className="font-bold text-xl mb-3">📋 Job History ({history.length})</h3>
          <div className="space-y-2 max-h-60 overflow-y-auto">
            {history.map(booking => (
              <div key={booking.id} className="p-4 rounded-lg bg-gray-50 border-l-4 border-blue-500">
                <div className="flex justify-between">
                  <div className="font-bold">{formatDate(booking.date)}</div>
                  <div className="font-bold">£{booking.price}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  };

  // ============================================================
  // MAIN RENDER
  // ============================================================
  
  return (
    <div className="min-h-screen bg-gray-100 p-3 flex flex-col">
      {/* Header */}
      <div className="bg-white rounded-lg shadow-lg p-4 mb-3 no-print">
        <div className="flex flex-wrap items-center justify-between gap-4">
          <h1 className="text-3xl font-bold">🎹 COMMAND CENTRE</h1>
          
          {view === 'planner' && (
            <div className="relative">
              <input 
                type="text" 
                placeholder="🔍 Search customer..." 
                value={plannerSearch} 
                onChange={(e) => setPlannerSearch(e.target.value)} 
                className="w-64 px-4 py-2 border-2 rounded-lg" 
              />
              {plannerSearch.length > 0 && (
                <div className="absolute top-full left-0 right-0 bg-white border-2 rounded-b-lg shadow-lg max-h-64 overflow-y-auto z-50">
                  {customers.filter(c => c.name.toLowerCase().includes(plannerSearch.toLowerCase())).slice(0, 10).map(c => (
                    <div key={c.id} onMouseDown={(e) => e.preventDefault()} onClick={() => { setSelectedCustomerToBook(c); setBookingType('OTS'); setPlannerSearch(''); }} className="p-3 hover:bg-blue-50 cursor-pointer border-b">
                      <div className="font-medium">{c.name}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
          
          <div className="flex gap-2">
            <button onClick={() => { setView('planner'); setSelectedDay(null); setSelectedCustomer(null); }} className={`px-5 py-3 rounded-lg text-lg font-bold touch-target ${view === 'planner' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>📅 Planner</button>
            <button onClick={() => { setView('customers'); setSelectedCustomer(null); }} className={`px-5 py-3 rounded-lg text-lg font-bold touch-target ${view.includes('customer') ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>👥 Customers</button>
          </div>

          {view === 'planner' && (
            <div className="flex gap-2">
              <button onClick={() => setCurrentDate(new Date(currentYear - 1, 0, 1))} className="px-4 py-3 rounded-lg text-lg font-medium bg-gray-200 touch-target">← {currentYear - 1}</button>
              <button onClick={() => setCurrentDate(new Date())} className="px-4 py-3 rounded-lg text-lg font-medium bg-gray-800 text-white touch-target">{currentYear}</button>
              <button onClick={() => setCurrentDate(new Date(currentYear + 1, 0, 1))} className="px-4 py-3 rounded-lg text-lg font-medium bg-gray-200 touch-target">{currentYear + 1} →</button>
            </div>
          )}

          <button onClick={loadData} className="px-4 py-3 rounded-lg bg-gray-600 text-white text-lg touch-target" title="Refresh">🔄</button>
        </div>
      </div>

      {/* Main Content */}
      {view === 'planner' && (
        <div className="flex gap-3 flex-1">
          {/* LEFT PANEL - inlined to prevent re-render focus loss */}
          <div className="w-80 bg-white rounded-lg shadow-xl p-4 flex flex-col h-full no-print">
            {selectedCustomerToBook && (
              <div className={`border-2 rounded-lg p-4 mb-3 booking-highlight ${selectedTicketToBook ? 'bg-orange-100 border-orange-500' : 'bg-green-100 border-green-500'}`}>
                <div className={`font-bold text-lg ${selectedTicketToBook ? 'text-orange-800' : 'text-green-800'}`}>{selectedTicketToBook ? '🔧 Booking Fault:' : '📍 Booking:'}</div>
                <div className={`font-medium text-lg ${selectedTicketToBook ? 'text-orange-700' : 'text-green-700'}`}>{selectedCustomerToBook.name}</div>
                {selectedTicketToBook && <div className="text-sm text-orange-600 mt-1">"{selectedTicketToBook.description}"</div>}
                
                <div className="grid grid-cols-3 gap-2 mt-3">
                  {[{ type: 'OTS', label: 'OTS', desc: 'With helper' }, { type: 'TSC', label: 'Solo', desc: 'Just me' }, { type: 'WS', label: 'Workshop', desc: 'No travel' }].map(item => (
                    <button key={item.type} onClick={() => setBookingType(item.type)} className={`py-3 rounded-lg text-sm font-medium touch-target ${bookingType === item.type ? 'bg-blue-500 text-white' : 'bg-gray-200'}`}>
                      {item.label}<br/><span className="text-xs opacity-75">{item.desc}</span>
                    </button>
                  ))}
                </div>
                
                <div className="mt-3">
                  <label className="text-sm text-gray-600">Job notes (optional):</label>
                  <input type="text" value={jobNotes} onChange={(e) => setJobNotes(e.target.value)} className="w-full p-3 border rounded-lg text-sm" placeholder="e.g. Fix cipher, service swell" />
                </div>
                
                <div className={`text-lg mt-4 font-bold text-center p-3 rounded-lg ${selectedTicketToBook ? 'text-orange-700 bg-orange-200' : 'text-green-700 bg-green-200'}`}>👆 Now tap a day on the calendar</div>
                <button onClick={() => { setSelectedCustomerToBook(null); setSelectedTicketToBook(null); setCustomQuote(''); setJobNotes(''); }} className="w-full mt-3 py-3 bg-gray-200 rounded-lg text-lg font-medium touch-target">Cancel</button>
              </div>
            )}
            
            {(tickets.length > 0 || showAddTicket) && (
              <div className="mb-4 pb-4 border-b-2">
                <h2 className="text-lg font-bold mb-2">📥 Inbox ({tickets.length})</h2>
                {tickets.map(ticket => {
                  const customer = getCustomerById(ticket.customerId);
                  const isSelected = selectedTicketToBook?.id === ticket.id;
                  return (
                    <div key={ticket.id} onClick={() => selectTicketToBook(ticket)} className={`p-3 rounded-lg cursor-pointer mb-2 border-2 ${isSelected ? 'bg-orange-100 border-orange-500' : 'bg-red-50 border-red-300 hover:border-orange-400'}`}>
                      <div className="flex justify-between items-start">
                        <div className="font-bold">{customer?.name || 'Unknown'}</div>
                        <button onClick={(e) => { e.stopPropagation(); deleteTicket(ticket.id); }} className="text-gray-400 hover:text-red-500 text-sm">✕</button>
                      </div>
                      <div className="text-sm text-gray-700">{ticket.description}</div>
                    </div>
                  );
                })}
              </div>
            )}
            
            {showAddTicket && (
              <div className="mb-4 pb-4 border-b-2 bg-yellow-50 p-3 rounded-lg">
                <div className="font-bold mb-2">New Request</div>
                <input 
                  type="text" 
                  placeholder="Search customer..." 
                  value={customerSearch} 
                  onChange={(e) => setCustomerSearch(e.target.value)} 
                  className="w-full p-2 border rounded mb-2 text-sm" 
                />
                {customerSearch && filteredCustomersForSearch.length > 0 && (
                  <div className="max-h-32 overflow-y-auto mb-2 bg-white border rounded">
                    {filteredCustomersForSearch.map(c => (
                      <div key={c.id} onMouseDown={(e) => e.preventDefault()} onClick={() => { setNewTicketCustomer(c.id); setCustomerSearch(c.name); }} className={`p-2 cursor-pointer hover:bg-blue-50 text-sm ${newTicketCustomer === c.id ? 'bg-blue-100' : ''}`}>{c.name}</div>
                    ))}
                  </div>
                )}
                <input 
                  type="text" 
                  placeholder="What's the problem?" 
                  value={newTicketDescription} 
                  onChange={(e) => setNewTicketDescription(e.target.value)} 
                  className="w-full p-2 border rounded mb-2 text-sm" 
                />
                <div className="flex gap-2">
                  <button onClick={addTicket} disabled={!newTicketCustomer || !newTicketDescription} className="flex-1 py-2 bg-green-500 text-white rounded font-medium disabled:opacity-50">Save</button>
                  <button onClick={() => { setShowAddTicket(false); setNewTicketCustomer(''); setNewTicketDescription(''); setCustomerSearch(''); }} className="flex-1 py-2 bg-gray-300 rounded font-medium">Cancel</button>
                </div>
              </div>
            )}

            {!showAddTicket && !selectedCustomerToBook && !allocatingProject && (
              <button onClick={() => setShowAddTicket(true)} className="w-full py-3 mb-3 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg font-medium touch-target border-2 border-red-300">+ Log Fault / Request</button>
            )}

            <div className="mb-4">
              <div className="flex justify-between items-center mb-2">
                <h2 className="text-lg font-bold">🔧 Big Jobs</h2>
                {!allocatingProject && <button onClick={() => setShowNewProject(true)} className="text-sm bg-purple-100 hover:bg-purple-200 text-purple-700 px-3 py-1 rounded">+ New</button>}
              </div>
              
              {showNewProject && (
                <div className="bg-purple-50 border-2 border-purple-300 rounded-lg p-3 mb-2">
                  <div className="relative mb-2">
                    <input type="text" placeholder="Search customer..." value={projectCustomerSearch} onChange={(e) => { setProjectCustomerSearch(e.target.value); setNewProjectCustomer(null); }} className="w-full p-2 border rounded" />
                    {projectCustomerSearch && !newProjectCustomer && filteredCustomersForProject.length > 0 && (
                      <div className="absolute top-full left-0 right-0 bg-white border rounded-b shadow-lg max-h-40 overflow-y-auto z-10">
                        {filteredCustomersForProject.map(c => (
                          <div key={c.id} onMouseDown={(e) => e.preventDefault()} onClick={() => { setNewProjectCustomer(c); setProjectCustomerSearch(c.name); }} className="p-2 hover:bg-purple-50 cursor-pointer border-b">{c.name}</div>
                        ))}
                      </div>
                    )}
                  </div>
                  {newProjectCustomer && (
                    <div className="bg-purple-100 p-2 rounded mb-2 flex justify-between items-center">
                      <span className="font-medium">{newProjectCustomer.name}</span>
                      <button onClick={() => { setNewProjectCustomer(null); setProjectCustomerSearch(''); }} className="text-gray-500">✕</button>
                    </div>
                  )}
                  <input type="text" placeholder="Project name..." value={newProjectName} onChange={(e) => setNewProjectName(e.target.value)} className="w-full p-2 border rounded mb-2" />
                  <input type="number" placeholder="Est. days" value={newProjectEstDays} onChange={(e) => setNewProjectEstDays(e.target.value)} className="w-full p-2 border rounded mb-2" />
                  <div className="flex gap-2 mb-2 items-center">
                    <select value={newProjectYearStart} onChange={(e) => { setNewProjectYearStart(parseInt(e.target.value)); if (parseInt(e.target.value) > newProjectYearEnd) setNewProjectYearEnd(parseInt(e.target.value)); }} className="flex-1 p-2 border rounded bg-white">
                      {[currentYear, currentYear + 1, currentYear + 2, currentYear + 3].map(y => (
                        <option key={y} value={y}>{y}</option>
                      ))}
                    </select>
                    <span className="text-gray-500">→</span>
                    <select value={newProjectYearEnd} onChange={(e) => setNewProjectYearEnd(parseInt(e.target.value))} className="flex-1 p-2 border rounded bg-white">
                      {[currentYear, currentYear + 1, currentYear + 2, currentYear + 3].filter(y => y >= newProjectYearStart).map(y => (
                        <option key={y} value={y}>{y}</option>
                      ))}
                    </select>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => { setShowNewProject(false); setNewProjectName(''); setNewProjectCustomer(null); setProjectCustomerSearch(''); setNewProjectEstDays(''); setNewProjectYearStart(currentYear); setNewProjectYearEnd(currentYear); }} className="flex-1 py-2 bg-gray-200 rounded">Cancel</button>
                    <button onClick={createProject} disabled={!newProjectName || !newProjectCustomer} className="flex-1 py-2 bg-purple-500 text-white rounded disabled:opacity-50">Create</button>
                  </div>
                </div>
              )}
              
              {allocatingProject && (
                <div className="bg-purple-500 text-white rounded-lg p-3 mb-2">
                  <div className="font-bold">📍 Allocating Days</div>
                  <div className="text-sm opacity-80">{allocatingProject.customerName}</div>
                  <div className="font-medium">{allocatingProject.name}</div>
                  {allocatingProject.estimatedDays && <div className="text-sm mt-1">{bookings.filter(b => b.type === 'project' && b.projectId === allocatingProject.id).length} of {allocatingProject.estimatedDays} days</div>}
                  <div className="text-xs mt-2 opacity-80">Tap days to add/remove</div>
                  <button onClick={() => setAllocatingProject(null)} className="mt-2 w-full py-2 bg-white text-purple-700 rounded font-medium">Done</button>
                </div>
              )}
              
              {!showNewProject && !allocatingProject && activeProjects.length > 0 && (
                <div className="space-y-2 max-h-48 overflow-y-auto scroll-panel">
                  {activeProjects.map(project => {
                    const yearStart = project.yearStart || project.targetYear;
                    const yearEnd = project.yearEnd || project.targetYear;
                    const yearLabel = yearStart === yearEnd ? yearStart : `${yearStart}-${yearEnd}`;
                    return (
                      <div key={project.id} onClick={() => setShowProjectSummary(project)} className="bg-purple-50 border-2 border-purple-200 rounded-lg p-3 cursor-pointer hover:border-purple-400">
                        <div className="flex justify-between items-start">
                          <div className="text-sm text-gray-600">{project.customerName}</div>
                          {yearLabel && <span className="text-xs bg-purple-200 text-purple-700 px-2 py-0.5 rounded">{yearLabel}</span>}
                        </div>
                        <div className="font-medium">{project.name}</div>
                        <div className="flex justify-between items-center mt-1">
                          <span className="text-sm text-purple-600">{project.estimatedDays ? `${project.days.length}/${project.estimatedDays} days` : `${project.days.length} days`}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            <h2 className="text-xl font-bold mb-3">📋 Tunings Due</h2>
            <div className="flex-1 overflow-y-auto space-y-2 scroll-panel">
              {jobsDue.length === 0 ? (
                <div className="text-center py-8"><div className="text-5xl mb-3">🎉</div><p className="text-gray-500 text-lg">All caught up!</p></div>
              ) : (
                jobsDue.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedCustomerToBook(item.customer); setBookingType('OTS'); setCustomQuote(''); setJobNotes(''); }}
                    className={`p-4 rounded-lg cursor-pointer transition-all touch-target ${item.urgent ? 'bg-amber-50 border-2 border-amber-400' : 'bg-gray-50 border-2 border-gray-200'} ${selectedCustomerToBook?.id === item.customer.id ? 'ring-4 ring-green-500' : 'hover:border-blue-400'}`}>
                    <div className="font-bold text-lg">{item.customer.name}</div>
                    <div className="flex justify-between items-center mt-1">
                      <span className={`text-sm ${item.urgent ? 'text-amber-700 font-bold' : 'text-gray-400'}`}>{item.monthName} {item.urgent && '⚠️'}</span>
                    </div>
                  </div>
                ))
              )}
            </div>

            {(stats.needsInvoicing > 0 || stats.awaitingPayment > 0) && (
              <div className="mt-4 pt-4 border-t space-y-2">
                {stats.needsInvoicing > 0 && <div className="bg-amber-100 p-3 rounded-lg"><div className="font-bold text-amber-800">📧 {stats.needsInvoicing} need invoicing</div><div className="text-amber-700">£{stats.uninvoicedTotal.toLocaleString()}</div></div>}
                {stats.awaitingPayment > 0 && <div className="bg-blue-100 p-3 rounded-lg"><div className="font-bold text-blue-800">💷 {stats.awaitingPayment} awaiting payment</div><div className="text-blue-700">£{stats.awaitingTotal.toLocaleString()}</div></div>}
              </div>
            )}
          </div>
          <div className="flex-1 flex flex-col">
            <CapacityBar />
            <YearView />
          </div>
          {selectedDay && <DayPanel date={selectedDay} onClose={() => setSelectedDay(null)} />}
        </div>
      )}

      {view === 'customers' && <CustomerListView />}
      {view === 'customerDetail' && selectedCustomer && <CustomerDetailView />}
      
      {showProjectSummary && <ProjectSummaryModal project={showProjectSummary} onClose={() => setShowProjectSummary(null)} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<CommandCentre />);
  </script>
</body>
</html>
