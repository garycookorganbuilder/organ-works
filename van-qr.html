<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Van QR Code</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }
    h1 { margin-bottom: 10px; }
    p { color: #666; margin-bottom: 30px; }
    .qr-container {
      display: inline-block;
      padding: 20px;
      background: white;
      border: 4px solid #000;
      border-radius: 12px;
    }
    .label {
      margin-top: 20px;
      font-size: 28px;
      font-weight: bold;
    }
    .url {
      margin-top: 10px;
      font-size: 11px;
      color: #888;
      word-break: break-all;
    }
    .print-btn {
      margin-top: 30px;
      padding: 15px 40px;
      font-size: 18px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    @media print {
      .no-print { display: none; }
      body { margin: 0; padding: 40px; }
    }
  </style>
</head>
<body>
  <h1 class="no-print">🚐 Van QR Code</h1>
  <p class="no-print">Print this and stick it in the van. Scan when you arrive on site.</p>
  
  <div class="qr-container">
    <img id="qrImage" src="" alt="QR Code" width="300" height="300">
  </div>
  <div class="label">📍 ON SITE</div>
  <div class="url" id="urlDisplay"></div>
  
  <br><br>
  <button class="print-btn no-print" onclick="window.print()">🖨️ Print QR Code</button>
  
  <script>
    // Change this to your GitHub Pages URL
    const TRACKER_URL = 'https://garycookorganbuilder.github.io/organ-works/site-tracker.html';
    
    document.getElementById('urlDisplay').textContent = TRACKER_URL;
    
    // Use QR Server API to generate QR code (free, no API key needed)
    const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(TRACKER_URL);
    document.getElementById('qrImage').src = qrUrl;
  </script>
</body>
</html>
